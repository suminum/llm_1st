    <h1>14단원 연습문제 정답 — Open API 와 Postman</h1>

    <p class="guide">
      <strong>답만 보지 마세요.</strong> 코드 아래의 <strong>★</strong> 설명이 본론입니다.
      <br /><br />
      <strong>F12 → Console</strong> 을 열고 눌러 보세요.
    </p>

    <div class="demo">
      <button id="풀기">정답 실행</button>
      <div class="output" id="결과">버튼을 눌러 보세요</div>
    </div>

    <!-- 인터넷이 막혀 6·7이 안 되면 아래 줄의 주석 기호를 지우세요. -->
    <!-- <script src="오프라인_대체.js"></script> -->
    <script>
      // ───── 문제 1 ───── (개념02)

      const 조건 = { 종류: "프레스", 이름: undefined, 개수: 0, 메모: null, 정렬: "이름", 비고: "" };

      function 쿼리만들기(조건) {
        const 쿼리 = new URLSearchParams();

        for (const [이름, 값] of Object.entries(조건)) {
          // ★ `!값` 으로 쓰면 안 됩니다. 0 이 같이 걸러집니다.
          if (값 === undefined || 값 === null || 값 === "") continue;
          쿼리.set(이름, 값);
        }

        return 쿼리;
      }

      // ★★ 여기서 `if (!값) continue;` 를 쓰면 `개수=0` 이 사라집니다.
      //   0 은 거짓으로 취급되기 때문입니다. (01단원 개념04)
      //   "값이 있느냐" 를 물을 때는 `=== undefined` 처럼 또렷하게 쓰세요.
      //
      // ★ 순서는 넣은 순서 그대로 유지됩니다. 종류 → 개수 → 정렬.
      //   `이름`·`메모`·`비고` 만 빠졌습니다.

      // ───── 문제 2 ───── (개념02)

      function 설비주소(이름) {
        // ★ 경로에는 encodeURIComponent 를 씁니다. URLSearchParams 가 아닙니다.
        return `https://예시.com/설비/${encodeURIComponent(이름)}`;
      }

      // ★★★ 왜 URLSearchParams 를 못 쓰나 —
      //   그건 `이름=값&이름=값` 모양을 만드는 도구입니다. 경로용이 아닙니다.
      //   그리고 공백을 `+` 로 바꾸는데, **경로에서 `+` 는 공백이 아닙니다.**
      //
      //     new URL("https://x.com/a+b").pathname   →  "/a+b"
      //
      //   `3호+프레스` 라는 이름의 설비를 찾게 됩니다. 그런 건 없습니다.
      //
      // ★ 도메인의 한글은 그대로 남습니다. `new URL()` 로 감싸지 않았으니까요.
      //   fetch 에 넣으면 그때 브라우저가 퓨니코드로 바꿔서 보냅니다.

      // ───── 문제 3 ───── (개념04)

      const 인코딩키 = "abc%2Bdef%2Fghi%3D";
      const 디코딩키 = "abc+def/ghi=";

      function 키쿼리() {
        const 쿼리 = new URLSearchParams();
        // ★ URLSearchParams 가 알아서 인코딩하니 **디코딩 키**를 넣습니다.
        쿼리.set("serviceKey", 디코딩키);
        return 쿼리.toString();
      }

      // ★★★ 인코딩 키를 넣으면 `%` 가 `%25` 로 또 바뀝니다.
      //
      //     serviceKey=abc%252Bdef%252Fghi%253D
      //
      //   서버는 `abc%2Bdef%2Fghi%3D` 라는 글자를 키로 읽습니다. 그런 키는 없습니다.
      //   → "등록되지 않은 키"
      //
      // ★★ 반대로 주소를 손으로 이어 붙일 때는 **인코딩 키**를 씁니다.
      //   디코딩 키를 그대로 이어 붙이면 `+` 가 공백으로 읽혀서 역시 틀립니다.
      //
      //   ★ 헷갈리면 그냥 URLSearchParams 만 쓰세요. 그럼 디코딩 키 하나만 기억하면 됩니다.

      // ───── 문제 4 ───── (개념05)

      async function 안전하게읽기(응답) {
        if (!응답.ok) {
          return { 됐나: false, 값: `서버가 ${응답.status} 를 보냈습니다` };
        }

        const 종류 = 응답.headers.get("content-type") ?? "";
        if (!종류.includes("application/json")) {
          // ★ `text/html; charset=utf-8` 처럼 뒤에 뭐가 붙을 수 있으니
          //   `===` 가 아니라 `includes` 로 봅니다.
          return { 됐나: false, 값: `JSON 이 아닙니다: ${종류}` };
        }

        try {
          return { 됐나: true, 값: await 응답.json() };
        } catch (오류) {
          // ★ 여기까지 왔는데 파싱이 안 되는 경우도 있습니다.
          //   Content-Type 은 JSON 이라는데 내용이 깨진 경우입니다.
          return { 됐나: false, 값: `JSON 을 읽지 못했습니다: ${오류.message}` };
        }
      }

      // ★★ 세 겹으로 막았습니다. 하나만으로는 부족합니다.
      //
      //   `응답.ok` 만 보면    → 200 인데 HTML 인 경우를 놓칩니다
      //   Content-Type 만 보면 → 500 인데 JSON 오류 본문인 경우를 놓칩니다
      //   try/catch 만 하면   → 왜 실패했는지 못 알려 줍니다
      //
      // ★★★ throw 대신 `{ 됐나, 값 }` 을 돌려준 이유
      //   부르는 쪽이 try/catch 를 안 써도 됩니다. 그리고 **빠뜨릴 수가 없습니다.**
      //   `.값` 을 쓰려면 `.됐나` 를 지나야 하니까요.
      //   ★ 정답은 없습니다. 팀에서 하나로 정하고 그대로 쓰는 게 중요합니다.

      // ───── 문제 5 ───── (개념05)

      function 무슨말(오류) {
        if (오류.name === "TimeoutError") return "서버가 느립니다";
        if (오류.name === "TypeError") return "연결할 수 없습니다";
        return "알 수 없는 문제입니다";
      }

      // ★★ `오류.message` 가 아니라 `오류.name` 을 봅니다.
      //   message 는 브라우저마다 다릅니다. name 은 규격에 정해져 있습니다.
      //
      // ★ `TypeError: Failed to fetch` 는 원인이 여럿입니다.
      //     · 인터넷이 끊김
      //     · 주소가 아예 없음
      //     · ★ CORS 에 막힘
      //   코드에서는 이 셋을 못 가릅니다. 그래서 말을 뭉뚱그릴 수밖에 없습니다.
      //   ★★ 개발자는 콘솔을 봐야 하고, 사용자에게는 "연결할 수 없습니다" 면 충분합니다.

      // ───── 문제 6 ───── (개념01·02)

      const 도시들 = { 서울: [37.5665, 126.978], 부산: [35.1796, 129.0756], 제주: [33.4996, 126.5312] };

      async function 기온(도시이름, 옵션 = {}) {
        const 좌표 = 도시들[도시이름];
        if (!좌표) throw new Error(`모르는 도시입니다: ${도시이름}`);

        const 주소 = new URL("https://api.open-meteo.com/v1/forecast");
        주소.searchParams.set("latitude", 좌표[0]);
        주소.searchParams.set("longitude", 좌표[1]);
        주소.searchParams.set("current", "temperature_2m");
        주소.searchParams.set("timezone", "Asia/Seoul");

        const 응답 = await fetch(주소, 옵션);
        const 읽은것 = await 안전하게읽기(응답); // ★ 문제 4를 그대로 씁니다
        if (!읽은것.됐나) throw new Error(읽은것.값);

        const 자료 = 읽은것.값;
        // ★ 단위를 짐작하지 않고 응답에서 꺼냅니다
        return `${도시이름} ${자료.current.temperature_2m}${자료.current_units.temperature_2m}`;
      }

      // ★★ 문제 4에서 만든 것을 여기서 씁니다. 연습문제가 이어집니다.
      //   실제 코드도 이렇게 쌓입니다. 안전 장치를 한 번 만들어 두고 계속 씁니다.
      //
      // ★ `옵션` 을 받게 해 둔 것은 문제 7 때문입니다.
      //   같은 함수에 시간 제한만 얹으려고요. 함수를 또 만들지 않습니다.

      // ───── 문제 7 ───── (개념05)

      async function 기온_시간제한(도시이름, 제한밀리초) {
        try {
          return await 기온(도시이름, { signal: AbortSignal.timeout(제한밀리초) });
        } catch (오류) {
          return 무슨말(오류); // ★ 문제 5를 그대로 씁니다
        }
      }

      // ★★ `AbortSignal.timeout()` 은 fetch 의 `signal` 로 넘깁니다.
      //   따로 설치할 것도, 타이머를 손으로 지울 것도 없습니다.
      //
      // ★★★ `try` 안에 `await` 가 꼭 있어야 합니다.
      //   `return 기온(...)` 처럼 await 를 빼면 **catch 가 안 걸립니다.**
      //   약속(Promise)만 돌려주고 함수가 끝나 버리기 때문입니다.
      //   ★ 12단원 개념05 에서 본 그 함정입니다.

      // ============================================================
      // 실행
      // ============================================================

      document.getElementById("풀기").addEventListener("click", async () => {
        const 줄들 = [];
        const 적기 = (무엇) => {
          줄들.push(String(무엇));
          console.log(무엇);
        };

        적기(decodeURIComponent(String(쿼리만들기(조건))));
        // 콘솔: 종류=프레스&개수=0&정렬=이름
        적기(설비주소("3호 프레스"));
        // 콘솔: https://예시.com/설비/3%ED%98%B8%20%ED%94%84%EB%A0%88%EC%8A%A4
        적기(키쿼리());
        // 콘솔: serviceKey=abc%2Bdef%2Fghi%3D

        const 좋은응답 = new Response(JSON.stringify({ 이름: "3호 프레스" }), {
          headers: { "Content-Type": "application/json" },
        });
        const 오백 = new Response("{}", { status: 500, headers: { "Content-Type": "application/json" } });
        const 에이치티엠엘 = new Response("<html></html>", { headers: { "Content-Type": "text/html" } });

        적기(JSON.stringify(await 안전하게읽기(좋은응답)));
        // 콘솔: {"됐나":true,"값":{"이름":"3호 프레스"}}
        적기(JSON.stringify(await 안전하게읽기(오백)));
        // 콘솔: {"됐나":false,"값":"서버가 500 를 보냈습니다"}
        적기(JSON.stringify(await 안전하게읽기(에이치티엠엘)));
        // 콘솔: {"됐나":false,"값":"JSON 이 아닙니다: text/html"}

        적기(무슨말({ name: "TimeoutError" }));
        // 콘솔: 서버가 느립니다
        적기(무슨말({ name: "TypeError" }));
        // 콘솔: 연결할 수 없습니다
        적기(무슨말({ name: "이상한오류" }));
        // 콘솔: 알 수 없는 문제입니다

        try {
          적기(await 기온("서울"));
          적기(await 기온_시간제한("서울", 1));
          // 콘솔: 서버가 느립니다
        } catch (오류) {
          적기("6·7번에서 오류: " + 오류.message);
        }

        document.getElementById("결과").innerHTML = 줄들.join("<br>");
      });

      // ★ 6번의 출력은 못 박지 않았습니다. 진짜 기온이라 누를 때마다 다릅니다.
      //   `서울 29.7°C` 처럼 나오면 맞은 것입니다.

      // ============================================================
      // [손으로] 푸는 문제 — 모범 답안
      // ============================================================
      //
      // ───── 문제 8 ─────
      // "Postman 에서는 200 인데 브라우저에서는 빨간 오류"
      //
      // 답:
      //   (1) 코드 문제가 아닙니다. 코드를 고쳐도 안 됩니다.
      //
      //   (2) CORS 입니다. 그 서버가 `Access-Control-Allow-Origin` 헤더를 안 줍니다.
      //       ★ 브라우저만 이 규칙을 지킵니다. Postman·curl·node 는 안 지킵니다.
      //         그래서 Postman 에서는 되는 것입니다. **서버는 아무 잘못이 없습니다.**
      //
      //   (3) 지금 이 과정에서 할 수 있는 것
      //       · 브라우저에서 되는 API 로 바꿉니다 (Open-Meteo 처럼)
      //       · 확인만 할 거면 Postman 으로 합니다
      //       · ★ 진짜 해결은 **내 서버를 하나 두는 것**입니다 (PART 3)
      //
      //   ★★ 하면 안 되는 것 — 브라우저의 보안 설정을 끄는 것.
      //     내 컴퓨터만 뚫리고, 다른 사이트에도 구멍이 납니다.
      //     그리고 **남의 브라우저에서는 여전히 안 됩니다.** 아무것도 해결 안 됩니다.
      //
      // ───── 문제 9 ─────
      // "키를 key.js 로 빼면 안전한가요?"
      //
      // 답:
      //   (1) 안전해지지 않습니다. 하나도요.
      //
      //   (2) `key.js` 도 브라우저가 **내려받는 파일**입니다.
      //       F12 → Sources 에 그 파일이 그대로 보입니다. 주소를 알면 누구나 받습니다.
      //       ★ 파일을 나눈 것은 **사람 눈에 안 보이게** 한 것뿐입니다.
      //         브라우저에게는 아무것도 안 숨겨졌습니다.
      //
      //       ★★ 빌드해서 압축해도 같습니다. 글자는 그대로 남습니다.
      //         `.gitignore` 에 넣는 것도 다릅니다. 그건 git 에만 안 올리는 것입니다.
      //         배포하면 어차피 나갑니다.
      //
      //   (3) 진짜 해결책 — 키를 **서버에 두고** 브라우저는 내 서버만 부릅니다.
      //       브라우저가 키를 아예 모르게 만드는 것 말고는 방법이 없습니다.
      //
      //   ★ "숨긴다" 와 "안 보낸다" 는 다릅니다. 숨기는 건 다 뚫립니다.
      //
      // ───── 문제 10 ─────
      // 공공데이터포털 "등록되지 않은 키"
      //
      // 답:
      //   (1) ★ **이중 인코딩**을 제일 먼저 의심합니다. 이게 압도적으로 많습니다.
      //       포털의 Encoding 키를 URLSearchParams 에 넣은 경우입니다.
      //
      //   (2) 어떻게 확인하나 — **실제로 나간 주소를 봅니다.**
      //       F12 → Network → 그 요청 → Request URL.
      //       `%25` 가 보이면 두 번 인코딩된 것입니다.
      //       ★ 코드를 읽지 말고 나간 것을 보세요. 5초면 끝납니다.
      //
      //   (3) 그게 아니라면
      //       · 승인이 아직 안 됐거나, 승인 직후라 아직 안 도는 경우 (몇십 분)
      //       · 신청한 것과 **다른 API** 를 부른 경우 (키는 API 별로 승인됩니다)
      //       · 키 앞뒤에 공백이나 줄바꿈이 딸려온 경우 (복사할 때 흔합니다)
      //       · 개발계정 키와 운영계정 키를 헷갈린 경우
      //
      //   ★ 그리고 Postman 으로 한 번 보내 보세요. 거기서도 안 되면 키 문제가 맞습니다.
      //
      // ───── 문제 11 ─────
      // 새 API 를 처음 쓸 때
      //
      // 답:
      //   (1) 네 가지 — 주소 / 방식 / 보낼 값 / 응답 모양
      //
      //   (2) 믿으면 안 됩니다. 문서는 낡습니다.
      //       ★ 한 번 받아서 `JSON.stringify(자료, null, 2)` 로 **눈으로 보세요.**
      //         이게 문서 열 페이지보다 빠릅니다.
      //
      //   (3) ★★★ 좌표 격자입니다.
      //       서울이 37.5665 → 37.55 로 떨어지는 걸 보고 "0.05도 간격" 이라고 했는데,
      //       부산은 129.0756 → 129.0625 였습니다. 안 맞았습니다.
      //
      //       배운 것 — **하나만 보고 규칙을 정하지 않는다.**
      //       "몇 개 해 보니 이렇더라" 는 자주 틀립니다.
