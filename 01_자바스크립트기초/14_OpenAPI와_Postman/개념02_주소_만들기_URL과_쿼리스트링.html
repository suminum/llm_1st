<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>14단원 개념02 - 주소 만들기 (URL 과 쿼리스트링)</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      button {
        padding: 8px 16px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        margin-right: 6px;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 8px;
        min-height: 24px;
        word-break: break-all;
        font-size: 13px;
      }
      ul {
        padding-left: 22px;
        margin: 0;
      }
      li {
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <h1>개념 02 — 주소 만들기 (URL 과 쿼리스트링)</h1>

    <p class="guide">
      <strong>인터넷이 없어도 됩니다.</strong> 이 파일은 주소를 만드는 것만 다룹니다.
      <strong>F12 → Console</strong> 을 열고 버튼을 눌러 보세요.
      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong>
      <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>① 손으로 이어 붙이기 vs URL 쓰기</h3>
      <button id="b1">비교해 보기</button>
      <div class="output" id="out1">버튼을 눌러 보세요</div>

      <h3>② 공백은 어떻게 바뀌나</h3>
      <button id="b2">공백 넣어 보기</button>
      <div class="output" id="out2">버튼을 눌러 보세요</div>

      <h3>③ set 과 append</h3>
      <button id="b3">둘을 비교</button>
      <div class="output" id="out3">버튼을 눌러 보세요</div>

      <h3>④ 값이 없을 때</h3>
      <button id="b4">빈 값을 넣어 보기</button>
      <div class="output" id="out4">버튼을 눌러 보세요</div>
    </div>

    <script>
      // ── 섹션 1: 쿼리스트링이 무엇인가 ──
      //
      //   https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98
      //   └────────── 주소 ──────────────────┘ └──────── 쿼리스트링 ────────┘
      //
      //   · `?` 부터가 쿼리스트링입니다
      //   · `이름=값` 을 `&` 로 잇습니다
      //   · 순서는 대개 상관없습니다
      //
      // ★ 이건 **주소의 일부**입니다. 그래서 주소에 못 쓰는 글자는 못 넣습니다.
      //   한글, 공백, `&`, `=`, `%`, `+` … 전부 못 넣습니다.
      //   그런데 우리는 넣어야 합니다. "3호 프레스" 를 검색해야 하니까요.
      //
      //   ★★ 그래서 **바꿔서** 넣습니다. 그 규칙을 이 파일에서 봅니다.

      // ✏️ 직접 해보기 1 — 개념01 에서 만들어진 주소를 보고 `?` 뒤를
      //                      `이름=값` 단위로 끊어 종이에 적어 보세요.

      // ── 섹션 2: 손으로 이어 붙이면 생기는 일 ──

      document.getElementById("b1").addEventListener("click", () => {
        const 검색어 = "3호 프레스";

        // [나쁜 방법] 글자를 그냥 이어 붙입니다
        const 손으로 = `https://예시.com/search?q=${검색어}&page=1`;

        // [좋은 방법] URL 에게 맡깁니다
        const 제대로 = new URL("https://예시.com/search");
        제대로.searchParams.set("q", 검색어);
        제대로.searchParams.set("page", "1");

        console.log("손으로:", 손으로);
        // 콘솔: 손으로: https://예시.com/search?q=3호 프레스&page=1
        console.log("URL로 :", 제대로.toString());
        // 콘솔: URL로 : https://xn--vv4b11d.com/search?q=3%ED%98%B8+%ED%94%84%EB%A0%88%EC%8A%A4&page=1

        document.getElementById("out1").innerHTML =
          `<b>손으로</b><br>${손으로}<br><br><b>URL로</b><br>${제대로.toString()}`;
      });

      // ★★★ 두 가지가 달라졌습니다.
      //
      //   (1) `3호 프레스` 가 `3%ED%98%B8+%ED%94%84%EB%A0%88%EC%8A%A4` 가 됐습니다
      //       한글과 공백이 주소에 쓸 수 있는 글자로 바뀐 것입니다.
      //
      //   (2) `예시.com` 이 `xn--vv4b11d.com` 이 됐습니다
      //       ★ 한글 도메인도 실제로는 영문으로 바뀌어 나갑니다. (퓨니코드)
      //         주소창에만 한글로 보여 주는 것입니다.
      //
      // ★ "손으로 한 것도 브라우저에서 되던데요?" — 맞습니다.
      //   fetch 에 넣으면 브라우저가 알아서 고쳐 줍니다.
      //   그런데 **고쳐 주는 규칙이 자리마다 다릅니다.** 섹션 5에서 봅니다.
      //   맡기지 말고 내가 정하는 게 낫습니다.

      // ✏️ 직접 해보기 2 — 검색어를 "A&B" 로 바꿔서 눌러 보세요.
      //                      손으로 이어 붙인 쪽과 URL 쪽이 어떻게 달라집니까?

      // ── 섹션 3: ★★ 공백은 `+` 가 됩니다 ──

      document.getElementById("b2").addEventListener("click", () => {
        const 검색어 = "3호 프레스";

        const 쿼리 = new URLSearchParams();
        쿼리.set("q", 검색어);

        console.log("URLSearchParams :", 쿼리.toString());
        // 콘솔: URLSearchParams : q=3%ED%98%B8+%ED%94%84%EB%A0%88%EC%8A%A4
        console.log("encodeURIComponent:", encodeURIComponent(검색어));
        // 콘솔: encodeURIComponent: 3%ED%98%B8%20%ED%94%84%EB%A0%88%EC%8A%A4

        const 되읽기1 = new URLSearchParams("q=a+b").get("q");
        const 되읽기2 = new URLSearchParams("q=a%20b").get("q");
        console.log("`a+b` 를 되읽으면 :", JSON.stringify(되읽기1));
        // 콘솔: `a+b` 를 되읽으면 : "a b"
        console.log("`a%20b` 를 되읽으면:", JSON.stringify(되읽기2));
        // 콘솔: `a%20b` 를 되읽으면: "a b"

        document.getElementById("out2").innerHTML =
          `URLSearchParams → <b>${쿼리.toString()}</b><br>` +
          `encodeURIComponent → <b>${encodeURIComponent(검색어)}</b><br><br>` +
          `둘 다 되읽으면 → ${JSON.stringify(되읽기1)} / ${JSON.stringify(되읽기2)}`;
      });

      // ★★★ 같은 공백인데 **한쪽은 `+`, 한쪽은 `%20`** 입니다.
      //
      //   URLSearchParams   공백 → `+`
      //   encodeURIComponent 공백 → `%20`
      //
      //   ★ 왜 다르냐 — 쿼리스트링에는 옛날부터 내려오는 규칙이 따로 있습니다.
      //     폼(form)을 보낼 때 쓰던 방식이고, 거기서는 공백을 `+` 로 씁니다.
      //     URLSearchParams 는 그 규칙을 따릅니다.
      //
      //   ★★ 둘 다 되읽으면 `"a b"` 로 똑같이 나옵니다. 그래서 대개 문제가 없습니다.
      //     쿼리스트링을 읽는 쪽은 `+` 를 공백으로 되돌리게 돼 있습니다.
      //
      // ★★★ 그런데 **경로(path)에서는 다릅니다.**
      //
      //   new URL("https://x.com/a+b").pathname    →  "/a+b"     ← + 가 그냥 + 입니다
      //   new URL("https://x.com/a%20b").pathname  →  "/a%20b"
      //
      //   경로에서 `+` 는 공백이 아니라 그냥 더하기 기호입니다.
      //   ★ 그래서 **경로에 값을 끼울 때는 `encodeURIComponent` 를 쓰세요.**
      //     쿼리에는 URLSearchParams 를 쓰고요. 자리에 따라 도구가 다릅니다.
      //
      //     const 이름 = "3호 프레스";
      //     const 주소 = `https://예시.com/설비/${encodeURIComponent(이름)}`;

      // ✏️ 직접 해보기 3 — 콘솔에 `encodeURIComponent("가+나")` 를 직접 쳐 보세요.
      //                      `+` 가 어떻게 바뀝니까?

      // ── 섹션 4: set 과 append ──

      document.getElementById("b3").addEventListener("click", () => {
        const 에이 = new URLSearchParams();
        에이.append("종류", "프레스");
        에이.append("종류", "절단기");

        const 비 = new URLSearchParams();
        비.set("종류", "프레스");
        비.set("종류", "절단기");

        console.log("append 두 번:", decodeURIComponent(에이.toString()));
        // 콘솔: append 두 번: 종류=프레스&종류=절단기
        console.log("set 두 번   :", decodeURIComponent(비.toString()));
        // 콘솔: set 두 번   : 종류=절단기

        document.getElementById("out3").innerHTML =
          `append 두 번 → <b>${decodeURIComponent(에이.toString())}</b><br>` +
          `set 두 번 → <b>${decodeURIComponent(비.toString())}</b>`;
      });

      // ★ 보기 좋으라고 `decodeURIComponent` 로 되돌려서 찍었습니다.
      //   실제로 나가는 것은 `%EC%A2%85%EB%A5%98=...` 입니다.
      //
      // ★★ `set` 은 갈아 끼우고, `append` 는 덧붙입니다.
      //   같은 이름을 여러 개 보내야 하는 API 가 있습니다. (`종류=프레스&종류=절단기`)
      //   그럴 때만 append 를 쓰고, 평소에는 set 을 쓰세요.
      //   ★ 반복문 안에서 set 을 쓰면 **마지막 것만 남습니다.** 흔한 실수입니다.

      // ✏️ 직접 해보기 4 — 반복문으로 `set("종류", 값)` 을 세 번 돌려 보세요.
      //                      마지막 것만 남는 것을 확인하고, append 로 바꿔 보세요.

      // ── 섹션 5: ★ 값이 없을 때가 제일 위험합니다 ──

      document.getElementById("b4").addEventListener("click", () => {
        let 설비이름; // 값을 안 넣었습니다 → undefined

        const 쿼리 = new URLSearchParams();
        쿼리.set("a", 설비이름);
        쿼리.set("b", null);
        쿼리.set("c", "");
        쿼리.set("d", 0);

        console.log(쿼리.toString());
        // 콘솔: a=undefined&b=null&c=&d=0

        document.getElementById("out4").innerHTML = `<b>${쿼리.toString()}</b>`;
      });

      // ★★★ `undefined` 가 **글자 "undefined" 로** 들어갔습니다.
      //
      //   서버는 이름이 "undefined" 인 설비를 찾게 됩니다.
      //   당연히 0건이 나옵니다. 그런데 **오류는 안 납니다.**
      //   "왜 검색이 안 되지?" 하고 코드를 한참 봅니다.
      //
      // ★★ `null` 도 마찬가지로 글자 "null" 이 됩니다.
      //   `0` 은 제대로 `0` 이 됩니다. `""` 는 빈 값으로 들어갑니다.
      //
      // ★ 그래서 넣기 전에 거릅니다.
      //
      //     const 조건 = { 종류: "프레스", 이름: undefined, 개수: 0 };
      //
      //     const 쿼리 = new URLSearchParams();
      //     for (const [이름, 값] of Object.entries(조건)) {
      //       if (값 === undefined || 값 === null || 값 === "") continue;
      //       쿼리.set(이름, 값);
      //     }
      //     console.log(decodeURIComponent(쿼리.toString()));
      //     // 콘솔: 종류=프레스&개수=0
      //
      //   ★★ `if (!값) continue;` 로 쓰면 안 됩니다. **`0` 이 같이 걸러집니다.**
      //     0 은 거짓으로 취급되니까요. (01단원 개념04)
      //     값이 있는지 없는지를 물어야 할 때는 `=== undefined` 로 또렷하게 쓰세요.

      // ✏️ 직접 해보기 5 — 거르는 코드에서 `=== undefined` 대신 `if (!값) continue;` 로 바꿔 보세요.
      //                      `개수=0` 이 사라지는 것을 눈으로 확인하세요.

      // ── 섹션 6: 자주 하는 실수 ──
      //
      // [실수 1] `?` 를 두 번 씀
      //
      //   const 주소 = "https://예시.com/search?type=a" + "?q=b";
      //   → 두 번째 `?` 부터는 그냥 값의 일부가 됩니다. `&` 를 써야 합니다.
      //     ★ URL 을 쓰면 이런 실수가 아예 안 생깁니다.
      //
      // [실수 2] `new URL()` 에 경로만 넘김
      //
      //   new URL("/v1/forecast");
      //   → TypeError: Invalid URL
      //     ★ 두 번째 인자로 기준 주소를 주면 됩니다.
      //       new URL("/v1/forecast", "https://api.open-meteo.com")
      //
      // ✏️ 직접 해보기 6 — 콘솔에 `new URL("/v1/forecast")` 를 직접 쳐서 오류를 보세요.
      //                      그 다음 두 번째 인자를 넣어 고쳐 보세요.

      // [실수 3] 반복문에서 set 을 씀 (섹션 4)
      //
      // [실수 4] undefined 를 그냥 넣음 (섹션 5) ← ★ 제일 흔합니다
      //
      // [실수 5] 경로에 URLSearchParams 를 씀
      //
      //   → 경로에는 encodeURIComponent 를 씁니다. (섹션 3)
      //
      // [실수 6] 이미 인코딩된 값을 또 인코딩
      //
      //   encodeURIComponent("a%20b")  →  "a%2520b"
      //   → `%` 가 다시 `%25` 로 바뀝니다. 한 번만 하세요.
      //     ★ 값이 어디서 왔는지 모르겠으면 **원본을 찾아 거기서 한 번만** 하세요.
    </script>
  </body>
</html>
