<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 개념코드 — 섹션 4. flex-wrap — 줄 바꿈 여부 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 섹션 4. flex-wrap — 줄 바꿈 여부</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .item {                       /* 데모용 파란 박스 */
      width: 60px; height: 60px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 56px;
    }

    /* ── 섹션 4: flex-wrap — 줄 바꿈 여부 ─────────────── */
    /* [기본] nowrap(기본값): 한 줄에 강제로 욱여넣음 -> 아이템이 찌그러짐 */
    .s4-nowrap {
      display: flex;
      flex-wrap: nowrap;
      width: 300px;                  /* 60px x 6개보다 좁게 */
      background: #e9ecef; border: 2px dashed #868e96; padding: 8px;
    }
    /* [다른 방법] wrap: 넘치면 다음 줄로 / wrap-reverse: 반대 방향으로 줄 묶음 */
    .s4-wrap {
      display: flex;
      flex-wrap: wrap;
      width: 300px;
      background: #e9ecef; border: 2px dashed #868e96; padding: 8px;
    }
    /* 실수: 아이템이 찌그러지는데 width만 늘림 -> 원인은 nowrap. wrap으로 해결 */
    /* 표시: nowrap은 한 줄(찌그러짐), wrap은 두 줄로 자연스럽게 넘어감 */
  </style>
</head>

<body>
  <!-- ── 섹션 4: flex-wrap — 줄 바꿈 여부 ── -->
  <section>
    <h2>섹션 4. flex-wrap — 줄 바꿈 여부</h2>
    <p>nowrap (기본값) — 찌그러짐</p>
    <div class="s4-nowrap">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
    <p>wrap — 다음 줄로</p>
    <div class="s4-wrap">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
  </section>
</body>
</html>
