<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 개념코드 — 섹션 13. grid-column / grid-row — 라인 번호로 배치 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 섹션 13. grid-column / grid-row — 라인 번호로 배치</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* 원본 섹션 9 정의 — 이 섹션 마크업이 함께 사용 */
    .cell {                          /* 그리드 데모용 초록 셀 */
      background: #69db7c; border: 2px solid #2f9e44;
      color: #fff; text-align: center; line-height: 56px;
    }

    /* ── 섹션 13: grid-column / grid-row — 라인 번호로 배치 ── */
    /* [기본] 시작 라인 / 끝 라인 번호로 여러 칸 차지 */
    .s13-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 60px 60px;
      gap: 6px;
      background: #e9ecef; border: 2px dashed #868e96; padding: 8px;
    }
    .s13-wide {
      grid-column: 1 / 3;            /* 열 라인 1~3 사이 = 2칸 차지 */
      background: #ff8787; border-color: #e03131;
    }
    .s13-tall {
      grid-row: 1 / span 2;          /* [다른 방법] 시작점부터 span 2칸 */
      background: #ffd43b; border-color: #f08c00; line-height: 120px;
    }
    /* 실수: grid-column: 1 / 3 을 "3칸"으로 착각 — 라인 사이 칸 수는 2칸 */
  </style>
</head>

<body>
  <!-- ── 섹션 13: grid-column / grid-row — 라인 번호로 배치 ── -->
  <section>
    <h2>섹션 13. grid-column / grid-row — 라인 번호로 배치</h2>
    <div class="s13-container">
      <div class="cell s13-wide">1/3</div>
      <div class="cell s13-tall">span 2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
    </div>
  </section>
</body>
</html>
