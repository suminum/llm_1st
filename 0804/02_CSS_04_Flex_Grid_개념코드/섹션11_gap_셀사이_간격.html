<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 개념코드 — 섹션 11. gap — 셀 사이 간격 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 섹션 11. gap — 셀 사이 간격</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* 원본 섹션 9 정의 — 이 섹션 마크업이 함께 사용 */
    .cell {                          /* 그리드 데모용 초록 셀 */
      background: #69db7c; border: 2px solid #2f9e44;
      color: #fff; text-align: center; line-height: 56px;
    }

    /* ── 섹션 11: gap — 셀 사이 간격 ──────────────────── */
    /* [기본] gap 하나로 행/열 간격 동시 지정 */
    .s11-gap {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #e9ecef; border: 2px dashed #868e96; padding: 8px;
    }
    /* [다른 방법] gap: 10px 20px;  (행 10px, 열 20px) 또는 row-gap / column-gap 따로 */
    /* 실수: 아이템에 margin으로 간격 -> 가장자리에도 여백이 생겨 지저분함. gap이 깔끔 */
    /* 참고: gap은 flex 컨테이너에서도 동일하게 사용 가능 */
  </style>
</head>

<body>
  <!-- ── 섹션 11: gap — 셀 사이 간격 ── -->
  <section>
    <h2>섹션 11. gap — 셀 사이 간격</h2>
    <div class="s11-gap">
      <div class="cell">1</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
      <div class="cell">6</div>
    </div>
  </section>
</body>
</html>
