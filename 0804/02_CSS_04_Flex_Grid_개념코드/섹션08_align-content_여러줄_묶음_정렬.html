<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 개념코드 — 섹션 8. align-content — 여러 줄 묶음 정렬 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 섹션 8. align-content — 여러 줄 묶음 정렬</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .item {                       /* 데모용 파란 박스 */
      width: 60px; height: 60px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 56px;
    }

    /* ── 섹션 8: align-content — 여러 줄 묶음 정렬 ────── */
    /* [기본] wrap으로 여러 줄일 때, 줄 "묶음"을 교차 축으로 정렬 */
    .s8-base {
      display: flex;
      flex-wrap: wrap;               /* 여러 줄이어야 효과가 있음 */
      width: 300px; height: 240px;
      background: #e9ecef; border: 2px dashed #868e96; padding: 8px;
    }
    .s8-center  { align-content: center; }         /* 줄 묶음을 가운데로 */
    .s8-between { align-content: space-between; }  /* 줄 사이를 균등 분배 */
    /* 실수: flex-wrap: nowrap 상태에서 align-content -> 한 줄이라 효과 없음 */
    /* 정리: 한 줄 정렬은 align-items, 여러 줄 묶음은 align-content */
  </style>
</head>

<body>
  <!-- ── 섹션 8: align-content — 여러 줄 묶음 정렬 ── -->
  <section>
    <h2>섹션 8. align-content — 여러 줄 묶음 정렬</h2>
    <p>center</p>
    <div class="s8-base s8-center">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
    <p>space-between</p>
    <div class="s8-base s8-between">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
      <div class="item">5</div>
      <div class="item">6</div>
    </div>
  </section>
</body>
</html>
