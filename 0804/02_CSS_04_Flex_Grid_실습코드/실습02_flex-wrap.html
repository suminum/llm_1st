<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 실습 정답코드 — 실습 2. flex-wrap (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 실습 2. flex-wrap</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 32px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* 실습 1~3 공통: 500x500 컨테이너와 100x100 아이템 */
    .flex-box {
      width: 500px; height: 500px;
      border: 3px solid #343a40; background: #f1f3f5;
      display: flex;                   /* flex 컨테이너로 전환 */
      margin-bottom: 12px;
    }
    .flex-item {
      width: 100px; height: 100px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; font-size: 24px; text-align: center; line-height: 96px;
    }

    /* ── 실습 2: flex-wrap ────────────────────────────── */
    /* Step 1: 아이템 8개를 한 줄로 -> nowrap (기본값. 컨테이너에 맞게 찌그러짐) */
    .wrap-nowrap { flex-wrap: nowrap; }
    /* Step 2: 아이템 8개를 두 줄로 -> wrap (넘치면 다음 줄로) */
    .wrap-wrap { flex-wrap: wrap; }
  </style>
</head>

<body>
  <!-- ── 실습 2: flex-wrap ── -->
  <section>
    <h2>실습 2. flex-wrap</h2>
    <p>한 줄 (nowrap — 기본값, 아이템이 찌그러짐)</p>
    <div class="flex-box wrap-nowrap">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
      <div class="flex-item">5</div>
      <div class="flex-item">6</div>
      <div class="flex-item">7</div>
      <div class="flex-item">8</div>
    </div>
    <p>두 줄 (wrap)</p>
    <div class="flex-box wrap-wrap">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
      <div class="flex-item">5</div>
      <div class="flex-item">6</div>
      <div class="flex-item">7</div>
      <div class="flex-item">8</div>
    </div>
  </section>
</body>
</html>
