<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 실습 정답코드 — 실습 3. flex-wrap & 정렬 (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 실습 3. flex-wrap &amp; 정렬</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 32px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* 실습 1~3 공통: 500x500 컨테이너와 100x100 아이템 */
    .flex-box {
      width: 500px; height: 500px;
      border: 3px solid #343a40; background: #f1f3f5;
      display: flex;                   /* flex 컨테이너로 전환 */
      margin-bottom: 12px;
    }
    .flex-item {
      width: 100px; height: 100px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; font-size: 24px; text-align: center; line-height: 96px;
    }

    /* ── 실습 3: flex-wrap & 정렬 ─────────────────────── */
    /* Step 1: 한 줄(nowrap) 아이템을 가로·세로 완전 중앙에 */
    .align-one-line {
      justify-content: center;         /* 주 축(가로) 가운데 */
      align-items: center;             /* 교차 축(세로) 가운데 */
    }
    /* Step 2: 두 줄(wrap) 아이템을 "하나로 뭉쳐서" 중앙에 -> align-content */
    .align-lines-group {
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;           /* 줄 묶음 전체를 세로 가운데로 */
    }
    /* Step 3: 두 줄(wrap) 아이템을 "각각의 flex 줄에" 정렬 -> align-items */
    .align-lines-each {
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;             /* 각 줄 안에서 세로 가운데로 */
    }
  </style>
</head>

<body>
  <!-- ── 실습 3: flex-wrap & 정렬 ── -->
  <section>
    <h2>실습 3. flex-wrap &amp; 정렬</h2>
    <p>한 줄 — 가로·세로 완전 중앙 (justify-content + align-items)</p>
    <div class="flex-box align-one-line">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <p>두 줄 — 하나로 뭉쳐서 중앙 (justify-content + align-content)</p>
    <div class="flex-box align-lines-group">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
      <div class="flex-item">5</div>
      <div class="flex-item">6</div>
      <div class="flex-item">7</div>
      <div class="flex-item">8</div>
    </div>
    <p>두 줄 — 각각의 flex 줄에 정렬 (justify-content + align-items)</p>
    <div class="flex-box align-lines-each">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
      <div class="flex-item">4</div>
      <div class="flex-item">5</div>
      <div class="flex-item">6</div>
      <div class="flex-item">7</div>
      <div class="flex-item">8</div>
    </div>
  </section>
</body>
</html>
