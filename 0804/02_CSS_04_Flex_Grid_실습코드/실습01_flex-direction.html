<!DOCTYPE html>
<!--
  02_CSS_04_Flex_Grid 실습 정답코드 — 실습 1. flex-direction (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_04 Flex_Grid — 실습 1. flex-direction</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 32px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* 실습 1~3 공통: 500x500 컨테이너와 100x100 아이템 */
    .flex-box {
      width: 500px; height: 500px;
      border: 3px solid #343a40; background: #f1f3f5;
      display: flex;                   /* flex 컨테이너로 전환 */
      margin-bottom: 12px;
    }
    .flex-item {
      width: 100px; height: 100px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; font-size: 24px; text-align: center; line-height: 96px;
    }

    /* ── 실습 1: flex-direction ───────────────────────── */
    /* Step 1: 100x100 아이템 1, 2, 3 div 선언 (위 공통 클래스) */
    /* Step 2: 가로 방향 + 시작점 기준 — row는 기본값이라 생략 가능 */
    .dir-row { flex-direction: row; }
    /* Step 3: 끝점을 기준으로 쌓기 -> row-reverse */
    .dir-row-reverse { flex-direction: row-reverse; }
    /* Step 4: 세로 방향으로 쌓기 -> column (아래->위는 column-reverse) */
    .dir-column { flex-direction: column; }
  </style>
</head>

<body>
  <!-- ── 실습 1: flex-direction ── -->
  <section>
    <h2>실습 1. flex-direction</h2>
    <p>가로 방향 + 시작점 기준 (row — 기본값)</p>
    <div class="flex-box dir-row">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <p>끝점 기준 (row-reverse)</p>
    <div class="flex-box dir-row-reverse">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
    <p>세로 방향 (column)</p>
    <div class="flex-box dir-column">
      <div class="flex-item">1</div>
      <div class="flex-item">2</div>
      <div class="flex-item">3</div>
    </div>
  </section>
</body>
</html>
