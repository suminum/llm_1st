<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>② 로딩과 에러 보여 주기</title>
    <link rel="stylesheet" href="/공통.css" />
  </head>
  <body>
    <h1>② 로딩과 에러 보여 주기</h1>

    <p class="안내">
      화면에는 <strong>네 가지 상태</strong>가 있습니다.<br />
      로딩 중 · 성공 · 실패 · <strong>성공했는데 결과가 없음</strong><br />
      네 번째를 빠뜨리면 사용자는 "고장났나?" 하고 새로고침만 합니다.
    </p>

    <h2>네 가지 상태</h2>
    <button id="정상">목록 (2건)</button>
    <button id="빈것">목록 (0건)</button>
    <button id="실패">목록 (서버 오류)</button>
    <button id="느림">목록 (2초 걸림)</button>

    <div id="목록칸">버튼을 누르세요.</div>

    <h2>버튼 잠그기</h2>
    <p>느린 요청 중에 또 누를 수 있으면, 같은 요청이 여러 번 나갑니다.</p>
    <button id="안잠금">안 잠그고 요청</button>
    <button id="잠금">잠그고 요청</button>
    <div id="횟수칸">서버가 받은 횟수: <span id="횟수">-</span></div>

    <h2>늦게 온 응답이 덮어쓰는 문제</h2>
    <p>
      느린 요청을 보내고 곧바로 빠른 요청을 보냅니다.<br />
      느린 것이 나중에 도착해서 <strong>빠른 결과를 덮어씁니다.</strong>
    </p>
    <button id="경쟁안막음">안 막고 두 번 요청</button>
    <button id="경쟁막음">막고 두 번 요청</button>
    <div id="경쟁칸">-</div>

    <script src="/api.js"></script>
    <script>
      const 목록칸 = document.querySelector("#목록칸");

      // ★ 상태를 그리는 함수를 하나로 모읍니다.
      //   화면마다 다르게 그리면 어떤 화면은 로딩이 없고 어떤 화면은 빈 안내가 없습니다.
      function 그리기(상태, 값) {
        if (상태 === "로딩") {
          목록칸.className = "로딩";
          목록칸.textContent = "불러오는 중...";
          return;
        }

        if (상태 === "실패") {
          목록칸.className = "에러";
          목록칸.innerHTML = "";

          const 글 = document.createElement("span");
          글.textContent = 값.message + " ";
          목록칸.appendChild(글);

          // ★ 실패했으면 '다시 해 볼 방법' 을 함께 줘야 합니다.
          const 다시 = document.createElement("button");
          다시.id = "다시";
          다시.textContent = "다시 시도";
          다시.addEventListener("click", 값.다시하기);
          목록칸.appendChild(다시);
          return;
        }

        if (값.length === 0) {
          // ★★ 이게 네 번째 상태입니다. 성공했는데 결과가 없는 경우.
          목록칸.className = "비었음";
          목록칸.textContent = "조건에 맞는 설비가 없습니다.";
          return;
        }

        목록칸.className = "";
        목록칸.innerHTML =
          "<ul>" +
          값.map((설비) => `<li>${설비.id}. ${설비.name} (${설비.status})</li>`).join("") +
          "</ul>";
      }

      async function 불러오기(경로) {
        그리기("로딩");

        try {
          const 답 = await api.get(경로);
          그리기("성공", 답.data);
        } catch (에러) {
          그리기("실패", { message: 에러.message, 다시하기: () => 불러오기(경로) });
        }
      }

      document.querySelector("#정상").onclick = () => 불러오기("/api/v1/equipments");
      document.querySelector("#빈것").onclick = () => 불러오기("/api/v1/equipments?line=Z");
      document.querySelector("#실패").onclick = () => 불러오기("/api/v1/equipments?fail=1");
      document.querySelector("#느림").onclick = () => 불러오기("/api/v1/equipments?delay=2000");

      // ── 버튼 잠그기 ──
      const 횟수 = document.querySelector("#횟수");

      async function 횟수보이기() {
        const 답 = await api.get("/api/v1/count");
        횟수.textContent = 답.data.횟수;
      }

      document.querySelector("#안잠금").onclick = async () => {
        await api.post("/api/v1/count/reset", {});

        // 세 번 빠르게 누른 것을 흉내 냅니다.
        await Promise.all([
          api.get("/api/v1/equipments?delay=300&count=1"),
          api.get("/api/v1/equipments?delay=300&count=1"),
          api.get("/api/v1/equipments?delay=300&count=1"),
        ]);
        횟수보이기();
      };

      document.querySelector("#잠금").onclick = async (이벤트) => {
        const 버튼 = 이벤트.target;

        await api.post("/api/v1/count/reset", {});

        if (버튼.disabled) return;
        버튼.disabled = true;

        try {
          await api.get("/api/v1/equipments?delay=300&count=1");
        } finally {
          // ★ finally 를 꼭 쓰세요.
          //   실패했을 때 잠금을 안 풀면 버튼이 영영 안 눌립니다.
          버튼.disabled = false;
        }

        횟수보이기();
      };

      // ── 늦게 온 응답 문제 ──
      const 경쟁칸 = document.querySelector("#경쟁칸");

      document.querySelector("#경쟁안막음").onclick = () => {
        경쟁칸.textContent = "요청 중...";

        // 느린 것을 먼저 보내고 빠른 것을 나중에 보냅니다.
        api.get("/api/v1/label?delay=800&label=느린 응답").then((답) => {
          경쟁칸.textContent = 답.data.label;
        });
        api.get("/api/v1/label?delay=100&label=빠른 응답").then((답) => {
          경쟁칸.textContent = 답.data.label;
        });
      };

      // ★ 막는 법: 요청마다 번호를 붙이고, 마지막 번호가 아니면 버립니다.
      let 마지막번호 = 0;

      document.querySelector("#경쟁막음").onclick = () => {
        경쟁칸.textContent = "요청 중...";

        const 보내기 = (지연, 이름) => {
          마지막번호 += 1;
          const 내번호 = 마지막번호;

          api.get(`/api/v1/label?delay=${지연}&label=${encodeURIComponent(이름)}`).then((답) => {
            // 내가 마지막 요청이 아니면 결과를 버립니다.
            if (내번호 !== 마지막번호) return;
            경쟁칸.textContent = 답.data.label;
          });
        };

        보내기(800, "느린 응답");
        보내기(100, "빠른 응답");
      };
    </script>
  </body>
</html>
