<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>④ 목록 화면 만들기</title>
    <link rel="stylesheet" href="/공통.css" />
  </head>
  <body>
    <h1>④ 목록 화면 만들기</h1>

    <p class="안내">
      06단원에서 만든 <code>page · limit · sort · q · line</code> 을 화면에 붙입니다.<br />
      <strong>화면의 상태를 주소창에 담는 것</strong>이 이 화면의 핵심입니다.
    </p>

    <div class="줄">
      <input type="text" id="검색" placeholder="이름·라인·상태 검색" />
      <select id="라인">
        <option value="">라인 전체</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>
      <select id="정렬">
        <option value="id">번호 오름</option>
        <option value="-id">번호 내림</option>
        <option value="name">이름 오름</option>
      </select>
      <select id="쪽크기">
        <option value="5">5개씩</option>
        <option value="10">10개씩</option>
      </select>
    </div>

    <div id="요약" class="로딩">불러오는 중...</div>

    <table>
      <thead>
        <tr><th>번호</th><th>이름</th><th>라인</th><th>상태</th></tr>
      </thead>
      <tbody id="본문"></tbody>
    </table>

    <div class="쪽">
      <button id="이전쪽">이전</button>
      <span id="쪽정보">-</span>
      <button id="다음쪽">다음</button>
    </div>

    <script src="/api.js"></script>
    <script>
      const 본문 = document.querySelector("#본문");
      const 요약 = document.querySelector("#요약");
      const 쪽정보 = document.querySelector("#쪽정보");
      const 이전쪽 = document.querySelector("#이전쪽");
      const 다음쪽 = document.querySelector("#다음쪽");

      // ★ 화면의 상태를 한 객체에 모읍니다.
      //   여기저기 흩어 두면 "지금 몇 쪽이지?" 를 알기 어려워집니다.
      const 상태 = { page: 1, limit: 5, sort: "id", q: "", line: "" };

      let 마지막번호 = 0; // 늦게 온 응답을 버리려고 (개념02 섹션 4)

      // 상태 → 주소 문자열
      function 주소만들기() {
        const 쿼리 = new URLSearchParams();

        쿼리.set("page", 상태.page);
        쿼리.set("limit", 상태.limit);
        쿼리.set("sort", 상태.sort);

        // ★ 빈 값은 아예 안 넣습니다.
        //   ?q= 로 보내면 서버가 "빈 검색어" 를 받게 됩니다. (06단원 개념03)
        if (상태.q) 쿼리.set("q", 상태.q);
        if (상태.line) 쿼리.set("line", 상태.line);

        return "/api/v1/equipments?" + 쿼리.toString();
      }

      async function 불러오기() {
        마지막번호 += 1;
        const 내번호 = 마지막번호;

        요약.className = "로딩";
        요약.textContent = "불러오는 중...";

        try {
          const 답 = await api.get(주소만들기());

          if (내번호 !== 마지막번호) return; // 늦게 왔으면 버립니다

          그리기(답.data, 답.meta);
        } catch (에러) {
          if (내번호 !== 마지막번호) return;

          요약.className = "에러";
          요약.textContent = 에러.message;
          본문.innerHTML = "";
        }
      }

      function 그리기(목록, meta) {
        if (목록.length === 0) {
          요약.className = "비었음";
          요약.textContent = "조건에 맞는 설비가 없습니다.";
          본문.innerHTML = "";
          쪽정보.textContent = "0 / 0";
          이전쪽.disabled = true;
          다음쪽.disabled = true;
          return;
        }

        요약.className = "";
        요약.textContent = `전체 ${meta.total}건 중 ${목록.length}건`;

        본문.innerHTML = 목록
          .map(
            (설비) =>
              `<tr><td>${설비.id}</td><td>${설비.name}</td><td>${설비.line}</td><td>${설비.status}</td></tr>`
          )
          .join("");

        쪽정보.textContent = `${meta.page} / ${meta.totalPages}`;

        // ★ 갈 수 없는 쪽의 버튼은 잠급니다.
        //   안 잠그면 사용자가 눌러 보고 아무 일도 안 일어나는 것을 겪습니다.
        이전쪽.disabled = meta.page <= 1;
        다음쪽.disabled = meta.page >= meta.totalPages;
      }

      // ── 조건이 바뀌면 1쪽부터 다시 ──
      // ★ 이걸 빠뜨리면 3쪽을 보다가 검색했을 때 3쪽부터 보게 됩니다.
      //   결과가 1쪽뿐이면 빈 화면이 나옵니다. 아주 흔한 버그입니다.
      function 조건바뀜() {
        상태.page = 1;
        불러오기();
      }

      // 검색은 글자를 칠 때마다 보내지 않고, 멈춘 뒤에 보냅니다 (디바운스)
      let 타이머 = null;

      document.querySelector("#검색").addEventListener("input", (이벤트) => {
        상태.q = 이벤트.target.value.trim();

        clearTimeout(타이머);
        타이머 = setTimeout(조건바뀜, 300);
      });

      document.querySelector("#라인").addEventListener("change", (이벤트) => {
        상태.line = 이벤트.target.value;
        조건바뀜();
      });

      document.querySelector("#정렬").addEventListener("change", (이벤트) => {
        상태.sort = 이벤트.target.value;
        조건바뀜();
      });

      document.querySelector("#쪽크기").addEventListener("change", (이벤트) => {
        상태.limit = Number(이벤트.target.value);
        조건바뀜();
      });

      이전쪽.addEventListener("click", () => {
        상태.page -= 1;
        불러오기();
      });

      다음쪽.addEventListener("click", () => {
        상태.page += 1;
        불러오기();
      });

      불러오기();
    </script>
  </body>
</html>
