<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>⑤ 업로드 화면 만들기</title>
    <link rel="stylesheet" href="/공통.css" />
  </head>
  <body>
    <h1>⑤ 업로드 화면 만들기</h1>

    <p class="안내">
      09단원에서 만든 업로드 API 를 화면에 붙입니다.<br />
      <strong>진행률은 fetch 로 못 만듭니다.</strong> 그 이유가 이 화면의 핵심입니다.
    </p>

    <div class="줄">
      <input type="file" id="파일" accept=".png,.jpg,.jpeg,.gif" />
    </div>

    <div id="미리보기칸"></div>

    <div class="줄">
      <button id="올리기">올리기 (fetch)</button>
      <button id="진행률로">올리기 (진행률 보이기)</button>
    </div>

    <div id="진행칸"></div>
    <div id="알림"></div>

    <h2>올라간 파일</h2>
    <ul id="목록"></ul>

    <script src="/api.js"></script>
    <script>
      const 파일칸 = document.querySelector("#파일");
      const 미리보기칸 = document.querySelector("#미리보기칸");
      const 진행칸 = document.querySelector("#진행칸");
      const 알림 = document.querySelector("#알림");
      const 목록 = document.querySelector("#목록");

      function 알리기(글, 종류) {
        알림.textContent = 글;
        알림.className = 종류 ?? "";
      }

      // ── 고르자마자 정보 보여 주기 ──
      파일칸.addEventListener("change", () => {
        const 파일 = 파일칸.files[0];
        미리보기칸.innerHTML = "";
        알리기("");

        if (!파일) return;

        // ★ 서버에 보내기 전에 알려 줄 수 있는 것은 미리 알려 줍니다.
        //   3MB 짜리를 올린 뒤 "너무 큽니다" 를 듣는 것보다 낫습니다.
        const 글 = document.createElement("div");
        글.id = "파일정보";
        글.textContent = `${파일.name} — ${파일.size}바이트 (${파일.type || "형식 모름"})`;
        미리보기칸.appendChild(글);

        // 이미지면 미리 보여 줍니다. 서버에 안 보내고 브라우저 안에서 합니다.
        if (파일.type.startsWith("image/")) {
          const 그림 = document.createElement("img");
          그림.style.maxWidth = "200px";
          그림.src = URL.createObjectURL(파일);
          미리보기칸.appendChild(그림);
        }
      });

      async function 목록그리기() {
        const 답 = await api.get("/api/v1/files");

        목록.innerHTML =
          답.data.length === 0
            ? '<li class="비었음">아직 올린 파일이 없습니다.</li>'
            : 답.data.map((f) => `<li>${f.원래이름} (${f.크기}바이트)</li>`).join("");
      }

      // ── 방법 ① fetch ──
      document.querySelector("#올리기").addEventListener("click", async (이벤트) => {
        const 파일 = 파일칸.files[0];

        if (!파일) {
          알리기("파일을 먼저 고르세요.", "에러");
          return;
        }

        이벤트.target.disabled = true;
        알리기("올리는 중...", "로딩");

        const 폼 = new FormData();
        폼.append("file", 파일);

        try {
          const 답 = await api.올리기("/api/v1/files", 폼);
          알리기(`${답.data.원래이름} 을(를) 올렸습니다.`, "성공");
          목록그리기();
        } catch (에러) {
          알리기(에러.message, "에러");
        } finally {
          이벤트.target.disabled = false;
        }
      });

      // ── 방법 ② XMLHttpRequest (진행률) ──
      document.querySelector("#진행률로").addEventListener("click", (이벤트) => {
        const 파일 = 파일칸.files[0];

        if (!파일) {
          알리기("파일을 먼저 고르세요.", "에러");
          return;
        }

        이벤트.target.disabled = true;
        진행칸.textContent = "0%";

        const 폼 = new FormData();
        폼.append("file", 파일);

        // ★★ fetch 에는 '올리는 진행률' 을 알려 주는 기능이 없습니다.
        //   그래서 옛날 도구인 XMLHttpRequest 를 씁니다. 2026년에도 그렇습니다.
        const 요청 = new XMLHttpRequest();

        요청.upload.addEventListener("progress", (진행) => {
          if (!진행.lengthComputable) return;
          진행칸.textContent = Math.round((진행.loaded / 진행.total) * 100) + "%";
        });

        요청.addEventListener("load", () => {
          이벤트.target.disabled = false;
          진행칸.textContent = "100%";

          let 몸통;
          try {
            몸통 = JSON.parse(요청.responseText);
          } catch {
            알리기("서버 응답을 읽지 못했습니다", "에러");
            return;
          }

          if (몸통.error) {
            알리기(몸통.error.message, "에러");
            return;
          }

          알리기(`${몸통.data.원래이름} 을(를) 올렸습니다.`, "성공");
          목록그리기();
        });

        요청.addEventListener("error", () => {
          이벤트.target.disabled = false;
          알리기("서버에 연결하지 못했습니다", "에러");
        });

        요청.open("POST", "/api/v1/files");
        요청.send(폼);
      });

      목록그리기();
    </script>
  </body>
</html>
