<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>③ 폼과 검증 보여 주기</title>
    <link rel="stylesheet" href="/공통.css" />
  </head>
  <body>
    <h1>③ 폼과 검증 보여 주기</h1>

    <p class="안내">
      서버가 <code>details</code> 로 <strong>어느 칸이 왜 틀렸는지</strong>를 알려 줍니다.<br />
      그걸 그 칸 아래에 붙여 주면 사용자가 바로 고칠 수 있습니다.
    </p>

    <form id="폼">
      <label class="칸">
        <span>설비 이름</span>
        <input type="text" id="name" name="name" />
      </label>
      <div class="오류글" id="오류-name"></div>

      <label class="칸">
        <span>라인</span>
        <select id="line" name="line">
          <option value="">고르세요</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="Z">Z (없는 라인)</option>
        </select>
      </label>
      <div class="오류글" id="오류-line"></div>

      <div class="줄">
        <button type="submit" id="보내기">등록</button>
        <button type="button" id="비우기">비우기</button>
      </div>
    </form>

    <div id="알림"></div>

    <h2>등록된 설비</h2>
    <ul id="목록"></ul>

    <script src="/api.js"></script>
    <script>
      const 폼 = document.querySelector("#폼");
      const 알림 = document.querySelector("#알림");
      const 목록 = document.querySelector("#목록");
      const 보내기버튼 = document.querySelector("#보내기");

      const 칸이름들 = ["name", "line"];

      // ★ 새 요청을 보내기 전에 지난 오류를 반드시 지웁니다.
      //   안 지우면 고친 칸에도 옛날 오류가 남아 있습니다.
      function 오류지우기() {
        for (const 이름 of 칸이름들) {
          document.querySelector(`#오류-${이름}`).textContent = "";
          document.querySelector(`#${이름}`).classList.remove("입력오류");
        }
        알림.textContent = "";
        알림.className = "";
      }

      // 서버가 준 details 를 칸마다 붙입니다.
      function 오류붙이기(details) {
        for (const 하나 of details ?? []) {
          const 오류칸 = document.querySelector(`#오류-${하나.키}`);
          const 입력칸 = document.querySelector(`#${하나.키}`);

          // ★ 서버가 우리가 모르는 칸 이름을 줄 수도 있습니다.
          //   그때 터지면 안 됩니다.
          if (!오류칸) continue;

          오류칸.textContent = 하나.이유;
          입력칸?.classList.add("입력오류");
        }
      }

      async function 목록그리기() {
        const 답 = await api.get("/api/v1/equipments");

        목록.innerHTML =
          답.data.length === 0
            ? '<li class="비었음">아직 등록된 설비가 없습니다.</li>'
            : 답.data.map((설비) => `<li>${설비.id}. ${설비.name} (${설비.line}라인)</li>`).join("");
      }

      폼.addEventListener("submit", async (이벤트) => {
        // ★ 이걸 안 하면 폼이 페이지를 통째로 새로고침합니다.
        //   화면이 깜빡이고 우리 코드는 실행되다 말게 됩니다.
        이벤트.preventDefault();

        오류지우기();
        보내기버튼.disabled = true;

        // ★ FormData 로 값을 한 번에 꺼냅니다. 칸이 늘어도 코드가 안 늘어납니다.
        const 값 = Object.fromEntries(new FormData(폼));

        try {
          const 답 = await api.post("/api/v1/equipments", 값);

          알림.className = "성공";
          알림.textContent = `${답.data.name} 을(를) 등록했습니다.`;

          폼.reset(); // 성공했으면 비웁니다
          목록그리기();
        } catch (에러) {
          if (에러.code === "VALIDATION_FAILED") {
            // 어느 칸이 틀렸는지 알려 줄 수 있는 경우
            오류붙이기(에러.details);
            알림.className = "에러";
            알림.textContent = 에러.message;
          } else if (에러.code === "DUPLICATED") {
            // 칸 하나의 문제라 그 칸에 붙입니다
            document.querySelector("#오류-name").textContent = 에러.message;
            document.querySelector("#name").classList.add("입력오류");
          } else {
            // 그 밖은 폼 전체 문제로 봅니다
            알림.className = "에러";
            알림.textContent = 에러.message;
          }
        } finally {
          보내기버튼.disabled = false;
        }
      });

      document.querySelector("#비우기").addEventListener("click", () => {
        폼.reset();
        오류지우기();
      });

      목록그리기();
    </script>
  </body>
</html>
