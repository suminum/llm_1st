<!DOCTYPE html>
<!--
  02_CSS_02_선택자 실습 정답코드 — 실습 5. 가상 요소 선택자 (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 실습 5. 가상 요소 선택자</title>

  <style>
    /* 보기 편하게 실습마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #999; padding: 12px; background: white; color: black; }

    /* ── 실습 5: 가상 요소 선택자 ─────────────────────── */
    /* Step 1: "여기요" 앞에 "택시" 넣기 -> ::before (content 필수!) */
    .box::before {
      content: "택시";
      color: goldenrod;          /* 삽입된 글자 구분용 (선택) */
    }
    /* Step 2: "여기요" 뒤에 "빨리" 넣기 -> ::after */
    .box::after {
      content: "빨리";
      color: crimson;            /* 삽입된 글자 구분용 (선택) */
    }
  </style>
</head>

<body>
  <h2>실습 5. 가상 요소 선택자</h2>

  <!-- ── 실습 5: 가상 요소 선택자 ── -->
  <section>
    <div class="box">여기요!</div>
  </section>
</body>
</html>
