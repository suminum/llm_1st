<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 실습 정답코드 — 실습 4. 테두리 그리기 (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 실습 4. 테두리 그리기</title>

  <style>
    /* 모든 상자를 border-box 기준으로 (이 PPT 실습 6에서 배우는 권장 설정) */
    * { box-sizing: border-box; }
    /* 보기 편하게 실습마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 실습 4: 테두리 그리기 ────────────────────────── */
    /* 4개의 div에 각각 클래스를 부여하고 border 관련 속성 적용 */
    .bd {
      display: inline-block;       /* 4개를 가로로 나란히 (비교용) */
      width: 140px;
      height: 90px;
      margin: 8px;
      text-align: center;
      line-height: 90px;
    }
    /* Step 1: border 속성으로 테두리 적용 (두께 종류 색상) */
    .bd1 { border: 3px solid black; }
    /* Step 2: border-width로 4방향(상/우/하/좌) 두께 변경 */
    .bd2 {
      border: 3px solid black;
      border-width: 2px 6px 10px 14px;
    }
    /* Step 3: border-style로 4방향 스타일 변경 */
    .bd3 {
      border: 4px solid tomato;
      border-style: solid dashed dotted double;
    }
    /* Step 4: border-color로 4방향 색상 변경 */
    .bd4 {
      border: 6px solid black;
      border-color: red orange green blue;
    }
    /* Step 5: border-방향 속성으로 모든 방향이 다른 div 완성 */
    .bd5 {
      border-top: 3px solid red;
      border-right: 8px dashed orange;
      border-bottom: 12px dotted green;
      border-left: 6px double blue;
    }
  </style>
</head>

<body>
  <h2>실습 4. 테두리 그리기</h2>

  <!-- ── 실습 4: 테두리 그리기 ── -->
  <section>
    <div class="bd bd1">border</div>
    <div class="bd bd2">width</div>
    <div class="bd bd3">style</div>
    <div class="bd bd4">color</div>
    <div class="bd bd5">방향별</div>
  </section>
</body>
</html>
