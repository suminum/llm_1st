<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 2. font-size — 글자 크기 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 2. font-size — 글자 크기</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 2: font-size — 글자 크기 ─────────────────── */
    /* [기본] px 단위 */
    .fs-24 { font-size: 24px; }
    /* [다른 방법] em(부모 기준 배수), rem(html 기준 배수), % */
    .fs-15rem { font-size: 1.5rem; }
    /* 표시: 두 줄 다 기본(16px)보다 크게 보임 */
    /* 실수: font-size: 24;  // 단위(px 등)를 빠뜨리면 적용 안 됨 */
  </style>
</head>

<body>
  <h2>섹션 2. font-size — 글자 크기</h2>

  <!-- ── 섹션 2: font-size ── -->
  <section>
    <p class="fs-24">24px 글자</p>
    <p class="fs-15rem">1.5rem 글자</p>
  </section>
</body>
</html>
