<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 1. font-family — 글꼴 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 1. font-family — 글꼴</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 1: font-family — 글꼴 ────────────────────── */
    /* [기본] 쉼표로 나열하면 앞 글꼴부터 차례로 시도 (없으면 다음으로 폴백) */
    .ff-demo {
      font-family: "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    }
    /* 표시: 맑은 고딕이 있으면 그걸로, 없으면 다음 후보로 표시 */
    /* [다른 방법] 구글 폰트: <link>로 연결 후 font-family 지정 (fonts.google.com)
       눈누 폰트: @font-face + font-family 지정 (noonnu.cc) */
    /* 실수: font-family: 맑은 고딕;  // 공백이 있는 글꼴 이름은 따옴표로 감싸기 */
  </style>
</head>

<body>
  <h2>섹션 1. font-family — 글꼴</h2>

  <!-- ── 섹션 1: font-family ── -->
  <section>
    <p class="ff-demo">font-family — 앞 글꼴부터 차례로 시도합니다.</p>
  </section>
</body>
</html>
