<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 11. width / height 와 calc() (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 11. width / height 와 calc()</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 11: width / height 와 calc() ─────────────── */
    /* [기본] px, %, vw(화면 너비), vh(화면 높이) 등 단위 사용 */
    .wh-demo {
      width: 50%;
      height: 40px;
      background-color: plum;
    }
    /* [다른 방법] calc() — 단위가 달라도 계산해서 적용 */
    .calc-demo {
      width: calc(100% - 100px);   /* 부모 너비에서 100px 뺀 값 */
      height: 40px;
      background-color: lightsteelblue;
    }
    /* 실수: width: calc(100%-100px);  // 빼기(-) 양옆에 공백 필수! */
  </style>
</head>

<body>
  <h2>섹션 11. width / height 와 calc()</h2>

  <!-- ── 섹션 11: width / height 와 calc() ── -->
  <section>
    <div class="wh-demo">width: 50%</div>
    <div class="calc-demo">width: calc(100% - 100px)</div>
  </section>
</body>
</html>
