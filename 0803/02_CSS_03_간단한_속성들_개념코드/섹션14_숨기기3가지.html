<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 14. 숨기기 3가지 — opacity / visibility / display (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 14. 숨기기 3가지 — opacity / visibility / display</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 14: 숨기기 3가지 — opacity / visibility / display ── */
    /* [기본] opacity: 0(투명)~1(불투명). 투명해도 자리 차지 + 클릭도 됨 */
    .hide-opacity { opacity: 0.3; }
    /* [기본] visibility: hidden — 모습·속성 숨김, 자리는 차지 */
    .hide-visibility { visibility: hidden; }
    /* [기본] display: none — 아예 없앰, 자리도 사라짐 */
    .hide-display { display: none; }
    .hide-box { background-color: skyblue; padding: 6px; }
    /* 표시: 반투명 1개 + 빈 자리 1칸 + (3번째는 자리조차 없음) */
    /* 실수: 메뉴 토글에 opacity: 0만 사용  // 안 보여도 클릭이 되어버림 -> display: none 고려 */
  </style>
</head>

<body>
  <h2>섹션 14. 숨기기 3가지 — opacity / visibility / display</h2>

  <!-- ── 섹션 14: 숨기기 3가지 ── -->
  <section>
    <div class="hide-box hide-opacity">opacity: 0.3 — 반투명, 자리 차지</div>
    <div class="hide-box hide-visibility">visibility: hidden — 안 보여도 자리는 남음</div>
    <div class="hide-box hide-display">display: none — 자리도 없음</div>
    <div class="hide-box">비교용 보통 상자</div>
  </section>
</body>
</html>
