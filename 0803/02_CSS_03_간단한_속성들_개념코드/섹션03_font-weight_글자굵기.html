<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 3. font-weight — 글자 굵기 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 3. font-weight — 글자 굵기</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 3: font-weight — 글자 굵기 ───────────────── */
    /* [기본] 키워드 normal / bold */
    .fw-bold { font-weight: bold; }
    /* [다른 방법] 100~900 숫자 (400=normal, 700=bold) */
    .fw-300 { font-weight: 300; }
    /* 표시: 위는 굵게, 아래는 가늘게 */
  </style>
</head>

<body>
  <h2>섹션 3. font-weight — 글자 굵기</h2>

  <!-- ── 섹션 3: font-weight ── -->
  <section>
    <p class="fw-bold">bold — 굵은 글자</p>
    <p class="fw-300">300 — 가는 글자</p>
  </section>
</body>
</html>
