<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 10. margin 병합(collapsing) (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 10. margin 병합(collapsing)</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 10: margin 병합(collapsing) ──────────────── */
    /* [기본] 세로로 인접한 두 블록의 margin은 더해지지 않고 큰 값 하나만 적용 */
    .mc-top    { margin-bottom: 20px; background-color: wheat; }
    .mc-bottom { margin-top: 16px;  background-color: wheat; }
    /* 표시: 실제 간격 = max(20, 16) = 20px (36px 아님!) */
    /* [다른 방법] 부모를 display: flex + gap으로 만들면 병합 없음 */
  </style>
</head>

<body>
  <h2>섹션 10. margin 병합(collapsing)</h2>

  <!-- ── 섹션 10: margin 병합 ── -->
  <section>
    <div class="mc-top">아래 margin 20px</div>
    <div class="mc-bottom">위 margin 16px — 실제 간격은 20px 하나!</div>
  </section>
</body>
</html>
