<!DOCTYPE html>
<!--
  02_CSS_03_간단한_속성들 개념코드 — 섹션 4. line-height — 줄 높이 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_03 간단한 속성들 — 섹션 4. line-height — 줄 높이</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 4: line-height — 줄 높이 ─────────────────── */
    /* [기본] 줄 사이 간격 조절 */
    .lh-2 { line-height: 2; }   /* 글자 크기의 2배 */
    /* [다른 방법] 한 줄 컨텐츠일 때 box height와 같게 -> 세로 중앙 정렬 효과! */
    .lh-center {
      height: 60px;
      line-height: 60px;   /* height와 동일하게 */
      background-color: lightblue;
    }
    /* 표시: 파란 상자 안 글자가 세로 가운데에 옴 */
  </style>
</head>

<body>
  <h2>섹션 4. line-height — 줄 높이</h2>

  <!-- ── 섹션 4: line-height ── -->
  <section>
    <p class="lh-2">line-height: 2 — 줄 간격이 넓어집니다. 문장이 길어져 두 줄이 되면 차이가 잘 보입니다. 계속 이어지는 문장입니다.</p>
    <div class="lh-center">height = line-height -> 세로 중앙!</div>
  </section>
</body>
</html>
