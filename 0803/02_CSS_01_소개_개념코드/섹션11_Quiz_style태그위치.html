<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 11. Quiz — <style> 태그의 위치는? (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 11. Quiz — &lt;style&gt; 태그의 위치는?</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 11: Quiz — <style> 태그의 위치는? ────────── */
    /* 문제: 내장 방식에서 <style>은 어디에 넣어야 할까?
       ① <html> 바로 안  ② <head>  ③ <body>  ④ 기타 */
    /* 정답: ② <head>  // 메타 정보를 모아두는 영역. 이 파일도 head 안에 있음 */
  </style>
</head>

<body>
  <h2>섹션 11. Quiz — &lt;style&gt; 태그의 위치는?</h2>

  <!-- ── 섹션 11: Quiz — style 태그의 위치는? ── -->
  <section>
    <p>Quiz. &lt;style&gt; 태그는 어디에? — 정답은 위 style 주석에서 확인</p>
  </section>
</body>
</html>
