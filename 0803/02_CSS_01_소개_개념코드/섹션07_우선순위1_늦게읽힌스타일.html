<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 7. 우선순위 ① — 늦게 읽힌 스타일이 이김 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 7. 우선순위 ① — 늦게 읽힌 스타일이 이김</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 7: 우선순위 ① — 늦게 읽힌 스타일이 이김 ── */
    /* [기본] 같은 요소에 같은 속성이 두 번 -> 나중 것이 적용 */
    .later-wins { background-color: gold; }
    .later-wins { background-color: plum; }   /* 이게 이김 */
    /* 표시: 배경이 gold가 아니라 plum(연보라)으로 보임 */
  </style>
</head>

<body>
  <h2>섹션 7. 우선순위 ① — 늦게 읽힌 스타일이 이김</h2>

  <!-- ── 섹션 7: 우선순위 ① — 늦게 읽힌 스타일이 이김 ── -->
  <section>
    <p class="later-wins">gold vs plum — 나중에 쓴 plum이 이깁니다.</p>
  </section>
</body>
</html>
