<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 5. 링크(link) 방식 (외부 CSS 파일) (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 5. 링크(link) 방식 (외부 CSS 파일)</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 5: 링크(link) 방식 (외부 CSS 파일) ───────── */
    /* [기본] 모든 스타일을 별도 .css 파일로 분리하고 <link>로 연결
       style.css 파일을 만들고, <head>에 아래 한 줄을 추가:
       <link rel="stylesheet" href="style.css" />

       style.css 내용 예:
       .link-demo { color: white; background-color: crimson; }

       장점: 여러 HTML이 같은 .css를 공유 -> 한 파일만 고치면 전부 반영 */
    /* 이 수업 파일은 한 파일로 여는 자료라서, 같은 내용을 내장으로 재현: */
    .link-demo {
      color: white;
      background-color: crimson;
    }
    /* 실수: <link rel="stylesheet" src="style.css" />  // link는 src가 아니라 href! */
  </style>
</head>

<body>
  <h2>섹션 5. 링크(link) 방식 (외부 CSS 파일)</h2>

  <!-- ── 섹션 5: 링크(link) 방식 ── -->
  <section>
    <p class="link-demo">링크 방식 — 외부 .css 파일을 link로 연결 (재사용 + 유지보수 최강)</p>
  </section>
</body>
</html>
