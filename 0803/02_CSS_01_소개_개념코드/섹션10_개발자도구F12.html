<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 10. 개발자 도구(F12) (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 10. 개발자 도구(F12)</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 10: 개발자 도구(F12) ─────────────────────── */
    /* [기본] 브라우저에서 F12 -> 요소(Elements) 탭
       - 코드 확인: 현재 페이지의 HTML/CSS를 그대로 확인
       - 실시간 수정: 값을 바꿔보며 결과를 즉시 확인 (새로고침하면 원래대로)
       - 요소 검사: 박스 모델·간격을 시각적으로 확인
       - 반응형 확인: 모바일 뷰로 전환해 미리 보기 */
    .devtools-demo {
      background-color: khaki;
      padding: 10px;
    }
    /* 표시: 아래 노란 박스를 F12로 검사하며 값을 직접 바꿔보기 */
  </style>
</head>

<body>
  <h2>섹션 10. 개발자 도구(F12)</h2>

  <!-- ── 섹션 10: 개발자 도구(F12) ── -->
  <section>
    <p class="devtools-demo">F12를 눌러 이 박스를 검사해 보세요. 값을 바꾸면 즉시 반영!</p>
  </section>
</body>
</html>
