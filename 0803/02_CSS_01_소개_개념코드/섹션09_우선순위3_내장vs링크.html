<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 9. 우선순위 ③ — 내장 vs 링크 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 9. 우선순위 ③ — 내장 vs 링크</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 9: 우선순위 ③ — 내장 vs 링크 ────────────── */
    /* [기본] 내장과 링크 사이에는 HTML에서 "더 늦게 쓰인 쪽"이 이김
       1) <link href="style.css" />  가 먼저,
       2) 내장 <style> 블록이 나중   => 내장이 이김
       순서를 바꾸면 링크가 이김 */
    /* 실수: "내장이 링크보다 무조건 세다"고 암기  // 순서가 기준! (무조건은 인라인뿐) */
  </style>
</head>

<body>
  <h2>섹션 9. 우선순위 ③ — 내장 vs 링크</h2>

  <!-- ── 섹션 9: 우선순위 ③ — 내장 vs 링크 ── -->
  <section>
    <p>내장 vs 링크는 "HTML에서 늦게 쓰인 쪽"이 이깁니다. (위 style 주석 참고)</p>
  </section>
</body>
</html>
