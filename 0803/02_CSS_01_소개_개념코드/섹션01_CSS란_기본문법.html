<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 1. CSS란? — 기본 문법 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 1. CSS란? — 기본 문법</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }

    /* ── 섹션 1: CSS란? — 기본 문법 ────────────────────── */
    /* [기본] 선택자 { 속성: 값; }  -> "선택자의 속성을 값으로 바꿔라" */
    h1 {
      color: royalblue;      /* 속성: 값; 으로 한 줄 */
    }
    /* 표시: 페이지 맨 위 제목이 파란색으로 보임 */
    /* 실수: h1 { color royalblue }  // 콜론(:)과 세미콜론(;)을 빠뜨리면 적용 안 됨 */
  </style>
</head>

<body>
  <h2>섹션 1. CSS란? — 기본 문법</h2>

  <!-- ── 섹션 1: CSS란? — 기본 문법 ── -->
  <section>
    <h1>CSS = Cascading Style Sheet</h1>
    <!-- Cascading = 폭포처럼 흘러내린다 -> 우선순위에 따라 스타일이 적용된다는 뜻 -->
  </section>
</body>
</html>
