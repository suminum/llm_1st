<!DOCTYPE html>
<!--
  02_CSS_01_소개 개념코드 — 섹션 3. 인라인(inline) 방식 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_01 소개 — 섹션 3. 인라인(inline) 방식</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
  </style>
</head>

<body>
  <h2>섹션 3. 인라인(inline) 방식</h2>

  <!-- ── 섹션 3: 인라인(inline) 방식 ── -->
  <section>
    <!-- [기본] 태그의 style 속성에 직접 지정 -->
    <p>안녕하세요</p>
    <p style="color: blue; font-weight: bold; background-color: yellowgreen;">안녕하세요</p>
    <h2 style="color: aqua; background-color: blueviolet;">KDT</h2>
    <h2 style="background-color: greenyellow; width: 500px; padding: 10px;">KDT</h2>
    <!-- 표시: 두 번째 문장부터 색이 입혀져 보임 -->
    <!-- 한계: 같은 스타일을 다른 곳에 쓰려면 복사·붙여넣기 반복 -> 재사용 불가 -->
    <!-- 실수: <p style="color=blue">  // style 안은 HTML이 아니라 CSS 문법 -> = 아니고 : -->
  </section>
</body>
</html>
