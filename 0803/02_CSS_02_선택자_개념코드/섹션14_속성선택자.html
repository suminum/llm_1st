<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 14. 속성 선택자 [ABC], [ABC="XYZ"] (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 14. 속성 선택자 [ABC], [ABC="XYZ"]</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 14: 속성 선택자 [ABC], [ABC="XYZ"] ───────── */
    /* [기본] [속성] — 해당 속성을 가진 모든 요소 */
    input[disabled] {
      background-color: lightcoral;
    }
    /* [기본] [속성="값"] — 속성 값까지 일치하는 요소만 */
    input[placeholder="이름"] {
      background-color: orange;
    }
    /* 표시: disabled 입력창은 빨강, placeholder가 "이름"인 입력창은 오렌지 */
  </style>
</head>

<body>
  <h2>섹션 14. 속성 선택자 [ABC], [ABC="XYZ"]</h2>

  <!-- ── 섹션 14: 속성 선택자 ── -->
  <section>
    <input type="text" placeholder="이름" />
    <input type="text" placeholder="핸드폰" />
    <input type="text" placeholder="주민번호" disabled />
  </section>
</body>
</html>
