<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 13. 가상 요소 ::before / ::after (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 13. 가상 요소 ::before / ::after</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 13: 가상 요소 ::before / ::after ─────────── */
    /* [기본] 요소의 앞/뒤에 content 삽입 (content 속성 필수!) */
    .menu-hot::before {
      content: "[Hot] ";
      color: red;
    }
    .menu-new::after {
      content: " (추천)";
      color: blue;
    }
    /* 표시: 태그를 추가하지 않았는데 글자 앞뒤에 표시가 붙음 -> 마크업이 깔끔 */
    /* 실수: .menu-hot::before { color: red; }  // content가 없으면 아무것도 안 나옴, ""라도 필수 */
  </style>
</head>

<body>
  <h2>섹션 13. 가상 요소 ::before / ::after</h2>

  <!-- ── 섹션 13: 가상 요소 ::before / ::after ── -->
  <section>
    <p class="menu-hot">떡볶이</p>
    <p class="menu-new">김밥</p>
  </section>
</body>
</html>
