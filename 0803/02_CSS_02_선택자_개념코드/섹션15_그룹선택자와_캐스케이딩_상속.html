<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 15. 그룹 선택자와 캐스케이딩·상속 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 15. 그룹 선택자와 캐스케이딩·상속</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 15: 그룹 선택자와 캐스케이딩·상속 ────────── */
    /* [기본] 쉼표(,)로 나열 -> 여러 요소에 같은 스타일을 중복 없이 */
    h3, h4 {
      color: #1a1a2e;
    }
    /* [기본] 캐스케이딩: 같은 우선순위면 나중에 작성된 것이 이김 */
    .cascade { color: gray; }
    .cascade { color: purple; }   /* 이게 이김 */
    /* [기본] 상속: color·font는 부모 -> 자식 자동 전달, background·border는 상속 안 됨 */
    .parent-box {
      color: teal;                    /* 자식 글자도 teal (상속됨) */
      background-color: lavender;     /* 배경은 자식에 상속 안 됨 */
    }
    /* 실수: p { color: red !important; }  // !important는 모든 우선순위 무시 -> 남발 금지, 임시방편일 뿐 */
  </style>
</head>

<body>
  <h2>섹션 15. 그룹 선택자와 캐스케이딩·상속</h2>

  <!-- ── 섹션 15: 그룹 선택자와 캐스케이딩·상속 ── -->
  <section>
    <h3>h3와 h4는</h3>
    <h4>그룹으로 같은 색</h4>
    <p class="cascade">gray -> purple : 나중 것이 이김</p>
    <div class="parent-box">
      부모 상자 (연보라 배경)
      <p>자식 — 글자색 teal은 물려받고, 배경은 물려받지 않음</p>
    </div>
  </section>
</body>
</html>
