<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 1. CSS 작성법 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 1. CSS 작성법 — 선택자 { 속성: 값; }</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 1: CSS 작성법 — 선택자 { 속성: 값; } ─────── */
    /* [기본] 선택자: 누구를 / 속성: 무엇을 / 값: 어떻게 */
    h1 {
      color: royalblue;       /* 속성은 세미콜론(;)으로 구분해 여러 개 지정 */
      font-size: 28px;
    }
    /* 표시: 제목이 파란색 28px로 보임 */
    /* 실수: h1 { my-color: blue; }  // 속성은 표준 스펙에 있는 것만, 마음대로 못 만듦 */
  </style>
</head>

<body>
  <h2>섹션 1. CSS 작성법 — 선택자 { 속성: 값; }</h2>

  <!-- ── 섹션 1: CSS 작성법 ── -->
  <section>
    <h1>선택자 { 속성: 값; }</h1>
  </section>
</body>
</html>
