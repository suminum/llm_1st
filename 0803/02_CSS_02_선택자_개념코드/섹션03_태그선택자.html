<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 3. 태그 선택자 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 3. 태그 선택자</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 3: 태그 선택자 ───────────────────────────── */
    /* [기본] 태그명 그대로 -> 같은 태그 전부 선택 */
    li {
      color: seagreen;
    }
    /* 표시: 페이지의 모든 li 글자가 초록색 */
  </style>
</head>

<body>
  <h2>섹션 3. 태그 선택자</h2>

  <!-- ── 섹션 3: 태그 선택자 ── -->
  <section>
    <ul>
      <li>모든 li가</li>
      <li>초록색!</li>
    </ul>
  </section>
</body>
</html>
