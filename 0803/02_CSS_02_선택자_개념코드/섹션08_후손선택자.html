<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 8. 후손 선택자 ABC XYZ (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 8. 후손 선택자 ABC XYZ</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 8: 후손 선택자 ABC XYZ ───────────────────── */
    /* [기본] 공백 -> 자식의 자식까지 모든 후손 선택 */
    .family2 p {
      color: darkorange;
    }
    /* 표시: family2 안이면 몇 단계 아래든 p 전부 주황 */
  </style>
</head>

<body>
  <h2>섹션 8. 후손 선택자 ABC XYZ</h2>

  <!-- ── 섹션 8: 후손 선택자 (공백) ── -->
  <section>
    <div class="family2">
      <p>자식 p — 주황</p>
      <div>
        <p>손자 p도 — 주황 (후손은 전부!)</p>
      </div>
    </div>
  </section>
</body>
</html>
