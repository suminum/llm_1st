<!DOCTYPE html>
<!--
  02_CSS_02_선택자 개념코드 — 섹션 5. ID 선택자 #ABC (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_02 선택자 — 섹션 5. ID 선택자 #ABC</title>

  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 보기 편하게 섹션마다 구분선 (수업 내용 아님) */
    section { border-bottom: 1px dashed #ccc; padding: 12px; }
    body { font-family: sans-serif; }   /* 원본 섹션 2(전체 선택자 *)의 글꼴 통일 효과 재현 */

    /* ── 섹션 5: ID 선택자 #ABC ────────────────────────── */
    /* [기본] 샵(#) + id 이름. id는 페이지 내 유일해야 함 */
    #special {
      background-color: pink;
    }
    /* 표시: id="special" 하나만 분홍 배경 */
    /* 실수: 같은 id를 여러 요소에 부여  // 문법 오류는 안 나도 규칙 위반 -> class를 쓸 것 */
  </style>
</head>

<body>
  <h2>섹션 5. ID 선택자 #ABC</h2>

  <!-- ── 섹션 5: ID 선택자 ── -->
  <section>
    <p id="special">id="special" — 페이지에 딱 하나만!</p>
  </section>
</body>
</html>
