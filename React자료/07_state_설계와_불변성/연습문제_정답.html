<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>07단원 연습문제 정답 - state 설계와 불변성</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      button {
        padding: 6px 14px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        margin-right: 4px;
      }
      input,
      select,
      textarea {
        padding: 6px 8px;
        font-size: 15px;
        font-family: inherit;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 6px;
      }
      .summary {
        background: #eef4ff;
        border-left: 4px solid #2d6cdf;
        padding: 12px 20px;
        margin-top: 32px;
      }
      .summary h2 {
        margin: 6px 0 10px;
        font-size: 17px;
      }
      .summary li {
        margin: 4px 0;
        background: none;
        border: none;
        padding: 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px 12px;
        margin: 4px 0;
      }
      .done {
        text-decoration: line-through;
        color: #999;
      }
      .on {
        background: #2d6cdf;
        color: #fff;
      }
      .error {
        color: #c00;
        font-weight: bold;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <h1>07단원 연습문제 정답 — state 설계와 불변성</h1>

    <p class="guide">
      정답 파일입니다. 먼저 <strong>연습문제.html</strong> 을 스스로 풀어 본 뒤에 여세요.
      <br /><br />
      모든 문제가 완성돼 있으므로 버튼을 눌러 동작을 확인할 수 있습니다.
      <strong>문제 15만 일부러 고장 난 채로</strong> 두었습니다. 그것을 보는 문제이기 때문입니다.
      <br /><br />
      <strong>F12 → Console</strong> 도 함께 열어 두세요.
    </p>

    <div id="root"></div>

    <script src="../_lib/react.development.js"></script>
    <script src="../_lib/react-dom.development.js"></script>
    <script src="../_lib/babel.min.js"></script>

    <script type="text/babel">
      // ============================================================
      // 07단원 연습문제 정답 — state 설계와 불변성
      // ------------------------------------------------------------
      // 실행: 브라우저로 열고 직접 눌러 보세요. F12 → Console 도 함께.
      // ============================================================

      const { useState } = React;

      let nextId = 100;

      // ───── 문제 1 ─────
      function Q1() {
        const [items, setItems] = useState(["아메리카노"]);

        function handleAdd() {
          setItems([...items, "케이크"]);
        }

        return (
          <div className="demo">
            <h3>문제 1 — 담기</h3>
            <button onClick={handleAdd}>케이크 담기</button>
            <ul>
              {items.map((name, index) => (
                <li key={index}>{name}</li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): 아메리카노 · 케이크 · 케이크 …
      // 대괄호를 새로 열었으니 결과는 반드시 새 배열입니다.
      // items.push("케이크") 뒤에 setItems(items) 를 하면 화면이 안 바뀝니다.
      // 배열 안만 바뀌고 배열 자체는 전과 같은 것이라 React 가 넘어가기 때문입니다.

      // ───── 문제 2 ─────
      function Q2() {
        const [items, setItems] = useState([
          { id: 1, name: "아메리카노" },
          { id: 2, name: "케이크" },
          { id: 3, name: "라떼" },
        ]);

        function handleRemove(targetId) {
          setItems(items.filter((item) => item.id !== targetId));
        }

        return (
          <div className="demo">
            <h3>문제 2 — 빼기</h3>
            <ul>
              {items.map((item) => (
                <li key={item.id}>
                  {item.name}
                  <button onClick={() => handleRemove(item.id)}>빼기</button>
                </li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): '케이크' 의 빼기 → 아메리카노 · 라떼
      // filter 는 '남길 것' 을 고릅니다. 그래서 !== 입니다.
      // === 로 쓰면 누른 것만 남습니다. splice 는 원본을 바꾸므로 쓰지 않습니다.

      // ───── 문제 3 ─────
      function Q3() {
        const [items, setItems] = useState([
          { id: 1, name: "아메리카노", qty: 1 },
          { id: 2, name: "케이크", qty: 1 },
        ]);

        function handlePlus(targetId) {
          setItems(
            items.map((item) =>
              item.id === targetId ? { ...item, qty: item.qty + 1 } : item
            )
          );
        }

        return (
          <div className="demo">
            <h3>문제 3 — 수량 늘리기</h3>
            <ul>
              {items.map((item) => (
                <li key={item.id}>
                  {item.name} {item.qty}개
                  <button onClick={() => handlePlus(item.id)}>+1</button>
                </li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): 아메리카노 2개 / 케이크 1개
      // 삼항의 오른쪽에 item 을 그대로 돌려주는 것이 중요합니다.
      // 그 자리를 빼먹으면 안 고칠 줄이 undefined 가 되어 화면이 에러로 멈춥니다.

      // ───── 문제 4 ─────
      function Q4() {
        const [items, setItems] = useState([
          { id: 1, name: "케이크", price: 6000 },
          { id: 2, name: "아메리카노", price: 4000 },
          { id: 3, name: "라떼", price: 4500 },
        ]);

        function handleSort() {
          setItems([...items].sort((a, b) => a.price - b.price));
        }

        return (
          <div className="demo">
            <h3>문제 4 — 정렬</h3>
            <button onClick={handleSort}>싼 것부터</button>
            <ul>
              {items.map((item) => (
                <li key={item.id}>
                  {item.name} — {item.price}원
                </li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): 아메리카노 4000 → 라떼 4500 → 케이크 6000
      // [...items] 를 빼면 items 자신을 정렬하고 그것을 다시 넣게 됩니다.
      // 정렬은 됐는데 화면만 안 바뀌는, 가장 헷갈리는 상태가 됩니다.

      // ───── 문제 5 ─────
      function Q5() {
        const [user, setUser] = useState({ name: "김민준", age: 20, city: "서울" });

        function handleMove() {
          setUser({ ...user, city: "대구" });
        }

        return (
          <div className="demo">
            <h3>문제 5 — 객체의 한 속성만 바꾸기</h3>
            <button onClick={handleMove}>대구로 이사</button>
            <div className="output">
              {user.name} / {user.age}살 / {user.city}
            </div>
          </div>
        );
      }
      // 화면(누르면): 김민준 / 20살 / 대구
      // setUser({ city: "대구" }) 라고 쓰면 name 과 age 가 사라집니다.
      // React 는 객체 state 를 합쳐 주지 않고 통째로 갈아끼웁니다.

      // ───── 문제 6 ─────
      function Q6() {
        const [order, setOrder] = useState({ menu: "아메리카노", ice: true });

        function handleToggle() {
          setOrder({ ...order, ice: !order.ice });
        }

        return (
          <div className="demo">
            <h3>문제 6 — 불리언 뒤집기</h3>
            <button onClick={handleToggle}>얼음 켜기/끄기</button>
            <div className="output">
              {order.menu} / 얼음 {order.ice ? "있음" : "없음"}
            </div>
          </div>
        );
      }
      // 화면(누르면): 얼음 있음 ↔ 얼음 없음 이 번갈아 나옵니다.
      // ice: false 라고 고정값을 쓰면 한 번 꺼진 뒤로 다시 안 켜집니다.
      // 뒤집기는 04단원에서 배운 ! 를 씁니다.

      // ───── 문제 7 ─────
      function Q7() {
        const [order, setOrder] = useState({
          menu: "아메리카노",
          option: { size: "M", ice: true },
        });

        function handleSizeUp() {
          setOrder({
            ...order,
            option: { ...order.option, size: "L" },
          });
        }

        return (
          <div className="demo">
            <h3>문제 7 — 중첩 객체 바꾸기</h3>
            <button onClick={handleSizeUp}>L 사이즈로</button>
            <div className="output">
              {order.menu} / {order.option.size} 사이즈 / 얼음 {order.option.ice ? "있음" : "없음"}
            </div>
          </div>
        );
      }
      // 화면(누르면): 아메리카노 / L 사이즈 / 얼음 있음
      // option: { size: "L" } 이라고만 쓰면 ice 가 사라져 '얼음' 자리가 빈칸이 됩니다.
      // 바꾸려는 값까지 가는 길에 있는 객체를 전부 새로 만들어야 합니다.

      // ───── 문제 8 ─────
      // items 를 부모 Q8 로 올렸습니다. 두 자식은 props 로 받기만 합니다.
      function Q8List({ items }) {
        return (
          <ul>
            {items.map((name, index) => (
              <li key={index}>{name}</li>
            ))}
          </ul>
        );
      }

      function Q8Count({ items }) {
        return <div className="output">담긴 개수: {items.length}개</div>;
      }

      function Q8() {
        const [items, setItems] = useState(["아메리카노"]);

        function handleAdd() {
          setItems([...items, "라떼"]);
        }

        return (
          <div className="demo">
            <h3>문제 8 — state 끌어올리기</h3>
            <button onClick={handleAdd}>라떼 담기</button>
            <Q8List items={items} />
            <Q8Count items={items} />
          </div>
        );
      }
      // 화면(누르면): 목록이 2줄이 되는 순간 '담긴 개수' 도 2개가 됩니다.
      // 값이 한 곳뿐이라 어긋날 방법이 없습니다. 맞추는 코드를 한 줄도 안 썼습니다.
      // 자식에서 useState 를 지우고 매개변수 자리에 { items } 를 적는 것이 핵심입니다.

      // ───── 문제 9 ─────
      function Q9Button({ onAdd }) {
        // props 를 매개변수 자리에서 바로 구조분해했습니다(03단원 개념03).
        return <button onClick={onAdd}>삼각김밥 담기</button>;
      }

      function Q9() {
        const [items, setItems] = useState([]);

        function handleAdd() {
          setItems([...items, { id: nextId, name: "삼각김밥" }]);
          nextId = nextId + 1;
        }

        return (
          <div className="demo">
            <h3>문제 9 — 함수를 자식에게 내려보내기</h3>
            <Q9Button onAdd={handleAdd} />
            <ul>
              {items.map((item) => (
                <li key={item.id}>{item.name}</li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): 목록에 "삼각김밥" 이 한 줄씩 늘어납니다.
      // onClick={onAdd} 는 괄호가 없습니다. 함수 자체를 넘기는 것입니다.
      // onClick={onAdd()} 라고 쓰면 화면을 그리는 순간 실행되어 버립니다.

      // ───── 문제 10 ─────
      function Q10Row({ item, onRemove }) {
        return (
          <li>
            {item.name}
            <button onClick={() => onRemove(item.id)}>빼기</button>
          </li>
        );
      }

      function Q10() {
        const [items, setItems] = useState([
          { id: 1, name: "아메리카노" },
          { id: 2, name: "케이크" },
        ]);

        function handleRemove(targetId) {
          setItems(items.filter((item) => item.id !== targetId));
        }

        return (
          <div className="demo">
            <h3>문제 10 — 값을 같이 넘기기</h3>
            <ul>
              {items.map((item) => (
                <Q10Row key={item.id} item={item} onRemove={handleRemove} />
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): '케이크' 의 빼기 → 아메리카노만 남습니다.
      // 값을 넘겨야 하므로 () => onRemove(item.id) 로 한 겹 감쌌습니다.
      // onClick={onRemove(item.id)} 라고 쓰면 그리는 순간 실행되고,
      // 그 안에서 또 state 를 바꾸므로 "Too many re-renders" 로 화면이 통째로 빕니다.

      // ───── 문제 11 ─────
      function Q11() {
        const [items, setItems] = useState([
          { id: 1, name: "아메리카노" },
          { id: 2, name: "케이크" },
        ]);

        // count state 를 없애고 계산으로 바꿨습니다.
        const count = items.length;

        function handleAdd() {
          setItems([...items, { id: nextId, name: "라떼" }]);
          nextId = nextId + 1;
        }

        function handleRemoveLast() {
          setItems(items.slice(0, items.length - 1));
        }

        return (
          <div className="demo">
            <h3>문제 11 — 개수를 계산해서 쓰기</h3>
            <button onClick={handleAdd}>라떼 담기</button>
            <button onClick={handleRemoveLast}>맨 뒤 빼기</button>
            <div className="output">담긴 개수: {count}개</div>
            <ul>
              {items.map((item) => (
                <li key={item.id}>{item.name}</li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): '맨 뒤 빼기' → 담긴 개수: 1개 / 목록도 1줄
      // handleAdd 에서 setCount 줄도 함께 지웠습니다. 이제 챙길 것이 없습니다.
      // 앞으로 '비우기' 나 '되돌리기' 를 붙여도 개수는 저절로 맞습니다.

      // ───── 문제 12 ─────
      function Q12() {
        const [items, setItems] = useState([
          { id: 1, name: "아메리카노", price: 4000 },
          { id: 2, name: "케이크", price: 6000 },
        ]);

        const total = items.reduce((sum, item) => sum + item.price, 0);

        function handleAdd() {
          setItems([...items, { id: nextId, name: "라떼", price: 4500 }]);
          nextId = nextId + 1;
        }

        return (
          <div className="demo">
            <h3>문제 12 — 총액 계산하기</h3>
            <button onClick={handleAdd}>라떼 담기</button>
            <div className="output">총액: {total}원</div>
            <ul>
              {items.map((item) => (
                <li key={item.id}>
                  {item.name} — {item.price}원
                </li>
              ))}
            </ul>
          </div>
        );
      }
      // 화면: 총액: 10000원   화면(누르면): 총액: 14500원
      // reduce 의 두 번째 인자 0 은 시작값입니다. 빼먹으면 목록이 빌 때 에러가 납니다.
      // 이 값을 setTotal 로 따로 저장하면 문제 11과 똑같은 버그가 생깁니다.

      // ───── 문제 13 ───── [응용]
      function Q13Row({ item, onChangeQty }) {
        return (
          <li>
            {item.name} {item.qty}개
            <button onClick={() => onChangeQty(item.id, 1)}>+</button>
            <button onClick={() => onChangeQty(item.id, -1)}>−</button>
          </li>
        );
      }

      function Q13() {
        const [items, setItems] = useState([
          { id: 1, name: "아메리카노", qty: 1 },
          { id: 2, name: "케이크", qty: 1 },
        ]);

        function handleChangeQty(targetId, diff) {
          setItems(
            items.map((item) => {
              // 다른 줄은 손대지 않고 그대로 돌려줍니다.
              if (item.id !== targetId) {
                return item;
              }

              const nextQty = item.qty + diff;

              // 1 아래로는 안 내려가게 막습니다. 이때도 원래 것을 그대로 돌려줍니다.
              if (nextQty < 1) {
                return item;
              }

              return { ...item, qty: nextQty };
            })
          );
        }

        return (
          <div className="demo">
            <h3>문제 13 [응용] — 수량 올리고 내리기</h3>
            <ul>
              {items.map((item) => (
                <Q13Row key={item.id} item={item} onChangeQty={handleChangeQty} />
              ))}
            </ul>
          </div>
        );
      }
      // 화면(누르면): '+' 두 번 → 아메리카노 3개 / '−' 를 계속 눌러도 1개에서 멈춥니다.
      // 자식은 "얼마나 바꿀지" 만 알리고, 1 아래로 못 가게 막는 판단은 부모가 합니다.
      // 이렇게 두면 나중에 '최대 10개' 같은 규칙이 생겨도 부모만 고치면 됩니다.
      // map 을 중괄호 몸통으로 쓸 때는 모든 갈래에서 return 을 해야 합니다.
      // 하나라도 빠지면 그 자리가 undefined 가 되어 화면이 에러로 멈춥니다.

      // ───── 문제 14 ───── [도전]
      const q14Menu = [
        { id: 1, name: "아메리카노", price: 4000 },
        { id: 2, name: "라떼", price: 4500 },
        { id: 3, name: "케이크", price: 6000 },
      ];

      function Q14() {
        const [cart, setCart] = useState([]);

        // 둘 다 state 가 아닙니다. cart 하나로 계산합니다.
        const count = cart.reduce((sum, item) => sum + item.qty, 0);
        const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

        function handlePick(menu) {
          const already = cart.find((item) => item.id === menu.id);

          if (already) {
            // 이미 있으면 그 줄의 수량만 1 올립니다 (개념01 수정)
            setCart(
              cart.map((item) =>
                item.id === menu.id ? { ...item, qty: item.qty + 1 } : item
              )
            );
            return;
          }

          // 없으면 새 줄을 뒤에 붙입니다 (개념01 추가)
          setCart([...cart, { id: menu.id, name: menu.name, price: menu.price, qty: 1 }]);
        }

        function handleRemove(targetId) {
          setCart(cart.filter((item) => item.id !== targetId));
        }

        return (
          <div className="demo">
            <h3>문제 14 [도전] — 작은 장바구니</h3>
            {q14Menu.map((menu) => (
              <button key={menu.id} onClick={() => handlePick(menu)}>
                {menu.name}
              </button>
            ))}
            <div className="output">
              담긴 개수: {count}개 / 총액: {total}원
            </div>
            {cart.length === 0 ? (
              <div className="output">장바구니가 비었습니다</div>
            ) : (
              <ul>
                {cart.map((item) => (
                  <li key={item.id}>
                    {item.name} {item.qty}개 — {item.price * item.qty}원
                    <button onClick={() => handleRemove(item.id)}>빼기</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        );
      }
      // 화면(누르면): 아메리카노 → 아메리카노 → 케이크 순서로 누르면
      //               "아메리카노 2개 — 8000원", "케이크 1개 — 6000원",
      //               "담긴 개수: 3개 / 총액: 14000원"
      //
      // 이 문제 하나에 07단원이 다 들어 있습니다.
      //   담기(있으면 수정, 없으면 추가) — 개념01
      //   { ...item, qty: ... }          — 개념02
      //   메뉴 버튼이 부모 함수를 부름   — 개념04
      //   개수·총액을 계산해서 씀        — 개념05
      //
      // 담긴 개수를 cart.length 로 세면 안 됩니다. 그건 '줄 수' 입니다.
      // 수량을 다 더해야 하므로 reduce 를 씁니다.
      // 13단원 종합02 장바구니가 여기서 조금 더 자란 모습입니다.

      // ───── 문제 15 ───── (에러 확인)
      // ★ 이 문제만 일부러 고장 난 채로 두었습니다. 그것을 보는 문제이기 때문입니다.
      function Q15() {
        const [items, setItems] = useState(["아메리카노"]);
        const [redrawCount, setRedrawCount] = useState(0);

        // 화면을 그릴 때마다 찍힙니다.
        // '담기(push)' 를 눌러도 이 줄이 다시 안 찍히는 것이
        // React 가 화면을 다시 그리지 않았다는 증거입니다.
        console.log("[문제 15] 화면을 그렸습니다. items.length:", items.length);
        // 콘솔: [문제 15] 화면을 그렸습니다. items.length: 1

        function handleWrongAdd() {
          items.push("케이크");
          setItems(items);
        }

        return (
          <div className="demo">
            <h3>문제 15 — 에러 확인 (일부러 고장 난 코드)</h3>
            <button onClick={handleWrongAdd}>담기(push)</button>
            <button onClick={() => setRedrawCount(redrawCount + 1)}>
              화면 강제로 다시 그리기
            </button>
            <ul>
              {items.map((name, index) => (
                <li key={index}>{name}</li>
              ))}
            </ul>
          </div>
        );
      }
      //
      // 답:
      //   push 는 배열 '안' 만 바꿉니다. 배열 자체는 전과 같은 것입니다.
      //   React 는 새로 받은 값이 전과 같은 것인지만 비교하고 다시 그릴지 정합니다.
      //   그래서 setItems(items) 는 "바뀐 게 없다" 로 판단되어 아무 일도 안 일어납니다.
      //   '화면을 그렸습니다' 가 다시 안 찍히는 것이 그 증거입니다.
      //   컴포넌트를 다시 실행하지도 않은 것입니다.
      //   '화면 강제로 다시 그리기' 는 redrawCount 라는 다른 state 를 바꿉니다.
      //   그것 때문에 컴포넌트가 다시 실행되면서, 그동안 쌓인 것이 한꺼번에 나타납니다.
      //   그때 콘솔에 "items.length: 4" 가 찍힙니다. 배열은 진작 4개였던 것입니다.
      //
      // 화면(누르면): 담기(push)를 세 번 눌러도 "아메리카노" 한 줄
      // 화면(누르면): 그 뒤 강제로 다시 그리기 → 아메리카노 · 케이크 · 케이크 · 케이크
      //
      // 고치는 방법:
      //   setItems([...items, "케이크"]);
      //
      // 에러가 안 나기 때문에 초보자가 가장 오래 헤매는 버그입니다.
      // "버튼이 안 먹는다" 싶으면 원본을 바꾸는 메소드부터 찾아보세요.
      //   push · pop · unshift · shift · splice · sort · reverse

      // ------------------------------------------------------------
      // 문제들을 화면에 붙입니다.
      // ------------------------------------------------------------

      function App() {
        return (
          <div>
            <Q1 />
            <Q2 />
            <Q3 />
            <Q4 />
            <Q5 />
            <Q6 />
            <Q7 />
            <Q8 />
            <Q9 />
            <Q10 />
            <Q11 />
            <Q12 />
            <Q13 />
            <Q14 />
            <Q15 />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.querySelector("#root"));
      root.render(<App />);
    </script>
  </body>
</html>
