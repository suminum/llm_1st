<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>02단원 연습문제 - JSX</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      button {
        padding: 6px 14px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        margin-right: 4px;
      }
      input,
      select,
      textarea {
        padding: 6px 8px;
        font-size: 15px;
        font-family: inherit;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 6px;
      }
      .summary {
        background: #eef4ff;
        border-left: 4px solid #2d6cdf;
        padding: 12px 20px;
        margin-top: 32px;
      }
      .summary h2 {
        margin: 6px 0 10px;
        font-size: 17px;
      }
      .summary li {
        margin: 4px 0;
        background: none;
        border: none;
        padding: 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px 12px;
        margin: 4px 0;
      }
      .done {
        text-decoration: line-through;
        color: #999;
      }
      .on {
        background: #2d6cdf;
        color: #fff;
      }
      .error {
        color: #c00;
        font-weight: bold;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <h1>02단원 연습문제 — JSX</h1>

    <p class="guide">
      script 안의 TODO 자리를 고치고 저장한 뒤 브라우저를
      <strong>새로고침(F5)</strong>하세요.<br />
      1~11은 기본, 12는 [응용], 13은 [도전], 14는 에러 확인입니다.
      <br /><br />
      <strong>화면이 통째로 비면</strong> 문법이 깨진 것입니다. 놀라지 마세요.
      <strong>F12 → Console</strong> 의 빨간 글씨 <strong>첫 줄</strong>을 읽고,
      방금 고친 곳을 되돌리면 화면이 돌아옵니다. <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 위쪽
      <code>&lt;style&gt;</code> 은 화면 모양을 만드는 코드입니다.
      <code>&lt;script type="text/babel"&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>내가 만든 화면</h3>
      <div id="root"></div>
    </div>

    <script src="../_lib/react.development.js"></script>
    <script src="../_lib/react-dom.development.js"></script>
    <script src="../_lib/babel.min.js"></script>

    <script type="text/babel">
      // ============================================================
      // 02단원 연습문제 — JSX
      // ------------------------------------------------------------
      // 실행: 브라우저로 열고, 고친 뒤 저장하고 새로고침(F5).
      //       F12 → Console 도 함께 보세요.
      // ============================================================

      // ───── 준비물 ───── (문제에서 쓸 값입니다. 고치지 마세요)

      const user = { name: "김민준", age: 20 };
      const menu = ["아메리카노", "라떼", "케이크"];
      const price = 4000;
      const isOpen = true;
      const stock = 0;
      const homepage = "https://example.com";

      // 개념01에서 만든 도구입니다. 문제 2에서 씁니다.
      function toJs(jsxCode) {
        return Babel.transform(jsxCode, {
          presets: ["react"],
          generatorOpts: { jsescOption: { minimal: true }, concise: true },
        }).code;
      }

      // ───── 문제 1 ───── (개념01)
      // <h2>오늘의 메뉴</h2> 를 title 이라는 변수에 담고,
      // title.type 과 title.props 를 콘솔에 찍으세요.
      //
      // 기대 결과 (콘솔): h2
      //                  { children: '오늘의 메뉴' }
      //                  화면에 <h2>오늘의 메뉴</h2> 가 글자로 보이면 따옴표로 감싼 것입니다.
      // TODO: 여기에 코드를 쓰세요
      const title = <h2>오늘의 메뉴</h2>;
      console.log(title.type);
      console.log(title.props);

      // ───── 문제 2 ───── (개념01)
      // toJs 를 써서 "<p>라떼 4500원</p>" 가 무엇으로 바뀌는지 콘솔에 찍으세요.
      //
      // 기대 결과 (콘솔): /*#__PURE__*/React.createElement("p", null, "라떼 4500원");
      //                  아무것도 안 찍히면 console.log 로 감싸지 않은 것입니다.
      // TODO: 여기에 코드를 쓰세요
      console.log(toJs("<p>라떼 4500원</p>"));
      // ───── 문제 3 ───── (개념02)
      // answer3 이 "김민준님 안녕하세요" 를 보여 주게 고치세요.
      // 이름은 반드시 user 에서 꺼내 쓰세요. 직접 적으면 안 됩니다.
      //
      // 기대 결과 (화면): 김민준님 안녕하세요
      //                  화면에 user.name 이라는 글자가 그대로 보이면 중괄호를 안 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer3 = <p>{user.name}님 안녕하세요</p>;

      // ───── 문제 4 ───── (개념02)
      // answer4 가 아메리카노 두 잔 값을 보여 주게 고치세요.
      // 8000 이라고 직접 적지 말고 price 로 계산하세요.
      //
      // 기대 결과 (화면): 아메리카노 두 잔은 8000원입니다
      //                  화면에 price * 2 라는 글자가 보이면 중괄호를 안 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer4 = <p>아메리카노 두잔값은 {price * 2}원입니다.</p>;

      // ───── 문제 5 ───── (개념02)
      // answer5 가 나이에 따라 다른 글자를 보여 주게 고치세요.
      // 19살 이상이면 "성인", 아니면 "미성년" 입니다.
      // 중괄호 안에는 if 문을 쓸 수 없습니다. 삼항 연산자를 쓰세요.
      //
      // 기대 결과 (화면): 김민준님은 성인입니다
      //                  화면이 통째로 비면 중괄호 안에 if 문을 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer5 = (
        <p>
          {user.name}님은 {user.age > 19 ? "성인" : "미성년"}입니다.
        </p>
      );

      // ───── 문제 6 ───── (개념02)
      // answer6 이 메뉴 개수와 메뉴 이름을 함께 보여 주게 고치세요.
      // 3 이라고 직접 적지 말고 menu 에서 개수를 구하세요.
      //
      // 기대 결과 (화면): 메뉴 3개: 아메리카노, 라떼, 케이크
      //                  "아메리카노라떼케이크" 로 붙어 나오면 join 을 안 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer6 = (
        <p>
          메뉴 {menu.length} : {menu.join(", ")}
        </p>
      );

      // ───── 문제 7 ───── (개념03)
      // answer7 에 클래스 두 개(output 과 on)를 붙이세요.
      // 두 클래스는 이 파일 위쪽 style 블록에 이미 만들어져 있습니다.
      //
      // 기대 결과 (화면): "파란 상자" 가 파란 바탕에 흰 글씨로 보입니다.
      //                  색이 안 변하고 콘솔에 Invalid DOM property 경고가 나오면
      //                  className 이 아니라 class 라고 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer7 = <p className="output on">파란 상자</p>;
      console.log(answer7.props.className);
      console.log(answer7.props.style);

      // ───── 문제 8 ───── (개념03)
      // answer8 에 style 을 붙이세요. 글자색은 "#c00", 배경색은 "#fff8dc" 입니다.
      // 중괄호가 몇 개 필요한지 생각해 보세요.
      //
      // 기대 결과 (화면): "노란 바탕에 빨간 글자" 가 정말 그렇게 보입니다.
      //                  색이 안 칠해지고 Unsupported style property 경고가 나오면
      //                  배경색 이름을 카멜케이스로 안 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer8 = (
        <p style={{ color: "#c00", backgroundColor: "#fff8dc" }}>
          노란 바탕에 빨간 글자
        </p>
      );

      // ───── 문제 9 ───── (개념03)
      // answer9 의 링크가 homepage 변수의 주소로 가게 하세요.
      // 주소를 직접 적지 말고 변수를 쓰세요.
      //
      // 기대 결과 (화면): "홈페이지로 가기" 링크가 보입니다.
      //                  마우스를 올리면 브라우저 왼쪽 아래에 example.com 이 보입니다.
      //                  거기에 homepage 라는 글자가 보이면 따옴표를 같이 쓴 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer9 = <a href={homepage}>홈페이지로 가기</a>;
      console.log(answer9.props.href);

      // ───── 문제 10 ───── (개념03)
      // answer10 의 버튼이 재고가 0일 때만 잠기게 하세요.
      // stock 값을 써서 잠금 여부를 정하세요. true 나 false 를 직접 적지 마세요.
      //
      // 기대 결과 (화면): stock 이 0 이므로 "담기" 버튼이 회색이고 눌리지 않습니다.
      //                  준비물의 stock 을 3 으로 바꾸면 잠금이 풀려야 합니다.
      //                  (확인한 뒤에는 0 으로 되돌리세요)
      // TODO: 아래 줄을 고치세요
      const answer10 = <button disabled={stock === 0}>담기</button>;

      // ───── 문제 11 ───── (개념04)
      // answer11 이 <h4>아메리카노</h4> 와 <p>4000원</p> 두 줄을 함께 담게 하세요.
      // 단, 화면에 감싸는 태그가 남으면 안 됩니다.
      //
      // 기대 결과 (화면): "아메리카노" 와 "4000원" 두 줄이 나옵니다.
      //                  화면이 통째로 비면 두 태그를 감싸지 않고 나란히 둔 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer11 = (
        <>
          <h4>아아</h4>//인라인요소가 아닌 블록요소라서 띄어쓰기됨 걍 html이여
          <p>4000원</p>
        </>
      );

      // ───── 문제 12 ───── [응용] (개념02 · 개념03 · 개념05)
      // answer12 에 주문서 한 장을 만드세요. 여러 줄로 써야 하니 소괄호를 쓰세요.
      //
      //   - 바깥은 className 이 "output" 인 div
      //   - 그 안에 <h4> 로 "김민준님의 주문" (이름은 user 에서 꺼낼 것)
      //   - <p> 로 "아메리카노 4,000원"   ← 쉼표가 들어간 표기입니다
      //   - <p> 로 "세 잔 합계 12,000원"  ← 12000 을 직접 적지 말고 계산할 것
      //
      // 기대 결과 (화면): 흰 상자 안에 세 줄이 보입니다.
      //                  김민준님의 주문 / 아메리카노 4,000원 / 세 잔 합계 12,000원
      //                  4000 처럼 쉼표가 없으면 toLocaleString 을 안 쓴 것입니다.
      //                  (개념02 섹션 2에서 썼습니다)
      // TODO: 아래 줄을 고치세요
      const answer12 = (
        <div className="output">
          <h4>"{user.name}님의 주문"</h4>
          <p>아아 : {price.toLocaleString()}원</p>
          <p>총합: {(price * 3).toLocaleString()}원</p>
        </div>
      );

      // ───── 문제 13 ───── [도전] (개념02 · 개념03 · 개념04 · 개념05)
      // answer13 에 가게 상태를 보여 주는 화면을 만드세요.
      // 감싸는 태그가 화면에 남으면 안 됩니다.
      //
      //   - 첫 줄 <p> : isOpen 이 true 면 "영업 중", false 면 "준비 중"
      //                 글자색도 같이 바뀝니다. true 면 "green", false 면 "gray"
      //   - 둘째 줄 <p> : "3종류를 팝니다" (3 은 menu 에서 구할 것)
      //
      // 기대 결과 (화면): 초록 글씨로 "영업 중", 그 아래 "3종류를 팝니다"
      //                  준비물의 isOpen 을 false 로 바꾸면
      //                  회색 글씨로 "준비 중" 이 되어야 합니다.
      //                  (확인한 뒤에는 true 로 되돌리세요)
      //                  글자만 바뀌고 색이 그대로면 style 안에는 삼항을 안 넣은 것입니다.
      // TODO: 아래 줄을 고치세요
      const answer13 = (
        <p style={{ color: isOpen === true ? "green" : "gray" }}>
          {isOpen === true ? "영업 중" : "준비 중"}{" "}
        </p>
        // ───── 문제 14 ───── (에러 확인 — 맨 마지막)
      );
          //지금 태그가 p 말고 다른 여러개 가 있으면 <>빈캐그로 묶어서 줘야하고 
          //여러줄이니 ()로 묶은거임
      // 아래 두 줄의 주석을 풀고 저장한 뒤 새로고침해 보세요.
      // 화면이 통째로 비고 콘솔에 빨간 글씨가 나옵니다.
      // 그 첫 줄을 읽고, 왜 그런지 답해 보세요.
      //
      // const badLine = <p>{user}</p>;
      // ReactDOM.createRoot(document.querySelector("#root")).render(badLine);
      //
      // 콘솔의 빨간 글씨 첫 줄: ______________________________________
      //
      // 왜 이렇게 되나: ______________________________________
      //
      // 고치는 방법: ______________________________________
      //
      // ★ 확인한 뒤에는 반드시 다시 // 를 붙여 주석으로 되돌리세요.
      //   안 그러면 아래 화면이 계속 비어 있습니다.

      // ───── 여기부터는 고치지 마세요 ─────
      // 위에서 만든 답들을 화면에 늘어놓는 코드입니다.

      function App() {
        return (
          <div>
            <div className="output">
              <h4>문제 3</h4>
              {answer3}
            </div>
            <div className="output">
              <h4>문제 4</h4>
              {answer4}
            </div>
            <div className="output">
              <h4>문제 5</h4>
              {answer5}
            </div>
            <div className="output">
              <h4>문제 6</h4>
              {answer6}
            </div>
            <div className="output">
              <h4>문제 7</h4>
              {answer7}
            </div>
            <div className="output">
              <h4>문제 8</h4>
              {answer8}
            </div>
            <div className="output">
              <h4>문제 9</h4>
              {answer9}
            </div>
            <div className="output">
              <h4>문제 10</h4>
              {answer10}
            </div>
            <div className="output">
              <h4>문제 11</h4>
              {answer11}
            </div>
            <div className="output">
              <h4>문제 12 [응용]</h4>
              {answer12}
            </div>
            <div className="output">
              <h4>문제 13 [도전]</h4>
              {answer13}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.querySelector("#root")).render(<App />);
    </script>
  </body>
</html>
