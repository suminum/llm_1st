<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>01단원 연습문제 정답 - React 시작하기</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
        color: #222;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      button {
        padding: 6px 14px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        margin-right: 4px;
      }
      input,
      select,
      textarea {
        padding: 6px 8px;
        font-size: 15px;
        font-family: inherit;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 6px;
      }
      .summary {
        background: #eef4ff;
        border-left: 4px solid #2d6cdf;
        padding: 12px 20px;
        margin-top: 32px;
      }
      .summary h2 {
        margin: 6px 0 10px;
        font-size: 17px;
      }
      .summary li {
        margin: 4px 0;
        background: none;
        border: none;
        padding: 0;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px 12px;
        margin: 4px 0;
      }
      .done {
        text-decoration: line-through;
        color: #999;
      }
      .on {
        background: #2d6cdf;
        color: #fff;
      }
      .error {
        color: #c00;
        font-weight: bold;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <h1>01단원 연습문제 정답 — React 시작하기</h1>

    <p class="guide">
      먼저 스스로 풀어 본 다음에 보세요. 직접 눌러 보면서
      <strong>F12 → Console</strong> 도 함께 확인하세요.
      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 위쪽 <code>&lt;style&gt;</code> 과
      <code>&lt;body&gt;</code> 는 화면 모양을 만드는 코드입니다.
      <code>&lt;script type="text/babel"&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>문제 1</h3>
      <div id="q1"></div>

      <h3>문제 2~3</h3>
      <div id="q2"></div>

      <h3>문제 4</h3>
      <div id="q4"></div>

      <h3>문제 7</h3>
      <div id="q7"></div>
      <button id="q7Btn">누르기</button>

      <h3>문제 8~9</h3>
      <div id="q8"></div>
      <button id="q8StopBtn">초시계 멈춤</button>

      <h3>문제 10</h3>
      <div id="q10"></div>

      <h3>문제 11 — 응용</h3>
      <div id="q11"></div>
      <button id="q11AmeBtn">아메리카노 담기</button>
      <button id="q11LatteBtn">라떼 담기</button>

      <h3>문제 12 — 도전</h3>
      <div id="q12"></div>
      <button id="q12StopBtn">초시계 멈춤</button>

      <h3>문제 13 — 에러 확인</h3>
      <div id="q13"></div>
    </div>

    <script src="../_lib/react.development.js"></script>
    <script src="../_lib/react-dom.development.js"></script>
    <script src="../_lib/babel.min.js"></script>

    <script type="text/babel">
      // ============================================================
      // 01단원 연습문제 정답 — React 시작하기
      // ------------------------------------------------------------
      // 실행: 브라우저로 열기. 직접 눌러 보세요. F12 → Console 도 함께.
      // ============================================================

      // ───── 문제 1 ─────
      ReactDOM.createRoot(document.querySelector("#q1")).render(<h3>안녕하세요</h3>);
      // 화면: 문제 1 상자에 "안녕하세요" 가 굵고 큰 글씨로 보입니다.
      //
      // 한 줄로 이어 붙여 썼습니다. 아래처럼 두 줄로 나눠도 똑같습니다.
      //   const q1Root = ReactDOM.createRoot(document.querySelector("#q1"));
      //   q1Root.render(<h3>안녕하세요</h3>);
      // 다시 그릴 일이 없으면 한 줄이 편하고,
      // 다시 그릴 일이 있으면 문제 2처럼 변수에 담아 둬야 합니다.

      // ───── 문제 2 ─────
      const root2 = ReactDOM.createRoot(document.querySelector("#q2"));
      root2.render(<p>아메리카노 4000원</p>);
      // 화면: 잠깐 "아메리카노 4000원" 이 그려졌다가 문제 3에서 바뀝니다.
      //
      // createRoot 가 돌려준 것을 root2 에 담아 뒀습니다.
      // 담아 두지 않으면 문제 3에서 다시 그릴 방법이 없어집니다.

      // ───── 문제 3 ─────
      root2.render(<p>라떼 4500원</p>);
      // 화면: 문제 2~3 상자에 "라떼 4500원" 만 보입니다.
      //
      // 같은 root 에 render 를 다시 불렀습니다. 아래에 쌓이지 않고 갈아 끼워집니다.
      // createRoot 를 또 불렀다면 이런 경고가 났을 것입니다.
      //   Warning: You are calling ReactDOMClient.createRoot() on a container
      //   that has already been passed to createRoot() before.
      // 자리를 맡는 것은 한 번, 그리는 것은 여러 번입니다.

      // ───── 문제 4 ─────
      function App4() {
        return <p>김민준님 환영합니다</p>;
      }

      const q4Root = ReactDOM.createRoot(document.querySelector("#q4"));
      q4Root.render(<App4 />);
      // 화면: 문제 4 상자에 "김민준님 환영합니다" 가 보입니다.
      //
      // 두 가지를 지켰습니다.
      //   - 함수 이름이 대문자 A 로 시작합니다. 소문자면 화면이 조용히 빕니다.
      //   - render 에 <App4 /> 처럼 꺾쇠를 씌워 넣었습니다.
      //     App4 라고만 넣으면 이런 경고가 나고 화면이 빕니다.
      //       Warning: Functions are not valid as a React child.

      // ───── 문제 5 ─────
      console.log(React.version);
      // 콘솔: 18.3.1
      //
      // React 는 위쪽 react.development.js 가 만들어 준 이름입니다.
      // react 나 REACT 로 쓰면 undefined 입니다. 대소문자를 구분합니다.

      // ───── 문제 6 ─────
      // 첫 줄: Download the React DevTools for a better development experience: ...
      //        뜻: React 개발용 크롬 확장 프로그램을 깔면 편하다는 안내입니다.
      //            바로 아래 붙어 나오는 문장은 "파일을 더블클릭(file://)으로 열면
      //            그 확장 프로그램이 잘 안 붙을 수 있다" 는 뜻입니다.
      //
      // 둘째 줄: You are using the in-browser Babel transformer. ...
      //         뜻: 지금 브라우저 안에서 그때그때 JSX 를 번역하고 있으니
      //             실제 서비스에 올릴 때는 미리 번역해 두라는 안내입니다.
      //
      // 둘 다 정상입니다. 고칠 것이 없습니다.
      // 첫 줄은 굵은 안내, 둘째 줄은 노란 경고로 보입니다. 빨간 줄이 아닙니다.
      // 08단원에서 Vite 로 옮기면 둘째 줄은 사라집니다.

      // ───── 문제 7 ─────
      let q7Count = 0; // ★ 콜백 '밖' 에 만들어야 값이 유지됩니다 (JS자료 11단원과 같습니다)

      function Q7Counter() {
        return <p>눌린 횟수: {q7Count}</p>;
      }

      const q7Root = ReactDOM.createRoot(document.querySelector("#q7"));
      q7Root.render(<Q7Counter />); // 첫 화면

      document.querySelector("#q7Btn").addEventListener("click", () => {
        q7Count = q7Count + 1; // (1) 데이터를 바꾸고
        q7Root.render(<Q7Counter />); // (2) 다시 그려 달라고 부릅니다
        console.log(`눌린 횟수: ${q7Count}`);
        // 콘솔: 눌린 횟수: 1
      });
      // 화면(누르면): 문제 7 상자가 "눌린 횟수: 1" → "눌린 횟수: 2" 로 올라갑니다.
      //
      // (2)를 빠뜨리면 콘솔의 숫자는 오르는데 화면은 0 그대로입니다.
      // 에러도 경고도 안 납니다. 개념03 섹션 5에서 본 그 함정입니다.
      // 04단원에서 useState 를 배우면 (2)를 우리가 안 써도 됩니다.

      // ───── 문제 8 ─────
      let q8Seconds = 0;
      let q8TimerId = null;

      function Q8Clock() {
        return (
          <div>
            <p>초시계: {q8Seconds}초</p>
            <p>
              입력칸: <input />
            </p>
          </div>
        );
      }

      const q8Root = ReactDOM.createRoot(document.querySelector("#q8"));
      q8Root.render(<Q8Clock />);

      q8TimerId = setInterval(() => {
        q8Seconds = q8Seconds + 1;
        q8Root.render(<Q8Clock />);
      }, 1000);
      // 화면: 문제 8~9 상자의 숫자가 1초마다 0 → 1 → 2 로 올라갑니다.
      //
      // 여기서도 "데이터를 바꾸고 → 다시 그린다" 두 줄입니다. 문제 7과 같은 모양입니다.
      // 다른 점은 버튼 대신 setInterval 이 1초마다 대신 눌러 주는 것뿐입니다.
      // setInterval 이 돌려준 아이디를 q8TimerId 에 담아 둬야 멈출 수 있습니다.

      document.querySelector("#q8StopBtn").addEventListener("click", () => {
        clearInterval(q8TimerId);
        console.log("초시계를 멈췄습니다.");
        // 콘솔: 초시계를 멈췄습니다.
      });

      // ───── 문제 9 ─────
      // 답: React 가 달라진 곳만 고치기 때문입니다.
      //
      // 1초마다 화면 설명을 통째로 다시 넘겼지만,
      // 직전 설명과 비교했을 때 달라진 곳은 숫자 글자 하나뿐입니다.
      // 그래서 React 는 그 글자만 고치고 입력칸은 손대지 않습니다.
      // 손대지 않았으니 안에 친 글자도, 커서 자리도 그대로입니다.
      //
      // 말로만 하면 믿기 어려우니 콘솔로 확인해 봅니다.
      // 처음 그려진 입력칸을 담아 뒀다가 나중에 === 로 비교하면 됩니다.

      let q9FirstInput = null;

      setTimeout(() => {
        // render 는 부탁만 하고 돌아오므로 조금 기다렸다 찾습니다 (개념02 섹션 3)
        q9FirstInput = document.querySelector("#q8 input");
      }, 100);

      setTimeout(() => {
        const nowInput = document.querySelector("#q8 input");
        console.log("[React] 같은 입력칸인가?", nowInput === q9FirstInput);
        // 콘솔: [React] 같은 입력칸인가? true
      }, 1500);

      // ───── 문제 10 ─────
      function Menu() {
        // ← menu 를 Menu 로 (첫 글자 대문자)
        return <p>케이크 6000원</p>;
      }

      const q10Root = ReactDOM.createRoot(document.querySelector("#q10"));
      q10Root.render(<Menu />); // ← 쓰는 곳도 함께 Menu 로
      // 화면: 문제 10 상자에 "케이크 6000원" 이 보입니다.
      //
      // 왜 조용했을까요?
      // React 는 태그 이름의 첫 글자로 구별합니다.
      //   대문자로 시작 → 우리가 만든 화면
      //   소문자로 시작 → 브라우저의 HTML 태그
      // menu 는 실제로 있는 HTML 태그라서 React 는 시키는 대로 빈 태그를 그렸습니다.
      // 우리가 만든 함수는 한 번도 불리지 않았습니다.
      // 고치기 전 #q10 안에는 <menu></menu> 만 들어 있었습니다.
      //
      // 이름을 app 처럼 HTML 에 없는 것으로 지었다면 React 가 알려 줬을 것입니다.
      //   Warning: The tag <app> is unrecognized in this browser.
      //   If you meant to render a React component, start its name with an uppercase letter.
      // 하필 HTML 에 있는 이름과 겹쳐서 경고조차 없었던 것입니다.

      // ───── 문제 11 ─────
      let q11Count = 0;
      let q11Last = "없음";

      function Q11Cart() {
        return (
          <p>
            지금까지 {q11Count}번 담았습니다. 마지막: {q11Last}
          </p>
        );
      }

      const q11Root = ReactDOM.createRoot(document.querySelector("#q11"));
      q11Root.render(<Q11Cart />); // 첫 화면

      // 버튼이 두 개지만 하는 일이 같으므로 함수 하나로 묶었습니다.
      function addToCart(name) {
        q11Count = q11Count + 1;
        q11Last = name;
        q11Root.render(<Q11Cart />); // ★ 값 두 개를 다 고친 뒤에 한 번만 부릅니다
        console.log(`담았습니다: ${q11Last} / 지금까지 ${q11Count}번`);
      }

      document.querySelector("#q11AmeBtn").addEventListener("click", () => {
        addToCart("아메리카노");
        // 콘솔: 담았습니다: 아메리카노 / 지금까지 1번
      });

      document.querySelector("#q11LatteBtn").addEventListener("click", () => {
        addToCart("라떼");
        // 콘솔: 담았습니다: 라떼 / 지금까지 2번
      });
      // 화면(누르면): "지금까지 2번 담았습니다. 마지막: 라떼" 로 바뀝니다.
      //
      // 값을 두 개 고쳤지만 render 는 한 번만 불렀습니다.
      // 값을 고칠 때마다 부를 필요가 없습니다. 다 고친 뒤 한 번이면 됩니다.
      //
      // 버튼마다 콜백을 따로 쓰고 그 안에 같은 네 줄을 복사해 넣어도 동작은 합니다.
      // 다만 나중에 화면 모양을 바꿀 때 두 군데를 다 고쳐야 합니다.
      // 개념01에서 말한 "고칠 곳이 흩어진다" 가 이런 것입니다.

      // ───── 문제 12 ─────
      let q12Seconds = 0;
      let q12TimerId = null;

      function drawQ12() {
        const box = document.querySelector("#q12");
        // 안을 통째로 새 HTML 로 갈아 끼웁니다 (JS자료 10단원)
        box.innerHTML =
          "<p>초시계: " + q12Seconds + "초</p><p>입력칸: <input /></p>";
      }

      drawQ12(); // 첫 화면

      // innerHTML 은 부탁이 아니라 바로 반영되므로 곧장 찾아도 됩니다.
      const q12FirstInput = document.querySelector("#q12 input");

      q12TimerId = setInterval(() => {
        q12Seconds = q12Seconds + 1;
        drawQ12();
      }, 1000);
      // 화면: 숫자는 문제 8과 똑같이 올라갑니다.
      //       그런데 입력칸에 글자를 치면 1초 만에 사라집니다.

      setTimeout(() => {
        const nowInput = document.querySelector("#q12 input");
        console.log("[직접] 같은 입력칸인가?", nowInput === q12FirstInput);
        // 콘솔: [직접] 같은 입력칸인가? false
      }, 1500);

      // 문제 9는 true, 문제 12는 false 입니다. 화면은 똑같이 생겼는데 속이 다릅니다.
      //
      // innerHTML 에 새 문자열을 넣으면 안에 있던 요소가 전부 버려지고
      // 문자열대로 새 요소가 만들어집니다.
      // 글자를 치던 그 입력칸은 사라지고 빈 입력칸이 새로 생긴 것입니다.
      // 커서, 스크롤, 체크 상태도 같이 날아갑니다.
      //
      // 직접 짜도 피할 수는 있습니다. 바뀐 글자만 골라 textContent 로 고치면 됩니다.
      // 다만 "무엇이 바뀌었는지" 를 매번 우리가 따져야 합니다.
      // React 는 그 따지는 일을 대신해 주는 도구입니다.

      document.querySelector("#q12StopBtn").addEventListener("click", () => {
        clearInterval(q12TimerId);
        console.log("직접 그리는 초시계를 멈췄습니다.");
        // 콘솔: 직접 그리는 초시계를 멈췄습니다.
      });

      // ───── 문제 13 ─────
      //
      // (가) 자리는 맡았는데 그리지 않았다
      // const q13Root = ReactDOM.createRoot(document.querySelector("#q13"));
      //
      //   콘솔: 아무것도 안 나옵니다. 빨간 줄도 노란 줄도 없습니다.
      //   화면: 문제 13 상자가 빈 채로 남습니다.
      //
      //   createRoot 는 "이 자리를 맡겠다" 는 말일 뿐입니다. 그리라는 말이 아닙니다.
      //   render 를 불러야 그려집니다.
      //   이런 조용한 경우가 제일 찾기 어렵습니다. 개념04 섹션 6의 순서대로 확인하세요.
      //     저장하고 F5 를 눌렀는가 → 이름이 대문자인가 → render 를 불렀는가
      //
      // (나) 그릴 자리 이름을 틀렸다
      // ReactDOM.createRoot(document.querySelector("#q31")).render(<p>안녕</p>);
      //
      //   콘솔 맨 윗줄:
      //     Uncaught Error: createRoot(...): Target container is not a DOM element.
      //
      //   읽어야 할 곳은 이 맨 윗줄과, 오른쪽 끝의 파일 이름·줄 번호입니다.
      //   그 아래 회색 줄들은 React 안에서 부른 순서라 우리가 고칠 곳이 없습니다.
      //
      //   뜻은 "그릴 자리(Target container)가 화면 요소가 아니다" 입니다.
      //   querySelector 가 못 찾으면 에러 대신 null 을 돌려주기 때문에
