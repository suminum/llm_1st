      <strong>1~12는 기본, 13은 [응용], 14는 [도전], 15는 에러 확인</strong>입니다.
      <br /><br />
      화면이 통째로 비면 코드에 문법 오류가 있는 것입니다.
      <strong>F12 → Console</strong> 의 빨간 줄을 먼저 읽으세요.
      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 위쪽
      <code>&lt;style&gt;</code> 은 화면 모양을 만드는 코드입니다.

    <div id="root"></div>

    <script src="../_lib/react.development.js"></script>

    <script type="text/babel">
      // ============================================================
      // 06단원 연습문제 — 폼과 입력
      // ------------------------------------------------------------
      // 실행: 브라우저로 열고 직접 쳐 보세요. F12 → Console 도 함께.
      // ============================================================

      const { useState } = React;

      // ───── 문제 1 ───── (개념01)
      // 입력칸에 친 글자가 아래 줄에 바로 나오게 하세요.
      // input 에 value 와 onChange 를 붙이면 됩니다.
      //
      // 기대 결과 (화면): "김민준" 을 치면 → 입력한 값: 김민준
      //                  글자는 써지는데 아래 줄이 안 바뀌면 onChange 만 붙이고
      //                  setText 를 안 부른 것입니다.
      //                  한 글자도 안 써지면 value 만 붙인 것입니다.

      function Q1() {
        const [text, setText] = useState("");

        return (
          <div className="demo">
            <h3>문제 1 — 제어 컴포넌트</h3>

          </div>

      }

      // ───── 문제 2 ───── (개념01)
      // 아래 빈 상자에 지금 친 글자 수를 "3자" 형태로 보여 주세요.
      // input 은 이미 다 되어 있습니다. 상자 안만 채우면 됩니다.
      //
      // 기대 결과 (화면): 아무것도 안 치면 → 0자
      //                  "김민준" 을 치면 → 3자
      //                  숫자만 나오면 뒤에 "자" 를 안 붙인 것입니다.

      function Q2() {
        const [memo, setMemo] = useState("");

        return (

            <h3>문제 2 — 글자 수 세기</h3>
            <input value={memo} onChange={(e) => setMemo(e.target.value)} />
            <div className="output">
              {/* TODO: 여기에 글자 수를 보여 주세요 */}
            </div>
          </div>
        );
      }

      // ───── 문제 3 ───── (개념01)
      // '지우기' 버튼을 누르면 입력칸이 비워지게 하세요.
      // 입력칸을 직접 건드리지 말고 state 만 바꾸세요.
      //
      // 기대 결과 (화면): 누르면 입력칸이 텅 비고 → 지금 값:  (뒤가 빕니다)
      //                  눌러도 아무 일이 없으면 onClick 을 안 붙인 것입니다.

      function Q3() {
        const [text, setText] = useState("아메리카노");

        return (

      // ───── 문제 4 ───── (개념02)
      // 메모 칸에 친 글자가 form.memo 에 들어가게 handleMemo 를 채우세요.
      // 이름은 그대로 남아 있어야 합니다.
      //
      // 기대 결과 (화면): 메모에 "라떼" 를 치면 → 김민준 / 라떼
      //                  이름이 사라지면 ...form 을 빠뜨린 것입니다.
      //                  (그때는 콘솔에 controlled / uncontrolled 경고도 함께 납니다)

            <div>
              이름 <input value={form.name} readOnly />
            </div>
            <div>
              메모 <input value={form.memo} onChange={handleMemo} />
            </div>
            <div className="output">
              {form.name} / {form.memo}
            </div>
          </div>
        );
      }

      // ───── 문제 5 ───── (개념02)
      // 아이디 칸과 비밀번호 칸을 handleChange 하나로 처리하세요.
      // 두 input 에는 이미 name 이 붙어 있습니다. 대괄호 키를 쓰세요.
      //
      // 기대 결과 (화면): 아이디에 "minjun", 비밀번호에 "1234" 를 치면
      //                  → minjun / 1234
      //                  어느 칸을 쳐도 한쪽만 바뀌면 대괄호를 안 씌운 것입니다.

      function Q5() {

            </div>
            <div className="output">
              {form.id} / {form.pw}
            </div>
          </div>
        );
      }

      // ───── 문제 6 ───── (개념02)
      // 아래 total 을 "가격 × 개수" 로 고치세요.
      // 두 칸의 값은 숫자처럼 보여도 문자열이라는 점에 주의하세요.
      //
      // 기대 결과 (화면): 합계: 8000원
      //                  개수를 3 으로 바꾸면 → 합계: 12000원
      //                  40002 같은 값이 나오면 곱하기가 아니라 더하기를 쓴 것입니다.

      function Q6() {

            <div>

            </div>
            <div className="output">합계: {total}원</div>
          </div>
        );
      }

      // ───── 문제 7 ───── (개념03)
      // 체크박스를 켜면 "동의: 함", 풀면 "동의: 안 함" 이 나오게 하세요.
      // 체크박스는 value 가 아니라는 점을 떠올리세요.
      //
      // 기대 결과 (화면): 체크하면 → 동의: 함
      //                  풀면     → 동의: 안 함
      //                  풀었는데도 계속 "함" 이면 e.target.value 를 읽은 것입니다.

      function Q7() {
        const [agree, setAgree] = useState(false);

          </div>
        );
      }

      // ───── 문제 8 ───── (개념03)
      // select 에서 고른 값이 아래 줄에 나오게 하세요.
      //
      // 기대 결과 (화면): 처음에는 '보통' 이 골라져 있고 → 고른 사이즈: M
      //                  '큰 것' 을 고르면 → 고른 사이즈: L
      //                  처음에 '작은 것' 이 골라져 있으면 value 를 안 붙인 것입니다.

      // ───── 문제 9 ───── (개념03)
      // 라디오 두 개 중 고른 것이 아래 줄에 나오게 하세요.
      // 두 input 에는 이미 value 가 붙어 있습니다.
      //
      // 기대 결과 (화면): 처음에는 '카드' 가 켜져 있고 → 결제 방법: 카드
      //                  '현금' 을 누르면 → 결제 방법: 현금

            <label>

            </label>
            <div className="output">결제 방법: {pay}</div>
          </div>

      }

      // ───── 문제 10 ───── (개념03)
      // 켜면 배열에 더하고, 끄면 배열에서 빼도록 handleChange 를 채우세요.
      //
      // 기대 결과 (화면): '시럽' 을 켜면 → 고른 것: 시럽 / 모두 1개
      //                  '휘핑크림' 도 켜면 → 고른 것: 시럽, 휘핑크림 / 모두 2개
      //                  '시럽' 을 끄면 → 고른 것: 휘핑크림 / 모두 1개
      //                  껐는데도 남아 있으면 켜짐/꺼짐을 if 로 안 갈라 준 것입니다.

          </div>

      }

      // ───── 문제 11 ───── (개념04)
      // 제출하면 아래 줄이 "OOO님 환영합니다" 로 바뀌게 하세요.
      // e.preventDefault() 는 미리 써 두었습니다.
      //
      // 기대 결과 (화면): "김민준" 인 채로 '확인' 을 누르면 → 김민준님 환영합니다
      //                  입력칸에서 Enter 만 쳐도 같아야 합니다.
      //                  화면이 깜빡이고 글자가 처음으로 돌아가면

      // ───── 문제 12 ───── (개념05)
      // 제출하면 입력칸의 글이 목록 뒤에 붙게 하세요.
      // push 는 쓰지 마세요. 새 배열을 만들어 넣습니다.
      //
      // 기대 결과 (화면): 입력칸에 이미 들어 있는 "우유 사기" 로 '추가' 를 누르면
      //                  목록이 장보기 / 우유 사기  두 줄이 됩니다.
      //                  목록이 한 줄로 덮여 버리면 스프레드를 안 쓴 것입니다.

              <input value={text} onChange={(e) => setText(e.target.value)} />

      }

      // ───── 문제 13 ───── [응용] (개념04)
      // 후기 폼을 완성하세요. 할 일이 세 가지입니다.
      //   (1) 공백만 친 경우를 포함해 비어 있으면 error 에 "후기를 입력해 주세요"
      //   (2) 10자를 넘으면 error 에 "10자 이내로 써 주세요"
      //   (3) 둘 다 통과하면 saved 에 넣고, error 를 지우고, 입력칸을 비우기

      //
      // 기대 결과 (화면): 빈 칸에서 '저장' → 후기를 입력해 주세요

      //                  "아메리카노가 정말 맛있어요" 치고 '저장' → 10자 이내로 써 주세요
      //                  '지우기' 를 눌렀는데 에러 문구가 뜨면 아직 type 을 안 고친 것입니다.

      function Q13() {

            <div className="output">저장된 후기: {saved}</div>
          </div>
        );
      }

      // ───── 문제 14 ───── [도전] (개념05)
      // 주문 목록을 완성하세요. 할 일이 다섯 가지입니다.
      //   (1) 앞뒤 공백을 없앤 값으로 검사한다
      //   (2) 비어 있으면 error 에 "메뉴를 입력해 주세요" 를 넣고 멈춘다
