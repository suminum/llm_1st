<!doctype html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 13. background-attachment — 스크롤 동작 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>
      CSS_05 Position &amp; Background — 섹션 13. background-attachment — 스크롤
      동작
    </title>
    <style>
      /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
      /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
      body {
        font-family: "Malgun Gothic", sans-serif;
        margin: 20px;
      }
      section {
        border: 1px solid #ced4da;
        padding: 16px;
        margin-bottom: 28px;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 12px;
      }
      .box {
        /* 데모용 파란 박스 */
        width: 80px;
        height: 80px;
        background: #4dabf7;
        border: 2px solid #1971c2;
        color: #fff;
        text-align: center;
        line-height: 76px;
      }
      .frame {
        /* 데모용 회색 틀 */
        height: 180px;
        background: #f1f3f5;
        border: 2px dashed #868e96;
        padding: 8px;
      }

      /* ── 섹션 13: background-attachment — 스크롤 동작 ── */
      /* [기본] scroll(기본): 요소와 함께 이동 / local: 요소 "내부 스크롤"과 함께 이동 */
      .s13-frame {
        height: 140px;
        overflow: auto; /* 내부 스크롤 만들기 */
        border: 1px solid #adb5bd;
        margin-bottom: 6px;
        background-color: #e7f5ff;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><circle cx='30' cy='30' r='20' fill='%23f08c00'/><circle cx='30' cy='30' r='8' fill='%23fff3bf'/></svg>");
        background-repeat: no-repeat;
        background-position: center 10px;
      }
      .s13-local {
        background-attachment: local;
      } /* 내용과 함께 배경도 스크롤됨 */
      /* [다른 방법] fixed: 뷰포트에 고정 -> 페이지를 스크롤해도 배경은 제자리 */
      /* 표시: 위 틀은 내용만 움직이고 배경은 고정, 아래 틀은 배경도 같이 올라감 */
    </style>
  </head>
  <body>
    <!-- ── 섹션 13: background-attachment ── -->
    <section>
      <h2>섹션 13. background-attachment</h2>
      <p>scroll (기본) — 내부 스크롤 시 배경은 고정</p>
      <div class="s13-frame">
        <p>내용 1</p>
        <p>내용 2</p>
        <p>내용 3</p>
        <p>내용 4</p>
        <p>내용 5</p>
      </div>
      <p>local — 내부 스크롤과 함께 배경도 이동</p>
      <div class="s13-frame s13-local">
        <p>내용 1</p>
        <p>내용 2</p>
        <p>내용 3</p>
        <p>내용 4</p>
        <p>내용 5</p>
      </div>
    </section>
  </body>
</html>
