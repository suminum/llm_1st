<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 7. z-index — 쌓임 순서 지정 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 7. z-index — 쌓임 순서 지정</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* 원본 섹션 6의 부모 틀(.s6-parent) 재사용 (수업 내용 아님 — 섹션06 파일 참고) */
    .s6-parent { position: relative; height: 160px;
                 background: #f1f3f5; border: 2px dashed #868e96; }

    /* ── 섹션 7: z-index — 쌓임 순서 지정 ─────────────── */
    /* [기본] 숫자가 클수록 위. 음수도 가능 */
    .s7-a { position: absolute; top: 10px; left: 10px;
            z-index: 3;                        /* 맨 위로 */
            background: #ff8787; border-color: #e03131; }
    .s7-b { position: absolute; top: 40px; left: 50px;
            z-index: 2;
            background: #ffd43b; border-color: #f08c00; color: #333; }
    .s7-c { position: absolute; top: 70px; left: 90px;
            z-index: 1;                        /* 맨 아래로 */
            background: #69db7c; border-color: #2f9e44; }
    /* 실수: position: static인 요소에 z-index -> 동작하지 않음 (static이 아닐 때만) */
    /* 표시: 섹션 6과 반대로 A가 맨 위, C가 맨 아래 */
  </style>
</head>
<body>
  <!-- ── 섹션 7: z-index — 쌓임 순서 지정 ── -->
  <section>
    <h2>섹션 7. z-index — 쌓임 순서 뒤집기</h2>
    <div class="s6-parent">
      <div class="box s7-a">A</div>
      <div class="box s7-b">B</div>
      <div class="box s7-c">C</div>
    </div>
  </section>
</body>
</html>
