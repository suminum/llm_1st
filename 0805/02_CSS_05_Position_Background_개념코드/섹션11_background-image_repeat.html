<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 11. background-image와 repeat (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 11. background-image와 repeat</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 11: background-image와 repeat ───────────── */
    /* [기본] url()로 이미지 지정. background-color 위에 얹어짐 */
    /* (여기서는 외부 이미지 대신 data URI로 만든 60x60 기어 아이콘을 사용) */
    .s11-base {
      height: 150px; border: 1px solid #adb5bd; margin-bottom: 6px;
      background-color: #e7f5ff;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><circle cx='30' cy='30' r='20' fill='%23f08c00'/><circle cx='30' cy='30' r='8' fill='%23fff3bf'/></svg>");
    }
    /* repeat(기본): 수평·수직 모두 반복 -> 바둑판처럼 채워짐 */
    .s11-x  { background-repeat: repeat-x; }   /* [다른 방법] 수평만 반복 */
    .s11-no { background-repeat: no-repeat; }  /* 반복 없음 - 1개만 */
    /* 실수: url(images/gear.svg)  // 경로가 틀리면 조용히 아무것도 안 나옴. 경로 먼저 확인! */
  </style>
</head>
<body>
  <!-- ── 섹션 11: background-image와 repeat ── -->
  <section>
    <h2>섹션 11. background-image / background-repeat</h2>
    <p>repeat (기본)</p>
    <div class="s11-base"></div>
    <p>repeat-x</p>
    <div class="s11-base s11-x"></div>
    <p>no-repeat</p>
    <div class="s11-base s11-no"></div>
  </section>
</body>
</html>
