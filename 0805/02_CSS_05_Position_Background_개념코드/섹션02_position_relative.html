<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 2. position: relative — 원래 자리 기준 이동 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 2. position: relative — 원래 자리 기준 이동</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 2: position: relative — 원래 자리 기준 이동 ── */
    /* [기본] 자기 자신의 "원래 위치"를 기준으로 top/left만큼 이동 */
    .s2-moved {
      position: relative;
      top: 20px; left: 40px;      /* 원래 자리에서 아래 20px, 오른쪽 40px */
      background: #ff8787; border-color: #e03131;
    }
    /* 표시: 2번 박스만 이동. 원래 자리는 비워둔 채로 유지됨(다른 박스가 안 밀림) */
  </style>
</head>
<body>
  <!-- ── 섹션 2: position: relative — 원래 자리 기준 이동 ── -->
  <section>
    <h2>섹션 2. position: relative</h2>
    <div class="box">1</div>
    <div class="box s2-moved">2</div>
    <div class="box">3</div>
  </section>
</body>
</html>
