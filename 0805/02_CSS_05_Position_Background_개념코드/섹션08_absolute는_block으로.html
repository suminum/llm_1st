<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 8. absolute/fixed는 display가 block으로 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 8. absolute/fixed는 display가 block으로</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 8: absolute/fixed는 display가 block으로 ── */
    /* [기본] span(inline)이라도 absolute를 주면 자동으로 block처럼 동작 */
    .s8-parent { position: relative; height: 120px;
                 background: #f1f3f5; border: 2px dashed #868e96; }
    .s8-span {
      position: absolute;         /* display: block; 을 쓴 것과 동일한 효과 */
      top: 20px; left: 20px;
      width: 120px; height: 60px; /* inline이면 무시됐을 width/height가 적용됨! */
      background: #b197fc; border: 2px solid #7048e8;
      color: #fff; text-align: center; line-height: 56px;
    }
  </style>
</head>
<body>
  <!-- ── 섹션 8: absolute/fixed는 display가 block으로 ── -->
  <section>
    <h2>섹션 8. absolute를 주면 display가 block으로</h2>
    <div class="s8-parent">
      <span class="s8-span">span인데 크기 적용!</span>
    </div>
  </section>
</body>
</html>
