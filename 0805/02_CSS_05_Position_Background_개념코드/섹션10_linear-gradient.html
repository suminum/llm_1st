<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 10. linear-gradient() — 그라데이션 배경 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 10. linear-gradient() — 그라데이션 배경</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 10: linear-gradient() — 그라데이션 배경 ── */
    /* [기본] 색1, 색2: 위 -> 아래로 색이 변함 */
    .s10-basic { background: linear-gradient(#4dabf7, #d0ebff); }
    /* [다른 방법] 방향(deg)과 비중(%), 3색 이상도 가능 */
    .s10-deg   { background: linear-gradient(90deg, #1971c2, #4dabf7 30%, #d0ebff); }
    /* 실수: background: linear-gradient(#4dabf7);  // 색이 1개면 그라데이션이 안 됨 */
    .s10-box { height: 60px; border: 1px solid #adb5bd; margin-bottom: 6px;
               color: #333; padding: 6px; }
  </style>
</head>
<body>
  <!-- ── 섹션 10: linear-gradient() ── -->
  <section>
    <h2>섹션 10. linear-gradient()</h2>
    <div class="s10-box s10-basic">기본: 위 → 아래</div>
    <div class="s10-box s10-deg">90deg + 비중 30%</div>
  </section>
</body>
</html>
