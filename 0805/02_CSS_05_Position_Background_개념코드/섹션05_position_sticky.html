<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 5. position: sticky — relative + fixed 하이브리드 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 5. position: sticky — relative + fixed 하이브리드</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 5: position: sticky — relative + fixed 하이브리드 ── */
    /* [기본] 임계점(top: 0) 전에는 제자리, 도달하면 고정, 부모를 벗어나면 사라짐 */
    .s5-scroll {
      height: 160px; overflow: auto;   /* 스크롤 가능한 조상 = sticky의 기준 */
      border: 2px dashed #868e96;
    }
    .s5-sticky {
      position: sticky;
      top: 0;                     /* 이 위치에 닿으면 고정 시작 */
      background: #69db7c; border-bottom: 2px solid #2f9e44; padding: 6px;
    }
    /* 실수: top/bottom 값을 안 주면 sticky는 동작하지 않음(임계점이 없어서) */
    /* 활용: 섹션 헤더, 사이드바, 테이블 고정 행 */
  </style>
</head>
<body>
  <!-- ── 섹션 5: position: sticky ── -->
  <section>
    <h2>섹션 5. position: sticky</h2>
    <div class="s5-scroll">
      <p>스크롤 전 내용입니다. 아래로 스크롤해 보세요.</p>
      <div class="s5-sticky">붙는 제목 (sticky)</div>
      <p>내용 1</p><p>내용 2</p><p>내용 3</p><p>내용 4</p><p>내용 5</p>
    </div>
  </section>
</body>
</html>
