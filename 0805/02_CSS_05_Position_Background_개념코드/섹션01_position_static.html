<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 1. position: static — 기본 흐름 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 1. position: static — 기본 흐름</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 1: position: static — 기본 흐름 ─────────── */
    /* [기본] static(기본값): 위에서 아래로, HTML 순서대로 배치됨 */
    .s1-box { position: static; }
    /* 실수: .s1-box { position: static; top: 30px; }  // static은 top/left가 무시됨 */
    /* 표시: top을 줘도 박스가 전혀 움직이지 않음 */
  </style>
</head>
<body>
  <!-- ── 섹션 1: position: static — 기본 흐름 ── -->
  <section>
    <h2>섹션 1. position: static — 기본 흐름</h2>
    <div class="box s1-box">1</div>
    <div class="box s1-box">2</div>
  </section>
</body>
</html>
