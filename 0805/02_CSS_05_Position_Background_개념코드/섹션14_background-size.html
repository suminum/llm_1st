<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 개념코드 — 섹션 14. background-size — 배경 크기 (HTML/CSS)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 섹션 14. background-size — 배경 크기</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통: 데모가 잘 보이도록 하는 기본 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 28px; }
    h2 { font-size: 17px; margin: 0 0 12px; }
    .box {                        /* 데모용 파란 박스 */
      width: 80px; height: 80px;
      background: #4dabf7; border: 2px solid #1971c2;
      color: #fff; text-align: center; line-height: 76px;
    }
    .frame {                      /* 데모용 회색 틀 */
      height: 180px;
      background: #f1f3f5; border: 2px dashed #868e96; padding: 8px;
    }

    /* ── 섹션 14: background-size — 배경 크기 ─────────── */
    /* [기본] cover: 비율 유지, 요소를 빈틈없이 덮음(넘치는 부분은 잘림) */
    .s14-base {
      height: 120px; border: 1px solid #adb5bd; margin-bottom: 6px;
      background-color: #e7f5ff;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><circle cx='30' cy='30' r='20' fill='%23f08c00'/><circle cx='30' cy='30' r='8' fill='%23fff3bf'/></svg>");
      background-repeat: no-repeat;
      background-position: center;
    }
    .s14-cover   { background-size: cover; }
    /* [다른 방법] contain: 비율 유지, 요소 안에 전부 보이게 / 단위 값 직접 지정 */
    .s14-contain { background-size: contain; }
    .s14-px      { background-size: 200px 40px; }  /* 강제 지정 -> 비율이 깨짐 */
    /* 실수: 가로세로를 강제로 지정하면 이미지가 찌그러짐. 보통 cover/contain 사용 */
  </style>
</head>
<body>
  <!-- ── 섹션 14: background-size ── -->
  <section>
    <h2>섹션 14. background-size</h2>
    <p>cover — 빈틈없이 덮음</p>
    <div class="s14-base s14-cover"></div>
    <p>contain — 전부 보이게</p>
    <div class="s14-base s14-contain"></div>
    <p>200px 40px — 비율 깨짐</p>
    <div class="s14-base s14-px"></div>
  </section>
</body>
</html>
