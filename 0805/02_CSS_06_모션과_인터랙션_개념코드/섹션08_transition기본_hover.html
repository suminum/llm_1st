<!DOCTYPE html>
<!--
  02_CSS_06_모션과 인터랙션 개념코드 — 섹션 8. transition 기본 (hover)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_06 모션과 인터랙션 — 섹션 8. transition 기본 (hover)</title>
  <style>
    /* 공통: 데모가 잘 보이도록 하는 최소 스타일 (수업 내용 아님) */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .box { width: 100px; height: 100px; background: #2563eb; color: #fff;
           display: flex; align-items: center; justify-content: center; }

    /* ── 섹션 8: transition 단축 속성 + hover ────────────── */
    /* [기본] transition: 속성명 지속시간 타이밍함수 대기시간; */
    .tr-basic { transition: background-color 0.3s ease 0s; }
    .tr-basic:hover { background-color: #dc2626; }
    /* [축약] transition: background-color 0.3s;  (타이밍함수·대기시간 생략 가능) */
    /* 실수: transition을 :hover 쪽에 쓰면 마우스를 뗄 때 뚝 끊김 -> 평소 상태에 쓴다 */
    /* 표시: 마우스를 올리면 파랑 -> 빨강으로 부드럽게 변함 */
  </style>
</head>
<body>
  <h1>CSS 모션과 인터랙션 — 개념코드</h1>
  <p class="hint">각 상자에 마우스를 올려 보세요. 애니메이션 섹션은 새로고침하면 처음부터 재생됩니다.</p>

  <!-- ── 섹션 8: transition 단축 속성 + hover ── -->
  <section>
    <h2>섹션 8. transition 기본 (hover)</h2>
    <div class="box tr-basic">hover</div>
    <p class="hint">마우스를 올리면 배경색이 0.3초 동안 부드럽게 바뀝니다.</p>
  </section>
</body>
</html>
