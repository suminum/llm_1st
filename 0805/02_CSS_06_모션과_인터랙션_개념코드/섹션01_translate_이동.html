<!doctype html>
<!--
  02_CSS_06_모션과 인터랙션 개념코드 — 섹션 1. translate — 이동
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS_06 모션과 인터랙션 — 섹션 1. translate — 이동</title>
    <style>
      /* 공통: 데모가 잘 보이도록 하는 최소 스타일 (수업 내용 아님) */
      body {
        font-family: sans-serif;
        margin: 24px;
      }
      section {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 24px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .hint {
        color: #888;
        font-size: 13px;
      }
      .box {
        width: 100px;
        height: 100px;
        background: #2563eb;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── 섹션 1: transform: translate — 이동 ────────────── */
      /* [기본] translate(x, y) — 우측·아래로 이동 */
      .t-move:hover {
        transform: translate(40px, 20px);
      }
      /* [다른 방법] 한 축만: translateX(40px), translateY(20px) */
      /* 실수: transform: translate(40, 20);  단위(px) 누락 -> 동작 안 함 */
      /* 표시: 마우스를 올리면 상자가 오른쪽 아래로 이동 */
    </style>
  </head>
  <body>
    <h1>CSS 모션과 인터랙션 — 개념코드</h1>
    <p class="hint">
      각 상자에 마우스를 올려 보세요. 애니메이션 섹션은 새로고침하면 처음부터
      재생됩니다.
    </p>

    <!-- ── 섹션 1: transform: translate — 이동 ── -->
    <section>
      <h2>섹션 1. translate — 이동</h2>
      <div class="box t-move">이동</div>
      <p class="hint">마우스를 올리면 오른쪽 아래로 이동합니다.</p>
    </section>
  </body>
</html>
