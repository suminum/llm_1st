<!DOCTYPE html>
<!--
  02_CSS_06_모션과 인터랙션 개념코드 — 섹션 4. 여러 변환 함수 조합
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_06 모션과 인터랙션 — 섹션 4. 여러 변환 함수 조합</title>
  <style>
    /* 공통: 데모가 잘 보이도록 하는 최소 스타일 (수업 내용 아님) */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .box { width: 100px; height: 100px; background: #2563eb; color: #fff;
           display: flex; align-items: center; justify-content: center; }

    /* ── 섹션 4: transform 여러 함수 조합 ────────────────── */
    /* [기본] 변환 함수를 공백으로 나열 — 순서대로 적용됨 */
    .t-combo:hover { transform: translate(20px, 0) rotate(15deg) scale(1.2); }
    /* 실수: transform을 두 줄로 나눠 쓰면 마지막 줄만 적용됨
       .t-combo:hover { transform: translate(20px, 0); transform: rotate(15deg); } */
    /* 표시: 이동 + 회전 + 확대가 한 번에 적용 */
  </style>
</head>
<body>
  <h1>CSS 모션과 인터랙션 — 개념코드</h1>
  <p class="hint">각 상자에 마우스를 올려 보세요. 애니메이션 섹션은 새로고침하면 처음부터 재생됩니다.</p>

  <!-- ── 섹션 4: transform 여러 함수 조합 ── -->
  <section>
    <h2>섹션 4. 여러 변환 함수 조합</h2>
    <div class="box t-combo">조합</div>
    <p class="hint">마우스를 올리면 이동+회전+확대가 동시에 적용됩니다.</p>
  </section>
</body>
</html>
