<!DOCTYPE html>
<!--
  02_CSS_06_모션과 인터랙션 개념코드 — 섹션 14. animation 개별 속성 / 단축 속성
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_06 모션과 인터랙션 — 섹션 14. animation 개별 속성 / 단축 속성</title>
  <style>
    /* 공통: 데모가 잘 보이도록 하는 최소 스타일 (수업 내용 아님) */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .box { width: 100px; height: 100px; background: #2563eb; color: #fff;
           display: flex; align-items: center; justify-content: center; }

    /* ── 섹션 14: animation 개별 속성과 단축 속성 ────────── */
    /* [기본] 개별 속성으로 세부 동작 제어 */
    @keyframes slide {
      from { transform: translateX(0); }
      to   { transform: translateX(200px); }
    }
    .ani-full {
      animation-name: slide;
      animation-duration: 2s;
      animation-timing-function: ease-in;
      animation-delay: 1s;                  /* 1초 뒤 시작 */
      animation-iteration-count: infinite;  /* 반복 횟수 (숫자 또는 infinite) */
      animation-direction: alternate;       /* 갔다가 되돌아옴 */
    }
    /* [축약] 단축 속성 순서: name duration timing-function delay iteration-count direction */
    /* .ani-full { animation: slide 2s ease-in 1s infinite alternate; } */
    /* [다른 방법] animation-fill-mode: forwards;  -> 재생이 끝난 뒤 마지막(to) 모습을 유지 (기본은 원래 모습으로 복귀) */
    /* 실수: animation: 2s slide;  이름이 시간보다 뒤에 와도 되지만,
       시간이 2개면 첫 번째가 duration, 두 번째가 delay로 고정 — 순서 주의 */
    /* 표시: 1초 뒤부터 상자가 좌우로 왕복 */
  </style>
</head>
<body>
  <h1>CSS 모션과 인터랙션 — 개념코드</h1>
  <p class="hint">각 상자에 마우스를 올려 보세요. 애니메이션 섹션은 새로고침하면 처음부터 재생됩니다.</p>

  <!-- ── 섹션 14: animation 개별 속성과 단축 속성 ── -->
  <section>
    <h2>섹션 14. animation 개별 속성 / 단축 속성</h2>
    <div class="box ani-full">왕복</div>
    <p class="hint">1초 뒤부터 좌우로 무한 왕복합니다. (alternate)</p>
  </section>
</body>
</html>
