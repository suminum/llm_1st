<!DOCTYPE html>
<!--
  02_CSS_06_모션과 인터랙션 실습 정답코드 — 실습 (몸풀기) — animation 사각형 그리기
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_06 모션과 인터랙션 — 실습 (몸풀기) — animation 사각형 그리기</title>
  <style>
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; background: #f5f6f8; }
    section { background: #fff; border: 1px solid #ddd; border-radius: 8px;
              padding: 20px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }

    /* ── 실습 (몸풀기): animation 사각형 그리기 ──────────── */
    /* 목표: 원이 왼쪽 상단에서 시작해 시계 방향으로 사각형 경로를 그린다 */

    /* Step 1: 무대 — 원이 이동할 기준이 되도록 relative */
    .path-stage {
      position: relative;
      width: 200px; height: 200px;
      border: 2px dashed #adb5bd;
    }
    /* Step 2: 애니메이션 대상은 원 — absolute + border-radius: 50% */
    .path-circle {
      position: absolute; top: 0; left: 0;
      width: 40px; height: 40px; border-radius: 50%;
      background: #2563eb;
      /* Step 4: 3초 동안 지속, 6번 반복 */
      animation: squarePath 3s linear 6;
    }
    /* Step 3: 키프레임 — 좌상단 -> 우상단 -> 우하단 -> 좌하단 -> 좌상단 (시계 방향) */
    @keyframes squarePath {
      0%   { top: 0;     left: 0; }
      25%  { top: 0;     left: 160px; }   /* 160 = 무대 200 - 원 40 */
      50%  { top: 160px; left: 160px; }
      75%  { top: 160px; left: 0; }
      100% { top: 0;     left: 0; }
    }

    /* 접근성: 움직임 줄이기 설정 시 애니메이션 정지 (실습 1·5 체크포인트) */
    @media (prefers-reduced-motion: reduce) {
      .path-circle {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <h1>CSS 모션과 인터랙션 — 실습 정답코드</h1>

  <!-- ── 실습 (몸풀기): animation 사각형 그리기 ── -->
  <section>
    <h2>실습 (몸풀기) — animation 사각형 그리기</h2>
    <div class="path-stage">
      <div class="path-circle"></div>
    </div>
    <p class="hint">원이 왼쪽 상단에서 시계 방향으로 사각형을 그립니다. 3초 x 6회 반복 후 정지. (새로고침하면 다시 재생)</p>
  </section>
</body>
</html>
