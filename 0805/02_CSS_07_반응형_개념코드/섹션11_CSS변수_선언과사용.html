<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 11. CSS 변수 — 선언과 사용
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 섹션 11. CSS 변수 — 선언과 사용</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }

    /* ── 섹션 11: CSS 변수 — 선언과 사용 ────────────────── */
    /* [기본] --변수명: 값 으로 선언, var(--변수명) 으로 사용 */
    :root {
      --primary: #2563eb;   /* :root에 선언하면 전역 */
      --radius: 8px;
    }
    .btn {
      background: var(--primary);
      border-radius: var(--radius);
      color: #fff; border: none; padding: 10px 20px; cursor: pointer;
    }
    /* 실수: background: --primary;  var() 없이 쓰면 적용 안 됨 */
    /* 표시: 파란 둥근 버튼 — :root의 --primary만 바꾸면 전체가 한 번에 바뀜 */
  </style>
</head>
<body>
  <!-- ── 섹션 11: CSS 변수 선언과 사용 ── -->
  <section>
    <h2>섹션 11. CSS 변수 — 선언과 사용</h2>
    <button class="btn">var(--primary) 버튼</button>
  </section>
</body>
</html>
