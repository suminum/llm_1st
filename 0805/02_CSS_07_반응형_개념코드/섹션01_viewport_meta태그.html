<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 1. viewport meta 태그
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- ── 섹션 1: viewport meta 태그 ── -->
  <!-- [기본] 모든 HTML의 <head>에 반드시 포함 — 뷰포트 너비를 기기 너비에 맞춤 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 실수: 이 태그가 없으면 모바일에서 페이지가 축소된 PC 화면처럼 보임 -->
  <title>CSS_07 반응형 — 섹션 1. viewport meta 태그</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }
  </style>
</head>
<body>
  <p class="hint">개발자도구(F12) → Ctrl+Shift+M 으로 화면 너비를 바꿔가며 확인하세요.</p>

  <!-- ── 섹션 1: viewport meta 태그 ── -->
  <section>
    <h2>섹션 1. viewport meta 태그</h2>
    <p class="hint">이 문서의 &lt;head&gt;를 확인 — width=device-width, initial-scale=1.0</p>
  </section>
</body>
</html>
