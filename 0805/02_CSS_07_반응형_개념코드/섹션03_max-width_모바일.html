<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 3. max-width — 모바일 화면용
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 섹션 3. max-width — 모바일 화면용</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }

    /* ── 섹션 3: max-width — 모바일 화면용 ──────────────── */
    /* [기본] max-width: 그 값 "이하"일 때 적용 */
    .mq-max { background: #eee; padding: 12px; }
    @media screen and (max-width: 480px) {
      .mq-max { background: orange; }         /* 480px 이하 = 모바일 */
    }
    /* [다른 방법] 미디어 유형: all(전부) / screen(화면) / print(인쇄) */
    /* 표시: 창을 480px 이하로 좁히면 주황색으로 변함 */
  </style>
</head>
<body>
  <!-- ── 섹션 3: max-width ── -->
  <section>
    <h2>섹션 3. max-width — 모바일 화면용</h2>
    <div class="mq-max">창을 480px 이하로 좁히면 주황색</div>
  </section>
</body>
</html>
