<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 5. 모바일 퍼스트 전략 (min-width)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 섹션 5. 모바일 퍼스트 전략 (min-width)</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }

    /* ── 섹션 5: 모바일 퍼스트 전략 (min-width) ─────────── */
    /* [기본] 기본 CSS를 모바일(1열)로 작성 -> min-width로 큰 화면을 "추가" */
    .grid {
      display: grid;
      grid-template-columns: 1fr;             /* 기본: 모바일 1열 */
      gap: 8px;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(2, 1fr); }  /* 태블릿 이상: 2열 */
    }
    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); }  /* 데스크톱: 4열 */
    }
    /* [다른 방법] 데스크톱 퍼스트: 기본을 PC로 두고 max-width로 좁힘 (기존 PC 사이트 전환용) */
    /* 표시: 창 너비에 따라 카드가 1열 -> 2열 -> 4열로 재배치 */
  </style>
</head>
<body>
  <!-- ── 섹션 5: 모바일 퍼스트 그리드 ── -->
  <section>
    <h2>섹션 5. 모바일 퍼스트 (min-width 그리드)</h2>
    <div class="grid">
      <div class="cell">1</div>
      <div class="cell">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
    </div>
    <p class="hint">1열(모바일) → 2열(768px~) → 4열(1024px~)</p>
  </section>
</body>
</html>
