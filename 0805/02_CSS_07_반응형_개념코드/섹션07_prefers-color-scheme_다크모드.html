<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 7. prefers-color-scheme — 다크 모드 감지
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 섹션 7. prefers-color-scheme — 다크 모드 감지</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }

    /* ── 섹션 7: prefers-color-scheme — 다크 모드 감지 ──── */
    /* [기본] 사용자의 OS 다크 모드 설정을 감지해 자동 전환 */
    .scheme { background: #fff; color: #1a1a2e; padding: 12px; border: 1px solid #ddd; }
    @media (prefers-color-scheme: dark) {
      .scheme { background: #1a1a2e; color: #e8e8e8; }
    }
    /* 표시: OS를 다크 모드로 바꾸면 이 상자만 어두운 배경으로 전환됨 */
  </style>
</head>
<body>
  <!-- ── 섹션 7: prefers-color-scheme ── -->
  <section>
    <h2>섹션 7. prefers-color-scheme — 다크 모드 감지</h2>
    <div class="scheme">OS 다크 모드 설정에 따라 이 상자의 색이 바뀝니다.</div>
  </section>
</body>
</html>
