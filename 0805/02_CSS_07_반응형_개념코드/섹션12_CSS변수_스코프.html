<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 12. CSS 변수 스코프 — 전역·지역
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 섹션 12. CSS 변수 스코프 — 전역·지역</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }

    /* ── 섹션 12: CSS 변수 스코프 — 전역·지역 ───────────── */
    /* [기본] 특정 선택자에 선언하면 그 요소와 자손에서만 유효 */
    .card { --card-pad: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .card .title { padding: var(--card-pad); margin: 0; }  /* .card 자손 -> 사용 가능 */
    /* 실수: .outside { padding: var(--card-pad); }  .card 밖에서는 값이 없어 무시됨 */
    /* [다른 방법] 대비값(fallback): padding: var(--card-pad, 10px); -> 없으면 10px */
    /* 표시: 카드 제목에만 20px 여백이 적용됨 */
  </style>
</head>
<body>
  <!-- ── 섹션 12: CSS 변수 스코프 ── -->
  <section>
    <h2>섹션 12. CSS 변수 스코프 — 전역·지역</h2>
    <div class="card">
      <p class="title">카드 제목 (지역 변수 --card-pad 적용)</p>
    </div>
  </section>
</body>
</html>
