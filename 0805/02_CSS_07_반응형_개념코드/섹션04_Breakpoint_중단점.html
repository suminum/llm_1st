<!DOCTYPE html>
<!--
  02_CSS_07_반응형 개념코드 — 섹션 4. Breakpoint (중단점)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M (Device Toolbar)로 화면 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 섹션 4. Breakpoint (중단점)</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 24px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }
    .cell { background: #2563eb; color: #fff; padding: 12px; border-radius: 6px; text-align: center; }

    /* ── 섹션 4: Breakpoint (중단점) ────────────────────── */
    /* [기본] 프로젝트마다 기준점을 "정해 놓고" 그 지점에서만 레이아웃 변경 */
    /*        예) 모바일 ~480px / 태블릿 768~1024px / 데스크톱 1024px~ */
    .bp-label::after { content: "모바일 (~480px)"; }
    @media (min-width: 481px)  { .bp-label::after { content: "태블릿 (481~1024px)"; } }
    @media (min-width: 1025px) { .bp-label::after { content: "데스크톱 (1025px~)"; } }
    /* 실수: 아무 숫자에서나 미디어 쿼리를 남발하면 유지보수가 지옥 -> 기준점을 정해 통일 */
    /* 표시: 창 너비에 따라 현재 구간 이름이 바뀜 */
  </style>
</head>
<body>
  <!-- ── 섹션 4: Breakpoint ── -->
  <section>
    <h2>섹션 4. Breakpoint (중단점)</h2>
    <p>현재 구간: <strong class="bp-label"></strong></p>
    <p class="hint">창 너비를 바꾸면 구간 이름이 바뀝니다.</p>
  </section>
</body>
</html>
