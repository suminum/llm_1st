<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 실습 정답코드 — 실습. 요소 쌓임 순서 & z-index (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 실습. 요소 쌓임 순서 &amp; z-index</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    /* (원본 body의 padding-top: 64px는 [추가 실습] 고정 헤더 전용 — 추가실습 파일에만 복제) */
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 32px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* ── 실습: 요소 쌓임 순서 & z-index ───────────────── */
    /* 100x100 아이템 3개를 겹쳐 놓고 z-index로 순서를 바꿉니다. */
    /* Step 1: 컨테이너와 아이템 — 부모 relative, 아이템 absolute로 겹치기 */
    .p2-container {
      position: relative;
      width: 500px; height: 300px;        /* 데모가 잘 보이도록 높이만 축소 */
      border: 3px solid #343a40; background: #f1f3f5;
      margin-bottom: 12px;
    }
    .p2-item { position: absolute; width: 100px; height: 100px;
               color: #fff; text-align: center; line-height: 96px; }
    .p2-item1 { top: 0;    left: 0;    background: #4dabf7; border: 2px solid #1971c2; }
    .p2-item2 { top: 30px; left: 30px; background: #69db7c; border: 2px solid #2f9e44; }
    .p2-item3 { top: 60px; left: 60px; background: #ff8787; border: 2px solid #e03131; }
    /* Step 2: (1) 아이템 3 > 2 > 1 순서 — HTML 작성 순서 그대로라 z-index 불필요! */
    /* Step 3: (2) 아이템 1 > 3 > 2 순서 — z-index로 뒤집기 (큰 수가 위) */
    .p2-case2 .p2-item1 { z-index: 3; }   /* 맨 위 */
    .p2-case2 .p2-item3 { z-index: 2; }
    .p2-case2 .p2-item2 { z-index: 1; }   /* 맨 아래 */
  </style>
</head>
<body>
  <!-- ── 실습: 요소 쌓임 순서 & z-index ── -->
  <section>
    <h2>실습. 요소 쌓임 순서 &amp; z-index</h2>
    <p>(1) 3 &gt; 2 &gt; 1 — HTML 순서 그대로</p>
    <div class="p2-container">
      <div class="p2-item p2-item1">1</div>
      <div class="p2-item p2-item2">2</div>
      <div class="p2-item p2-item3">3</div>
    </div>
    <p>(2) 1 &gt; 3 &gt; 2 — z-index로 변경</p>
    <div class="p2-container p2-case2">
      <div class="p2-item p2-item1">1</div>
      <div class="p2-item p2-item2">2</div>
      <div class="p2-item p2-item3">3</div>
    </div>
  </section>
</body>
</html>
