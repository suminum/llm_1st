<!DOCTYPE html>
<!--
  02_CSS_05_Position_Background 실습 정답코드 — 실습. position relative + absolute 배지·알림 (HTML/CSS)
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CSS_05 Position &amp; Background — 실습. position relative + absolute 배지·알림</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* ── 공통 스타일 ── */
    body { font-family: "Malgun Gothic", sans-serif; margin: 20px; }
    /* (원본 body의 padding-top: 64px는 [추가 실습] 고정 헤더 전용 — 추가실습 파일에만 복제) */
    section { border: 1px solid #ced4da; padding: 16px; margin-bottom: 32px; }
    h2 { font-size: 17px; margin: 0 0 12px; }

    /* ── 실습: position relative + absolute 배지·알림 ── */
    /* 설비 카드 우상단 상태 배지, 알림 아이콘 숫자 배지를 만듭니다. */
    /* Step 1: 부모(카드)에 position: relative — 배지의 기준점 */
    .p3-card {
      position: relative;
      display: inline-block;              /* 카드끼리 가로 배치 */
      width: 200px; padding: 16px;
      border: 1px solid #adb5bd; border-radius: 8px;
      background: #fff; margin-right: 12px; vertical-align: top;
    }
    .p3-card h3 { margin: 0 0 8px; font-size: 15px; }
    .p3-card p  { margin: 0; color: #495057; }
    /* Step 2: 배지에 position: absolute + top/right — 카드 우상단에 부착 */
    .p3-badge {
      position: absolute;
      top: 10px; right: 10px;
      padding: 3px 10px; border-radius: 12px;
      font-size: 12px; color: #fff;
    }
    .p3-ok     { background: #2f9e44; }   /* 정상 */
    .p3-warn   { background: #f08c00; }   /* 주의 */
    .p3-danger { background: #e03131; }   /* 긴급 */
    /* Step 3: 케이스 B — 알림 아이콘 위 숫자 배지 (살짝 밖으로 내밀기) */
    .p3-bell {
      position: relative;
      display: inline-block;
      width: 48px; height: 48px; border-radius: 8px;
      background: #343a40; color: #fff;
      text-align: center; line-height: 48px; font-size: 14px;
    }
    .p3-count {
      position: absolute;
      top: -8px; right: -8px;             /* 음수 값으로 모서리 밖까지 */
      min-width: 22px; height: 22px; border-radius: 11px;
      background: #e03131; color: #fff;
      font-size: 11px; line-height: 22px; padding: 0 4px;
    }
  </style>
</head>
<body>
  <!-- ── 실습: position relative + absolute 배지·알림 ── -->
  <section>
    <h2>실습. position relative + absolute 배지·알림</h2>
    <!-- 케이스 A: 설비 카드 우상단 상태 배지 -->
    <div class="p3-card">
      <h3>프레스 1호기</h3>
      <p>온도 72.3 ℃</p>
      <span class="p3-badge p3-ok">정상</span>
    </div>
    <div class="p3-card">
      <h3>프레스 2호기</h3>
      <p>온도 88.1 ℃</p>
      <span class="p3-badge p3-warn">주의</span>
    </div>
    <div class="p3-card">
      <h3>용접 로봇 A</h3>
      <p>전류 이상 감지</p>
      <span class="p3-badge p3-danger">긴급</span>
    </div>
    <br /><br />
    <!-- 케이스 B: 알림 아이콘 숫자 배지 -->
    <div class="p3-bell">
      알림
      <span class="p3-count">99+</span>
    </div>
  </section>
</body>
</html>
