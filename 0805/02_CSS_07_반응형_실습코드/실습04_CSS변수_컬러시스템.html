<!DOCTYPE html>
<!--
  02_CSS_07_반응형 실습 정답코드 — 실습 4. CSS 변수로 컬러 시스템 구축
  각 실습의 Step별 정답을 주석과 함께 정리합니다.
  * 확인 방법: 개발자도구(F12) -> Ctrl+Shift+M 으로 창 너비를 바꿔 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS_07 반응형 — 실습 4. CSS 변수로 컬러 시스템 구축</title>
  <style>
    /* 공통 기본 스타일 (원본 공통 — 수업 내용 아님) */
    /* 공통: 데모 배치용 최소 스타일 */
    body { font-family: sans-serif; margin: 0; }
    section { border-bottom: 4px solid #e5e7eb; padding: 20px 24px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .hint { color: #888; font-size: 13px; }

    /* ── 실습 4: CSS 변수로 컬러 시스템 구축 ─────────────── */
    /* 목표: :root 변수 하나만 바꾸면 UI 전체 색이 바뀐다 */

    /* Step 1: :root에 색상 변수 시스템 정의 (5개 이상) */
    :root {
      --color-primary: #2563eb;   /* 이 한 줄만 바꾸면 전체 UI 색이 바뀜! */
      --color-info:    #0ea5e9;   /* 정보 */
      --color-success: #16a34a;   /* 성공 */
      --color-warning: #d97706;   /* 경고 */
      --color-error:   #dc2626;   /* 오류 */
      --bg-card:       #ffffff;
      --text-body:     #374151;
      --border:        #e5e7eb;
      --radius:        8px;
    }

    /* Step 2: 모든 색상을 하드코딩 없이 변수로 참조 */
    /* 케이스 A: AI 서비스 컬러 시스템 (버튼·알림·카드) */
    .ai-panel { color: var(--text-body); }
    .ai-title { color: var(--color-primary); }
    .ai-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; margin-bottom: 8px;
    }
    .ai-card strong { color: var(--color-primary); }
    .btn-primary {
      background: var(--color-primary); color: #fff;
      border: none; border-radius: var(--radius);
      padding: 10px 20px; cursor: pointer;
    }
    /* 케이스 B: 공지 시스템 상태별 색상 (정보·성공·경고·오류) */
    .notice {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tag { border-radius: 12px; padding: 4px 12px; font-size: 13px; color: #fff; }
    .tag-info    { background: var(--color-info); }
    .tag-success { background: var(--color-success); }
    .tag-warning { background: var(--color-warning); }
    .tag-error   { background: var(--color-error); }

    /* Step 3: 다크 모드도 변수 교체만으로 전환 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-card:   #1f2937;
        --text-body: #e5e7eb;
        --border:    #374151;
      }
      body { background: #111827; }
      h1, h2 { color: #e5e7eb; }
    }

    /* Step 4(실험): 아래 주석을 해제하면 UI 전체가 보라색 테마로 바뀜 */
    /* :root { --color-primary: #7c3aed; } */
  </style>
</head>
<body>
  <!-- ── 실습 4: CSS 변수로 컬러 시스템 구축 ── -->
  <section class="ai-panel">
    <h2 class="ai-title">실습 4. CSS 변수로 컬러 시스템 구축</h2>

    <!-- 케이스 A: AI 서비스 컬러 시스템 (버튼·알림·카드) -->
    <div class="ai-card">
      <strong>AI 어시스턴트</strong>
      <p>새로운 답변이 도착했습니다. 요약을 확인해 보세요.</p>
      <button class="btn-primary">새 대화 시작</button>
    </div>

    <!-- 케이스 B: 공지 시스템 상태별 색상 (정보·성공·경고·오류) -->
    <div class="notice">
      <span>점검 일정이 등록되었습니다</span>
      <span class="tag tag-info">정보</span>
    </div>
    <div class="notice">
      <span>백업이 완료되었습니다</span>
      <span class="tag tag-success">성공</span>
    </div>
    <div class="notice">
      <span>저장 공간이 부족합니다</span>
      <span class="tag tag-warning">경고</span>
    </div>
    <div class="notice">
      <span>서버 연결에 실패했습니다</span>
      <span class="tag tag-error">오류</span>
    </div>

    <p class="hint">
      :root의 --color-primary 한 줄만 바꾸면 제목·버튼·강조 색이 모두 바뀝니다.
      (style 태그의 Step 4 주석 해제로 실험) OS 다크 모드에서는 카드가 어두운 색으로 전환됩니다.
    </p>
  </section>
</body>
</html>
