<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 1. 문서 기본 구조 — DOCTYPE·html·head·body (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->

<!-- ── 섹션 1: 문서 기본 구조 — DOCTYPE·html·head·body ── -->
<!-- [기본] <!DOCTYPE html> 은 태그가 아닌 선언문 — "HTML5 문서"라고 브라우저에 알림. 항상 파일 첫 줄 -->
<!-- [기본] lang="ko" — 한국어 문서 선언. 스크린 리더 발음·번역 제안·검색 분류에 활용 -->
<html lang="ko">
<!-- 구조: html 안에 head(정보)와 body(내용)가 위치 -->
<!-- 실수: DOCTYPE을 파일 중간에 쓰거나 생략 — 브라우저가 옛날 방식(쿼크 모드)으로 그려서 화면이 어긋남 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 1. 문서 기본 구조 — DOCTYPE·html·head·body</title>
</head>

<body>
  <h2>섹션 1. 문서 기본 구조 — DOCTYPE·html·head·body</h2>
</body>
</html>
