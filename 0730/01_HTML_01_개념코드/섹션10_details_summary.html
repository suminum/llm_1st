<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 10. details · summary — 접었다 펴는 영역 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 10. details · summary — 접었다 펴는 영역</title>
</head>

<body>
  <h2>섹션 10. details · summary — 접었다 펴는 영역</h2>

  <!-- ── 섹션 10: details · summary — 접었다 펴는 영역 ──── -->
  <!-- [기본] summary를 클릭하면 나머지 내용이 펼쳐짐 -->
  <details>
    <summary>내용을 숨길 수 있어요.</summary>
    숨긴 내용은 이 곳에 쓰면 됩니다.
  </details>
  <!-- 표시: ▶ 제목 줄만 보이다가, 클릭하면 아래로 내용이 펼쳐짐 -->
</body>
</html>
