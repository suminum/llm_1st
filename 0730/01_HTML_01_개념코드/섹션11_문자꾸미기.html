<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 11. 문자 꾸미기 — b·strong·i·em·del·u (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 11. 문자 꾸미기 — b·strong·i·em·del·u</title>
</head>

<body>
  <h2>섹션 11. 문자 꾸미기 — b·strong·i·em·del·u</h2>

  <!-- ── 섹션 11: 문자 꾸미기 — b·strong·i·em·del·u ─────── -->
  <!-- [기본] b/strong: 두껍게, i/em: 기울임, del: 취소선, u: 밑줄 -->
  <p><b>두껍게(b)</b> / <strong>중요 강조(strong)</strong></p>
  <p><i>기울임(i)</i> / <em>의미 강조(em)</em></p>
  <p><del>취소선(del)</del> / <u>밑줄(u)</u></p>
  <!-- strong·em은 겉모습에 더해 "중요하다"는 의미까지 전달 — 스크린 리더가 강조해서 읽음 -->
</body>
</html>
