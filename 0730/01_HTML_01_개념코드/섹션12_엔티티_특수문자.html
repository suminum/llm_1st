<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 12. 엔티티 — 특수문자 표현 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 12. 엔티티 — 특수문자 표현</title>
</head>

<body>
  <h2>섹션 12. 엔티티 — 특수문자 표현</h2>

  <!-- ── 섹션 12: 엔티티 — 특수문자 표현 ────────────────── -->
  <!-- [기본] <, >, & 는 HTML 문법 기호라 그대로 쓸 수 없음 — 엔티티 코드로 대체 -->
  <p>&lt;h1&gt; 이라고 쓰면 태그가 아니라 텍스트로 표시됩니다.</p>
  <!-- 표시: <h1> 이라고 쓰면 태그가 아니라 텍스트로 표시됩니다. -->
  <p>커피&nbsp;&amp;&nbsp;티 &copy; 2026</p>
  <!-- &lt;(<) / &gt;(>) / &amp;(&) / &nbsp;(줄바꿈 없는 공백) / &copy;(©) -->
  <!-- 실수: <p>여기에 <h1>을 그대로 쓰면</p>  // 진짜 태그로 해석되어 화면 구조가 깨짐 -->
</body>
</html>
