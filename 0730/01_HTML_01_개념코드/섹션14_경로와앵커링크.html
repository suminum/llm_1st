<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 14. 경로와 앵커 링크 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 14. 경로와 앵커 링크</title>
</head>

<body>
  <h2>섹션 14. 경로와 앵커 링크</h2>

  <!-- ── 섹션 14: 경로와 앵커 링크 ──────────────────────── -->
  <!-- [기본] 절대 경로: 전체 URL — 외부 사이트로 이동할 때 -->
  <p><a href="https://www.w3.org" target="_blank" rel="noopener noreferrer">절대 경로 링크</a></p>
  <!-- [기본] 상대 경로: 현재 파일 위치 기준 — about.html(같은 폴더) / ../파일(상위) / 폴더명/파일(하위) -->
  <p><a href="../01_HTML_01_실습코드/실습01-02_기본구조_head_중첩연습.html">실습코드 폴더의 실습 파일로 이동 (../폴더/파일)</a></p>
  <!-- (자료 분할로 실습코드가 폴더가 되어, 원본의 "같은 폴더의 01_HTML_01_실습코드.html" 링크를 ../폴더/파일 상대 경로로 갱신) -->
  <!-- [기본] 앵커 링크: href="#이름" 과 목적지 태그의 id="이름" 을 연결 — 같은 페이지 안 이동 -->
  <p><a href="#anchor-demo">아래 앵커 목적지로 스크롤 이동</a></p>
  <h4 id="anchor-demo">앵커 목적지 섹션</h4>
  <!-- [다른 방법] 다른 페이지의 특정 위치로: href="about.html#team" -->
  <!-- 실수: href="#demo" 인데 id="demo" 인 요소가 없음  // 클릭해도 아무 데도 안 감 -->
</body>
</html>
