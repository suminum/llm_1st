<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 13. 하이퍼링크 a — href·target·rel (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 13. 하이퍼링크 a — href·target·rel</title>
</head>

<body>
  <h2>섹션 13. 하이퍼링크 a — href·target·rel</h2>

  <!-- ── 섹션 13: 하이퍼링크 a — href·target·rel ────────── -->
  <!-- [기본] a = Anchor. href(Hypertext Reference)에 이동할 주소 -->
  <p><a href="https://www.naver.com">네이버로 이동 (현재 탭)</a></p>
  <!-- [기본] 새 탭 열기: target="_blank" — 보안상 rel="noopener noreferrer" 를 반드시 함께 -->
  <p><a href="https://www.kakao.com" target="_blank" rel="noopener noreferrer">카카오 홈페이지 (새 탭)</a></p>
  <!-- target 기본값은 _self(현재 탭) -->
  <!-- 실수: <a href="www.naver.com">  // https:// 를 빼면 외부가 아니라 내 폴더에서 파일을 찾음 -->
</body>
</html>
