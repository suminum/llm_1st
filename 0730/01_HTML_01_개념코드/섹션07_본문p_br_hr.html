<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 7. 본문 p · 줄 바꿈 br · 수평 줄 hr (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 7. 본문 p · 줄 바꿈 br · 수평 줄 hr</title>
</head>

<body>
  <h2>섹션 7. 본문 p · 줄 바꿈 br · 수평 줄 hr</h2>

  <!-- ── 섹션 7: 본문 p · 줄 바꿈 br · 수평 줄 hr ───────── -->
  <!-- [기본] p = Paragraph. 문단 하나 — 자동 줄 바꿈 -->
  <p>본문 내용을 작성하는 곳입니다.</p>
  <!-- [기본] 코드의 엔터·공백은 화면에 그대로 반영되지 않음 — 줄 바꿈은 br -->
  <p>첫 번째 줄<br>두 번째 줄</p>
  <hr>
  <p>수평 줄(hr) 아래의 내용</p>
  <!-- 표시: 문단 사이에 가로 구분선이 그어짐 -->
  <!-- 실수: 문단 간격을 <br><br><br> 로 벌리기  // 간격은 CSS 담당 — br은 진짜 줄 바꿈에만 -->
</body>
</html>
