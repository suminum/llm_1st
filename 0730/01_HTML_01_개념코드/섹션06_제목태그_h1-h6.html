<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 6. 제목 태그 h1~h6 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 6. 제목 태그 h1~h6</title>
</head>

<body>
  <h2>섹션 6. 제목 태그 h1~h6</h2>

  <!-- ── 섹션 6: 제목 태그 h1~h6 ────────────────────────── -->
  <!-- [기본] h = Heading. h1(가장 큼)부터 h6까지. 자동 줄 바꿈 -->
  <h1>h1 — 페이지당 하나만</h1>
  <h2>h2 — 그 다음 단계 제목</h2>
  <h3>h3 — 소제목</h3>
  <!-- 표시: 크기가 단계별로 줄어드는 굵은 제목 3줄 -->
  <!-- h 태그는 검색 엔진이 핵심 주제로 인식(SEO) — 계층 순서 유지 -->
  <!-- 실수: <h1> 다음에 바로 <h3>  // 계층 건너뛰기 금지. 글자 크기 조절은 CSS 담당 -->
</body>
</html>
