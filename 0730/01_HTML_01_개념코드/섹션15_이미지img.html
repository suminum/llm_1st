<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 15. 이미지 img — src·alt·width·height (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 15. 이미지 img — src·alt·width·height</title>
</head>

<body>
  <h2>섹션 15. 이미지 img — src·alt·width·height</h2>

  <!-- ── 섹션 15: 이미지 img — src·alt·width·height ─────── -->
  <!-- [기본] img는 빈 요소 — src(이미지 경로)와 alt(대체 텍스트)를 항상 함께 -->
  <img src="https://placehold.co/300x200" alt="300x200 회색 예시 이미지" width="300" height="200">
  <!-- alt: 이미지가 안 뜰 때 대신 표시 + 스크린 리더가 소리로 읽음 + 검색엔진이 내용 파악 -->
  <!-- 장식용 이미지는 alt="" 로 명시 — 스크린 리더가 건너뜀 -->
  <!-- [다른 방법] 이미지를 a로 감싸면 클릭 가능한 이미지 링크 -->
  <a href="https://www.w3.org" target="_blank" rel="noopener noreferrer">
    <img src="https://placehold.co/150x100" alt="클릭하면 W3C로 이동하는 이미지" width="150" height="100">
  </a>
  <!-- 실수: <img src="photo.jpg">  // alt 누락 — 접근성·유효성 검사에서 오류 -->
  <!-- 실수: src 경로의 파일명 대소문자·확장자 오타  // 이미지가 안 보이면 F12 Console에서 확인 -->
</body>
</html>
