<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 8. 목록 ul · ol · li (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 8. 목록 ul · ol · li</title>
</head>

<body>
  <h2>섹션 8. 목록 ul · ol · li</h2>

  <!-- ── 섹션 8: 목록 ul · ol · li ──────────────────────── -->
  <!-- [기본] ul = Unordered List. 순서 없는 목록(• 점). 각 항목은 li -->
  <ul>
    <li>첫 번째 항목</li>
    <li>두 번째 항목</li>
    <li>세 번째 항목</li>
  </ul>
  <!-- [기본] ol = Ordered List. 순서 있는 목록 — 자동으로 1, 2, 3 ... 번호 -->
  <ol>
    <li>준비 단계</li>
    <li>실행 단계</li>
    <li>완료 단계</li>
  </ol>
  <!-- [다른 방법] type으로 번호 형식(1/A/a/I/i), start로 시작 번호 지정 -->
  <ol type="a" start="3">
    <li>c부터 시작하는 항목</li>
    <li>그 다음은 d</li>
  </ol>
  <!-- 실수: <ul>1. 항목</ul>  // 항목은 반드시 li 태그로 감싸기 -->
</body>
</html>
