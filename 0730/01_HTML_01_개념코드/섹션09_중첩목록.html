<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 9. 중첩 목록 — 목록 안의 목록 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 9. 중첩 목록 — 목록 안의 목록</title>
</head>

<body>
  <h2>섹션 9. 중첩 목록 — 목록 안의 목록</h2>

  <!-- ── 섹션 9: 중첩 목록 — 목록 안의 목록 ─────────────── -->
  <!-- [기본] 자식 목록(ul/ol)은 반드시 li "안"에 위치 -->
  <ul>
    <li>항목 A
      <ul>
        <li>하위 A-1</li>
        <li>하위 A-2</li>
      </ul>
    </li>
    <li>항목 B</li>
  </ul>
  <!-- 표시: 하위 항목이 한 단 들여쓰기되고 불릿 모양이 바뀜 -->
  <!-- 실수: </li> 를 닫은 "다음"에 <ul> 배치  // 자식 목록이 부모 항목과 분리됨 -->
  <!-- 중첩은 2~3단계까지만 권장 — 깊어질수록 구조 파악이 어려움 -->
</body>
</html>
