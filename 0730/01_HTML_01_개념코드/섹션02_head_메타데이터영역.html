<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 2. head — 메타 데이터 영역 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<!-- ── 섹션 2: head — 메타 데이터 영역 ────────────────── -->
<head>
  <!-- [기본] charset은 head의 첫 줄 — 없으면 한글이 깨짐 -->
  <meta charset="UTF-8">
  <!-- [기본] viewport — 모바일 대응. 없으면 폰에서 PC 화면이 그대로 축소되어 보임 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- [기본] title — 브라우저 탭에 표시되는 문서 제목 -->
  <title>HTML_01 기초와 텍스트 구조 — 섹션 2. head — 메타 데이터 영역</title>
  <!-- head에는 title, style, link, script, meta 등 "화면에 안 보이는 정보"가 들어감 -->
  <!-- 실수: <h1>제목</h1> 을 head 안에 작성 — 화면에 보일 콘텐츠는 전부 body에! -->
</head>

<body>
  <h2>섹션 2. head — 메타 데이터 영역</h2>
</body>
</html>
