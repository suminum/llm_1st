<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 3. 요소(Element) — 시작 태그 + 내용 + 종료 태그 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 3. 요소(Element) — 시작 태그 + 내용 + 종료 태그</title>
</head>

<body>
  <h2>섹션 3. 요소(Element) — 시작 태그 + 내용 + 종료 태그</h2>

  <!-- ── 섹션 3: 요소(Element) — 시작 태그 + 내용 + 종료 태그 ── -->
  <!-- [기본] <p>(시작 태그) + 내용 + </p>(종료 태그) = 하나의 요소 -->
  <p>HTML 요소는 시작 태그, 내용, 종료 태그로 구성됩니다.</p>
  <!-- 태그는 <>로 감싼 명령어 — 브라우저에 "이건 문단이야"라고 알려줌 -->
  <!-- 실수: <p>종료 태그를 빠뜨림  // 브라우저가 임의로 닫아서 이후 레이아웃이 어긋남 -->
</body>
</html>
