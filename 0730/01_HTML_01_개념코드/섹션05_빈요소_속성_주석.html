<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 개념코드 — 섹션 5. 빈 요소 · 속성 · 주석 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 섹션 5. 빈 요소 · 속성 · 주석</title>
</head>

<body>
  <h2>섹션 5. 빈 요소 · 속성 · 주석</h2>

  <!-- ── 섹션 5: 빈 요소 · 속성 · 주석 ──────────────────── -->
  <!-- [기본] 빈 요소(Empty): 내용 없이 속성만 가짐 — br, hr, img, input, link, meta -->
  <input type="text">
  <!-- [기본] 속성(Attribute): <태그 속성="값"> 형태로 요소에 추가 정보 제공 -->
  <a href="https://example.com">속성(href) 예시 링크</a>
  <!-- [기본] 주석: 개발자용 메모 — 브라우저는 화면에 표시하지 않음. 단축키 Ctrl + / (Mac: Cmd + /) -->
  <!-- 실수: <input type="text"></input>  // 빈 요소에는 종료 태그를 붙이지 않음 -->
</body>
</html>
