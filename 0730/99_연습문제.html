<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════

  오늘 배운 것만으로 푸는 연습문제 — 마지막 교시 또는 다음 날 아침 복습용
  ═══════════════════════════════════════════════════════════════

  규칙: 오늘 배운 HTML만 사용합니다. CSS(style 속성)와 JavaScript(script 태그)는
        아직 배우지 않았으므로 한 줄도 쓰지 않습니다.
  방법: 1) 각 문제의 TODO 주석 자리에 코드를 작성합니다.
        2) 저장(Ctrl+S) 후 브라우저 새로고침(F5)으로 바로 확인합니다.

  소재: 수업에서 든 비유가 그대로 문제가 됩니다 —

<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2일차 연습문제 — HTML 기초 (1)</title>

<body>
  <h2>2일차 연습문제 — HTML 기초 (1)</h2>
  <p>각 문제 제목 아래 <b>TODO 주석 자리</b>에 코드를 작성하세요.
    브라우저로 열어 두고 저장할 때마다 새로고침(F5)하며 확인합니다.</p>
  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 1. 독서 기록 — 제목의 계층  (기본)
       ═══════════════════════════════════════════════
       수업에서 "제목 태그는 책의 목차와 같다"고 했습니다.
       h1 = 책 제목(한 권에 하나) / h2 = 장(챕터) / h3 = 절.
       그 비유를 그대로 코드로 옮기는 문제입니다.
       [요구사항]
       1) h1으로 페이지 제목 "내가 읽은 책 — 모모"를 작성합니다.
          h1은 페이지당 하나! 이 연습 파일에서 h1은 여기서만 사용합니다.
       2) h2 소제목 "줄거리" + 바로 아래 p 문단 1개
          (예: 시간을 훔치는 회색 신사들에게서 사람들의 시간을 되찾아 오는 이야기입니다.)
       3) h2 소제목 "추천하는 이유" + 바로 아래 p 문단 1개
          (예: 바쁘게만 살던 하루를 잠깐 멈춰 세워 주는 책이라서 추천합니다.)
       4) 제목 계층 지키기 — h1 다음에 h3로 건너뛰지 않습니다.
       * 글자를 크게 하고 싶어서 h를 고르면 안 됩니다. 크기는 다음 주 CSS의 일!
       [완성 화면]
       가장 큰 제목 1줄, 그 아래로 "중간 제목 + 본문 문단" 묶음이 두 번.
       제목과 문단은 자동으로 줄이 바뀝니다.
       [힌트] 01_HTML_01_개념코드 폴더의 섹션06 파일(제목 h1~h6), 섹션07 파일(본문 p)
  -->
  <h3>문제 1 — 독서 기록 (제목의 계층)</h3>
  <!-- TODO: 여기에 h1 + (h2 + p) 2세트를 작성하세요 -->

  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 2. 공연 안내 — 줄 바꿈과 구분선  (기본)
       ═══════════════════════════════════════════════
       수업에서 br은 "주소 두 줄처럼, 같은 덩어리인데 줄만 바꿀 때" 쓴다고 했습니다.
       안내문의 일시·장소·문의는 하나의 덩어리이므로 p 하나 안에서 br로 나눕니다.
       [요구사항]
       1) p "한 개" 안에서 br로 줄을 바꿔 아래 3줄을 만듭니다.
            일시: 8월 8일(토) 오후 7시
            장소: 대학로 소극장 2관
            예매 문의: 010-1234-5678
       2) 그 아래 hr로 수평 구분선을 긋습니다.
       3) 구분선 아래 p로 "공연 시작 후에는 입장이 제한됩니다."를 작성합니다.
       * 코드에서 엔터를 눌러도 화면 줄은 바뀌지 않습니다 — 줄 바꿈은 br!
       * 문단 사이 간격을 벌리려고 br을 여러 번 쓰는 것은 금지(간격은 나중에 CSS 담당).
       [완성 화면]
       문단 하나가 3줄로 보이고, 가로줄 아래에 안내 문단이 이어집니다.
       [힌트] 01_HTML_01_개념코드 폴더의 섹션07 파일(p·br·hr)
  -->
  <h3>문제 2 — 공연 안내</h3>
  <!-- TODO: 여기에 p(안에 br 2개) + hr + p 를 작성하세요 -->

  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 3. 김치볶음밥 레시피 — ul과 ol 고르기  (기본)
       ═══════════════════════════════════════════════
       수업의 판단 기준: "순서를 바꿨을 때 의미가 달라지면 ol"
         · 재료 = 장보기 목록 → 순서 바꿔도 됨 → ul
         · 조리 순서 = 라면 조리법 → 순서 바꾸면 망함 → ol
       이 문제는 그 기준을 손으로 확인하는 문제입니다.
       [요구사항]
       1) p 라벨 "재료"(strong으로 굵게)를 쓰고, 그 아래
          순서 없는 목록 ul 4항목: 밥 2공기 / 잘 익은 김치 1컵 / 대파 1대 / 계란 2개
       2) p 라벨 "조리 순서"를 쓰고, 그 아래 순서 있는 목록 ol 4항목:
          팬에 기름을 두르고 대파를 볶는다 → 김치를 넣고 함께 볶는다
          → 밥을 넣고 고루 섞는다 → 계란 프라이를 올려 마무리한다
       3) p 라벨 "남은 재료 보관(c단계부터 이어서)"를 쓰고, 그 아래
          ol에 type="a"와 start="3"을 지정해 항목 2개:
          김치는 한 번 먹을 양씩 나눠 냉동 / 대파는 썰어서 밀폐용기에 보관
       * 목록의 항목은 반드시 li로 감쌉니다.
       [완성 화면]
       • 점 목록 4개 → 1. 2. 3. 4. 번호 목록 → c. d. 로 시작하는 목록 순서로 표시.
       [힌트] 01_HTML_01_개념코드 폴더의 섹션08 파일(ul·ol·li, type·start)
  -->
  <h3>문제 3 — 김치볶음밥 레시피</h3>
  <!-- TODO: 여기에 (p 라벨 + 목록) 3세트를 작성하세요 -->

  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 4. 여행 준비물 — 중첩 목록  (응용)
       ═══════════════════════════════════════════════
       [요구사항]
       1) ul로 상위 항목 2개를 만듭니다. 가방 이름은 strong으로 굵게:
          "기내용 가방" / "위탁 수하물"
       2) 각 상위 항목의 li를 닫기 "전"에 하위 ul을 중첩합니다.
          기내용 하위: 여권·항공권 / 보조배터리 / 상비약
          위탁 하위: 세면도구 / 여벌 옷
       3) 기내용 하위에 항목 하나를 더 추가하고, 기내에 못 들고 타서
          빼기로 했음을 표시합니다: 항목 텍스트 "셀카봉"은 del(취소선)로,
          바로 뒤에 em으로 "(기내 반입 불가 — 위탁으로 옮김)"을 붙입니다.
       [완성 화면]
       상위 불릿(●) 2개 아래에 한 단 들여쓰기된 하위 불릿(○)이 나타나고,
       기내용 하위의 마지막 항목은 취소선 + 기울임으로 표시됩니다.
       [힌트] 01_HTML_01_개념코드 폴더의 섹션09 파일(중첩 목록), 섹션11 파일(문자 꾸미기)
             하위 ul을 li 닫은 "뒤"에 두면 부모와 분리되는 실수 주의!
  -->
  <h3>문제 4 — 여행 준비물 (중첩 목록)</h3>
  <!-- TODO: 여기에 2단 중첩 목록을 작성하세요 -->

  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 5. 중고거래 게시글 — 꾸미기·엔티티  (응용)
       ═══════════════════════════════════════════════
       수업에서 del(취소선)은 "가격 할인 표시에 흔하다"고 했습니다.
       이 문제에서 그 자리를 직접 만들어 봅니다.
       [요구사항] p 4개를 차례로 작성합니다.
       1) "직거래는 지하철 2번 출구 앞에서만 합니다. 택배 거래는 어렵습니다."
          — "지하철 2번 출구 앞"은 strong으로, "택배 거래는 어렵습니다."는 em으로.
       2) "가격: 35,000원 28,000원 (오늘까지 할인)"
          — 원래 가격 35,000원은 del(취소선), 할인가 28,000원은 u(밑줄)로.
       3) 화면에 아래처럼 부등호가 "글자로" 보이게 작성합니다. 엔티티 필수!
             상태: 사용 기간 < 6개월, 배터리 성능 > 90%
       4) 화면에 아래처럼 보이게 작성합니다.
             안전 & 신뢰 © 2026 우리동네 중고장터
          — & 기호는 엔티티로, & 양옆의 공백은 줄바꿈 없는 공백(nbsp)으로,
            © 기호도 엔티티로 작성합니다.
       [완성 화면]
       굵은 글씨와 기울임이 섞인 문장, 취소선과 밑줄이 나란한 문장,
       그리고 <, >, &, © 기호가 그대로 표시된 문장 2개.
       [힌트] 01_HTML_01_개념코드 폴더의 섹션11 파일(b·strong·i·em·del·u), 섹션12 파일(엔티티)
  -->
  <h3>문제 5 — 중고거래 게시글</h3>
  <!-- TODO: 여기에 p 4개를 작성하세요 -->

  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 6. 공부 자료 북마크 — 링크와 앵커  (응용)
       ═══════════════════════════════════════════════
       수업의 경로 비유: 절대 경로 = 도로명 전체 주소(밖으로 나갈 때),
                        상대 경로 = "우리 집 기준 옆집"(같은 폴더 파일).
       ※ 다 만들면 진짜 쓸 수 있는 북마크 페이지가 됩니다. 링크를 더 추가해도 좋습니다.
       [요구사항]
       1) 외부 링크: p 안에 a로 "MDN HTML 문서 (새 탭)" 링크를 만듭니다.
          주소는 https://developer.mozilla.org/ko/docs/Web/HTML —
          새 탭(target="_blank")으로 열고,
          보안 속성 rel="noopener noreferrer"를 반드시 함께 씁니다.
       2) 내부 링크: p 안에 a로 01_HTML_01_개념코드 폴더의 섹션01_문서기본구조.html로
          가는 상대 경로 링크(폴더명/파일명) "오늘 개념코드 다시 보기"를 만듭니다.
       3) 앵커 목차: ul(id="bookmark-menu")을 만들고 li 3개에 각각 a를 넣습니다.
          href는 "#ref-html" / "#ref-css" / "#ref-js",
          링크 텍스트는 HTML 자료 / CSS 자료 / JavaScript 자료.
       4) 목적지: h4에 id="ref-html"~"ref-js"를 달아 제목 3개를 만들고,
          각 제목 아래 p로 설명을 1줄씩 씁니다. (예: 태그와 문서 구조를 찾을 때)
       5) 마지막에 p 안에 a href="#bookmark-menu"로 "▲ 목차로 돌아가기"를 만듭니다.
       [완성 화면]
       파란 밑줄 링크들이 보입니다. 외부 링크는 새 탭으로 열리고,
       목차를 클릭하면 해당 제목으로, "목차로 돌아가기"를 클릭하면
       목차로 화면이 이동합니다. (창 높이를 줄이면 스크롤 이동이 잘 보입니다)
       [힌트] 01_HTML_01_개념코드 폴더의 섹션13 파일(하이퍼링크), 섹션14 파일(경로와 앵커)
             href의 "#이름"과 목적지의 id="이름"이 한 글자라도 다르면 안 움직입니다!
  -->
  <h3>문제 6 — 공부 자료 북마크 (링크·앵커)</h3>
  <!-- TODO: 여기에 외부/내부 링크 + 목차 + 목적지 3세트를 작성하세요 -->

  <hr>

  <!-- ═══════════════════════════════════════════════
       문제 7. [도전] 영화 추천 페이지 — 오늘 배운 것 총동원
       ═══════════════════════════════════════════════
       영화 추천 페이지 하나를 완성합니다. (페이지 제목은 아래 문제 표제가
       대신하므로 생략 — 실전에서 독립 파일이라면 h1으로 시작합니다!)
       details는 "접었다 펴는 영역"이었죠 — 스포일러를 감추는 데 딱 맞습니다.
       [요구사항]
       1) 목차: ul 안에 li + a 2개 — "인셉션"(#movie-inception),
          "인터스텔라"(#movie-interstellar)
       2) 영화 카드 2개 — 각 카드는 다음 3가지로 구성:
          (a) h4 제목 + id (movie-inception / movie-interstellar)
          (b) 이미지 링크: a(새 탭 + rel 보안 속성)로 img를 감쌉니다.
              인셉션     → 링크 https://ko.wikipedia.org/wiki/인셉션
                          이미지 https://placehold.co/300x200?text=INCEPTION
              인터스텔라 → 링크 https://ko.wikipedia.org/wiki/인터스텔라
                          이미지 https://placehold.co/300x200?text=INTERSTELLAR
              img에는 구체적인 alt("영화" 한 단어 금지!)와
              width="300" height="200"을 답니다.
          (c) 설명 p 1~2문장 — strong을 1회 이상 사용
       3) details + summary: summary "스포일러 주의 — 결말 힌트 보기"를
          클릭하면 내용이 펼쳐지게 합니다.
          (내용 예: 두 영화 모두 마지막 장면을 다시 보면 처음과 다르게 보입니다.)
       4) hr을 긋고 마지막 p: "© 2026 영화 기록 노트" — ©는 엔티티로!
       [완성 화면]
       목차 링크 2개 → 회색 300x200 이미지가 있는 카드 2개(이미지를 클릭하면
       위키백과가 새 탭으로 열림) → ▶ 접힘 영역(클릭할 때마다 접었다 폈다)
       → 가로줄 아래 © 문구. 인터넷이 없으면 이미지 대신 alt 텍스트가
       보입니다 — 그것도 alt가 제 역할을 하는 정상 동작입니다!
       [힌트] 01_HTML_01_개념코드 폴더의 섹션08 파일(목록), 섹션10 파일(details·summary),
             섹션13·14 파일(링크·앵커), 섹션15 파일(이미지)
  -->
  <h3>문제 7 — [도전] 영화 추천 페이지</h3>
  <!-- TODO: 여기에 목차 + 카드 2개 + details + 마무리 줄을 작성하세요 -->

</body>
