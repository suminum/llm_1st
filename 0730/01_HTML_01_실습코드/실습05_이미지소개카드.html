<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 실습 정답코드 — 실습 5. 이미지 포함 소개 카드 만들기 (HTML)
  PPT의 실습 1~6과 번호·소재가 동일합니다. 각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 실습 5. 이미지 포함 소개 카드 만들기</title>
</head>

<body>
  <h2>실습 5. 이미지 포함 소개 카드 만들기</h2>

  <!-- ── 실습 5: 이미지 포함 소개 카드 만들기 ──────────────── -->
  <!-- 케이스 A: 제품 소개 카드 -->
  <!-- Step 1: 외부 URL 이미지 삽입 (placeholder 이미지) / Step 2: alt·width·height 속성 -->
  <!-- Step 3: 이미지를 a 태그로 감싸 이미지 링크 완성 -->
  <a href="https://www.example.com" target="_blank" rel="noopener noreferrer">
    <img src="https://placehold.co/300x200?text=TUMBLER" alt="스테인리스 보온 텀블러 제품 사진" width="300" height="200">
  </a>
  <h3>보온 텀블러 500ml</h3>
  <p>12시간 보온·보냉이 되는 스테인리스 텀블러입니다.</p>
</body>
</html>
