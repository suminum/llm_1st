<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 실습 정답코드 — 실습 3. 카페 음료 문서 만들기 (HTML)
  PPT의 실습 1~6과 번호·소재가 동일합니다. 각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_01 기초와 텍스트 구조 — 실습 3. 카페 음료 문서 만들기</title>
</head>

<body>
  <h2>실습 3. 카페 음료 문서 만들기</h2>

  <!-- ── 실습 3: 카페 음료 문서 만들기 ─────────────────────── -->
  <!-- Step: 카페 이름은 h1(페이지당 하나), 메뉴 이름은 h2 -->
  <h1>카페 온도</h1>
  <h2>시그니처 음료 메뉴</h2>
  <!-- Step: 음료 리스트는 ul (최소 3개) -->
  <ul>
    <li><strong>아메리카노</strong>
      <!-- Step: ul의 자식으로 ol을 넣어 가격 표시 — 자식 목록은 반드시 li "안"에 -->
      <ol>
        <li>HOT 3,500원</li>
        <li>ICE 4,000원</li>
      </ol>
    </li>
    <li>카페라테
      <ol>
        <li>HOT 4,500원</li>
        <li>ICE 5,000원</li>
      </ol>
    </li>
    <!-- Step: 문자 꾸미기 태그 활용 — del(취소선), em(강조) -->
    <li><del>딸기 스무디</del> <em>(시즌 종료 — 6월까지만 판매)</em></li>
  </ul>
  <!-- Step: ul 아래에 수평 줄(hr) 추가, 그 아래에 각 음료 설명을 p로 -->
  <hr>
  <p><strong>아메리카노</strong>: 산미가 적은 원두를 사용해 <em>고소한 맛</em>이 특징입니다.</p>
  <p><strong>카페라테</strong>: 우유 거품을 두툼하게 올려 부드럽게 마실 수 있습니다.</p>
  <p>모든 음료는 텀블러 지참 시 500원 할인. &copy; 2026 카페 온도</p>
</body>
</html>
