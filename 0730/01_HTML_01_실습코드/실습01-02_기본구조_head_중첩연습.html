<!DOCTYPE html>
<!--
  01_HTML_01 HTML 기초와 텍스트 구조 실습 정답코드 — 실습 1·2. HTML 기본 구조 + head 채우기 + 중첩 연습 (HTML)
  PPT의 실습 1~6과 번호·소재가 동일합니다. 각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<!-- 실습 1 Step 1: DOCTYPE + html lang="ko" 선언 -->
<html lang="ko">

<head>
  <!-- 실습 1 Step 2: charset은 head의 첫 줄, title은 브라우저 탭 제목 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 실습 2 Step 1: title 내용을 더 구체적으로 변경 ("자기소개" → 아래처럼) -->
  <title>백엔드 개발자를 꿈꾸는 김학생의 소개 페이지</title>
</head>

<body>
  <h2>실습 1·2. HTML 기본 구조 + head 채우기 + 중첩 연습</h2>

  <!-- ── 실습 1·2: HTML 기본 구조 + head 채우기 + 중첩 연습 ── -->
  <!-- 케이스 A: 개인 소개 페이지 -->
  <!-- 실습 1 Step 3: body에 주석 1개 작성 — 지금 이 줄이 주석 -->
  <!-- 실습 1 Step 4: 브라우저로 열어 탭 제목 확인 -->
  <!-- 실습 2 Step 2: div > div > p > p 중첩 구조 -->
  <!-- 실습 2 Step 3: F12 → Elements 탭에서 부모·자식 관계 확인 -->
  <div>
    <div>
      <p>안녕하세요, 김학생입니다.</p>
      <p>취미는 자전거와 보드게임입니다. 중첩 구조(부모 div &gt; 자식 div &gt; p)를 개발자도구로 확인해 보세요.</p>
    </div>
  </div>
</body>
</html>
