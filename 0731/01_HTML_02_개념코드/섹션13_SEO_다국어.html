<!doctype html>
<!--
  01_HTML_02 테이블·폼·시맨틱·HTML 품질 개념코드 — 섹션 13. SEO·다국어 — head 설정과 lang (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  소재는 전부 일상적인 것으로 골랐습니다 — 태그에만 집중하기 위해서입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 섹션 13에서 다루는 SEO 설정 — title은 핵심 키워드 포함, description은 140자 이내 -->
    <title>HTML_02 테이블·폼·시맨틱 — 섹션 13. SEO·다국어 — head 설정과 lang</title>
    <meta
      name="description"
      content="테이블, 폼, 시맨틱 태그와 HTML 품질을 다루는 수업 코드"
    />
  </head>

  <body>
    <h2>섹션 13. SEO·다국어 — head 설정과 lang</h2>

    <!-- ── 섹션 13: SEO·다국어 — head 설정과 lang ─────────── -->
    <!-- [기본] 이 파일의 head 참고:
       <title>핵심 키워드 포함 제목</title>  -> 검색 결과의 제목으로 표시
       <meta name="description" content="..."> -> 검색 결과 제목 아래 설명 (140자 이내) -->
    <!-- [기본] html lang="ko": 문서 전체 언어 — 페이지 일부만 다른 언어면 span lang -->
    <p>
      제가 코드를 쓸 때 사용하는 편집기는
      <span lang="en">Visual Studio Code</span>입니다.
    </p>
    <!-- 접근성(a11y) 체크 4가지: 이미지 alt / 폼 label / 시맨틱 태그 / h 태그 계층 -->
  </body>
</html>
