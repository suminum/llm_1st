<!doctype html>
<!--
  01_HTML_02 테이블·폼·시맨틱·HTML 품질 개념코드 — 섹션 11. div — 의미 없는 블록 그룹핑 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  소재는 전부 일상적인 것으로 골랐습니다 — 태그에만 집중하기 위해서입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML_02 테이블·폼·시맨틱 — 섹션 11. div — 의미 없는 블록 그룹핑</title>
  </head>

  <body>
    <h2>섹션 11. div — 의미 없는 블록 그룹핑</h2>

    <!-- ── 섹션 11: div — 의미 없는 블록 그룹핑 ───────────── -->
    <!-- [기본] div(division): 여러 요소를 블록 단위로 묶는 범용 컨테이너 — 자체 표시는 없음 -->
    <div>
      <p>CSS 스타일 적용이나 JavaScript 요소 선택을 위한 묶음입니다.</p>
    </div>
    <!-- [다른 방법] span: 문장 "안"의 일부만 묶는 인라인 컨테이너 -->
    <!-- 예고: style 속성은 내일(CSS)부터 제대로 배움 — 오늘은 맛보기 -->
    <p>오늘 방문자 수는 <span style="color: blue">1,250명</span>입니다.</p>
    <!-- 실수: 모든 영역을 div로만 구성(div 남용)  // 의미 있는 영역은 시맨틱 태그(다음 섹션) 사용 -->
  </body>
</html>
