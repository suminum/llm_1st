<!doctype html>
<!--
  01_HTML_02 테이블·폼·시맨틱·HTML 품질 개념코드 — 섹션 9. label과 for — 입력 요소 이름표 (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  소재는 전부 일상적인 것으로 골랐습니다 — 태그에만 집중하기 위해서입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML_02 테이블·폼·시맨틱 — 섹션 9. label과 for — 입력 요소 이름표</title>
  </head>

  <body>
    <h2>섹션 9. label과 for — 입력 요소 이름표</h2>

    <!-- ── 섹션 9: label과 for — 입력 요소 이름표 ─────────── -->
    <!-- [기본] label의 for와 input의 id를 같은 값으로 연결 — 글자를 클릭해도 입력칸에 포커스 -->
    <label for="uname">사용자명</label>
    <input type="text" id="uname" name="username" />
    <br />
    <!-- [다른 방법] label로 input을 감싸면 for·id 없이 연결됨 -->
    <label>이름 <input type="text" name="name" /></label>
    <!-- label은 스크린 리더가 폼 필드의 역할을 안내하는 근거 — 접근성 필수 -->
    <!-- 실수: <label for="user"> + <input id="uname">  // for와 id가 다르면 연결 안 됨 -->
  </body>
</html>
