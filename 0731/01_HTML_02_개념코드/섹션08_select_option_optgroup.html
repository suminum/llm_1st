<!doctype html>
<!--
  01_HTML_02 테이블·폼·시맨틱·HTML 품질 개념코드 — 섹션 8. 선택 메뉴 select — option·optgroup (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  소재는 전부 일상적인 것으로 골랐습니다 — 태그에만 집중하기 위해서입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML_02 테이블·폼·시맨틱 — 섹션 8. 선택 메뉴 select — option·optgroup</title>
  </head>

  <body>
    <h2>섹션 8. 선택 메뉴 select — option·optgroup</h2>

    <!-- ── 섹션 8: 선택 메뉴 select — option·optgroup ─────── -->
    <!-- [기본] select 안에 option — 드롭다운 메뉴. selected로 기본값, disabled로 선택 불가 -->
    <select name="course">
      <!-- [다른 방법] optgroup으로 선택지를 묶어 소제목 표시 -->
      <optgroup label="프론트엔드">
        <option value="html" selected>HTML</option>
        <option value="css">CSS</option>
      </optgroup>
      <optgroup label="백엔드">
        <option value="node">Node.js</option>
        <option value="py" disabled>Python (준비 중)</option>
      </optgroup>
    </select>
    <!-- 표시: 클릭하면 소제목으로 묶인 드롭다운 목록이 펼쳐짐 -->
  </body>
</html>
