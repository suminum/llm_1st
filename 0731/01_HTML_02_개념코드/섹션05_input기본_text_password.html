<!doctype html>
<!--
  01_HTML_02 테이블·폼·시맨틱·HTML 품질 개념코드 — 섹션 5. input 기본 — text·password (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  소재는 전부 일상적인 것으로 골랐습니다 — 태그에만 집중하기 위해서입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML_02 테이블·폼·시맨틱 — 섹션 5. input 기본 — text·password</title>
  </head>

  <body>
    <h2>섹션 5. input 기본 — text·password</h2>

    <!-- ── 섹션 5: input 기본 — text·password ─────────────── -->
    <!-- [기본] type 속성으로 입력 형태 결정 — text/password/email/checkbox/radio/date/file/range 등 -->
    <input type="text" placeholder="아이디" />
    <input type="password" placeholder="비밀번호" />
    <!-- 표시: 비밀번호 칸은 입력값이 ●●● 로 가려짐 -->
    <!-- 실수: type="pasword" 처럼 오타  // 모르는 type은 그냥 text로 동작 — 안 가려짐 -->
  </body>
</html>
