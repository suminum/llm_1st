<!doctype html>
<!--
  01_HTML_02 테이블·폼·시맨틱·HTML 품질 개념코드 — 섹션 4. 폼 form — action·method (HTML)
  강사·교육생이 위에서부터 한 줄씩 따라 칩니다.
  각 개념: [기본] -> [축약/다른 방법] -> [실수] 순서
  실수 코드는 주석 처리하고 "실수:"로 표시합니다.
  소재는 전부 일상적인 것으로 골랐습니다 — 태그에만 집중하기 위해서입니다.
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML_02 테이블·폼·시맨틱 — 섹션 4. 폼 form — action·method</title>
  </head>

  <body>
    <h2>섹션 4. 폼 form — action·method</h2>

    <!-- ── 섹션 4: 폼 form — action·method ────────────────── -->
    <!-- [기본] 폼은 사용자 입력을 서버로 전송 — action: 전송 URL, method: get 또는 post -->
    <form action="/api/signup" method="post">
      <!-- 입력 요소들이 여기에 들어갑니다 -->
      <button type="submit">제출</button>
    </form>
    <!-- 로그인·회원가입·검색창 등 사용자가 "입력"하는 곳은 모두 폼 -->
    <!-- 실수: input을 form 밖에 배치  // 제출해도 그 값은 전송되지 않음 -->
  </body>
</html>
