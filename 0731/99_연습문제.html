       수업의 제1규칙: "행 먼저, 칸 나중." 계란판을 한 줄씩 조립하듯,
       tr(행)을 먼저 열고 그 안에 th·td(칸)를 끼웁니다.
       [요구사항]
       1) table을 만들고 테두리가 보이게 border="1"을 지정합니다.
       2) 1행: 제목 칸 th 3개 — 날짜 / 내용 / 금액
       3) 2~4행: 일반 칸 td로 데이터 3줄을 넣습니다.
          8월 3일 · 점심 도시락 · 7,000원
          8월 4일 · 교통비 · 2,800원
          8월 5일 · 카페 아메리카노 · 4,500원
       * 칸(th·td)은 반드시 행(tr) "안"에 씁니다. 행을 먼저 만들고, 칸은 그다음!
       * 열 개수는 따로 선언하지 않습니다 — 각 행에 넣은 칸의 개수가 곧 열 개수입니다.
       [완성 화면]
       테두리 있는 4행 3열 표. 첫 행만 굵은 글씨 + 가운데 정렬(th의 기본 모양).
       [힌트] 개념코드 섹션 1(테이블 기본 구조), 섹션 2(border 속성)

    <!-- ═══════════════════════════════════════════════

       4) 줄을 바꾸고 button type="submit" "예약 조회"를 만듭니다.

       [힌트] 개념코드 섹션 4(form), 섹션 5(input text·password), 섹션 9(label과 for)

       수업의 지하철 좌석 비유: 한 사람이 두 자리를 차지하면
       그 줄에 앉을 수 있는 사람이 한 명 줄어듭니다.
       연강(1~2교시와 3~4교시가 같은 강의실)이 바로 rowspan 자리입니다.
       [요구사항] border="1" 표를 다음 구조로 만듭니다.
       1) 1행: th "구분"에 colspan="2"(가로 두 칸 병합) + th "과목" + th "강의실"

       3) 3행: td "3~4교시" + td "HTML 실습"  ← 위에서 병합한 칸만큼 칸 수가 줄어듭니다!

    <!-- ═══════════════════════════════════════════════
       문제 4. 피자 주문 폼  (응용)
       ═══════════════════════════════════════════════
       수업의 판단 기준이 그대로 문제입니다:
         · 피자 "사이즈"는 하나만 골라야 함 → radio
         · 피자 "토핑"은 여러 개 골라도 말이 됨 → checkbox
       그리고 radio는 같은 name이라야 한 조가 됩니다("같은 투표함").
       [요구사항] form(action="/api/order", method="post") 안에:
       1) label "주문자 이름" + input type="text" — for/id "od-name",
          required와 placeholder "예: 김한결"을 지정합니다.
       2) label "받을 날짜" + input type="date" — for/id "od-date"
       3) "크기:" 텍스트 뒤에 radio 3개 — 셋 다 name="size"로 같게!
          "라지"(value="L", checked) / "미디엄"(value="M") / "스몰"(value="S")
          각 radio는 label로 "감싸는 방식"으로 씁니다.
       4) "추가 토핑:" 텍스트 뒤에 checkbox 4개 — name="topping"으로 통일.
          "페퍼로니"(value="pepperoni", checked) / "올리브"(value="olive") /
          "파인애플"(value="pineapple") / "치즈크러스트"(value="cheese")
          역시 label로 감쌉니다.
       5) 항목 사이 줄 바꿈은 br, 마지막에 button type="submit" "주문하기".
       [완성 화면]
       이름 칸과 달력 아이콘 있는 날짜 칸, 크기는 라지가 선택된 채 하나만
       선택 가능, 토핑은 페퍼로니가 선택된 채 여러 개 선택 가능.
       이름을 비우고 주문하면 브라우저가 경고 풍선을 띄웁니다(required).
       [힌트] 개념코드 섹션 6(placeholder·required), 섹션 7(checkbox·radio·date),
             섹션 9(label — 감싸는 방식)
             크기가 여러 개 동시에 눌리면 name이 서로 다른 것입니다!

    <!-- ═══════════════════════════════════════════════
       문제 5. 과제 제출 폼  (응용)
       ═══════════════════════════════════════════════
       선택지가 많으면 radio 대신 select(드롭다운), 관련 입력끼리는
       fieldset으로 묶어 테두리 상자를 만듭니다.
       [요구사항] form(action="/api/assignment", method="post") 안에서
       전체를 fieldset으로 묶고:
       1) legend "과제 제출"
       2) label "과목 선택" + select(name="subject") — for/id "as-subject"
          · optgroup label="전공": option 웹 프로그래밍(value="web", selected) /
            데이터베이스(value="db")
          · optgroup label="교양": option 글쓰기(value="writing") /
            진로 탐색(value="career", disabled — 제출 기간 종료)
       3) textarea name="comment" rows="4"
          placeholder "조교에게 남길 말을 적어 주세요"
       4) label "과제 파일" + input type="file" — for/id "as-file",

       5) button type="submit" "제출" + button type="reset" "다시 쓰기"

       여러 줄 입력칸과 파일 선택 버튼이 보이고, "다시 쓰기"를 누르면 전부 초기화.
       [힌트] 개념코드 섹션 8(select·option·optgroup),
             섹션 10(textarea·fieldset·legend·button·file)
             textarea의 기본값은 value 속성이 아니라 태그 "사이"의 내용!

    <!-- ═══════════════════════════════════════════════
       문제 6. 시맨틱 골격 — 개인 블로그  (응용)
       ═══════════════════════════════════════════════
       article의 판단 기준: "잘라내서 다른 페이지에 붙여도 혼자 말이 되면 article."
       블로그 글 하나하나가 정확히 그렇습니다.

       [힌트] 개념코드 섹션 12(시맨틱 태그), 2일차 개념코드 섹션 12(엔티티)

          · label + input type="email" "이메일" — for/id "st-email", required,
            placeholder "예: hello@example.com"
          · label + input type="date" "참여 가능 시작일" — for/id "st-date"
          · "참여 요일:" radio — name="day", "평일 저녁"(checked) / "주말 오전",

          [fieldset 2 — legend "학습 정보"]
          · label + select "관심 분야" — for/id "st-field", name="field",
            option 프론트엔드(selected) / 백엔드 / 디자인
          · "배운 적 있는 것:" checkbox 3개 — name="learned",
            HTML / CSS / JavaScript, label로 감싸기
          · label "하고 싶은 말" + textarea — for/id "st-note", rows="3"
          · label "포트폴리오 파일" + input type="file" — for/id "st-file",
            accept=".pdf,image/*"
          [버튼] button type="submit" "신청" + button type="reset" "초기화"
       3) 두 번째 section — h2 "모임 시간" + border="1" 표:
          · 1행: th "스터디 모임 시간"에 colspan="3"
