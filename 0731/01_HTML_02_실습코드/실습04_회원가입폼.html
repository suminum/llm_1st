<!DOCTYPE html>
<!--
  01_HTML_02 테이블·폼 실습 정답코드 — 실습 4. 회원가입 폼 만들기 (HTML)
  PPT의 실습 1~5와 번호·소재가 동일합니다. 각 실습의 Step별 정답을 주석과 함께 정리합니다.
-->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML_02 테이블·폼 — 실습 4. 회원가입 폼 만들기</title>
</head>

<body>
  <h2>실습 4. 회원가입 폼 만들기</h2>

  <!-- ── 실습 4: 회원가입 폼 만들기 ────────────────────────── -->
  <!-- 케이스 A: 서비스 신규 사용자 등록 폼 -->
  <h3>회원가입</h3>
  <form method="post" action="/join">
    <!-- Step 1: 기본 정보 — 이름·이메일·비밀번호·생년월일 (전부 required) -->
    <label for="join-name">이름</label>
    <input type="text" id="join-name" name="name" required>
    <br>
    <label for="join-email">이메일</label>
    <input type="email" id="join-email" name="email" required>
    <br>
    <label for="join-pw">비밀번호</label>
    <input type="password" id="join-pw" name="pw" required>
    <br>
    <!-- 생년월일: input type="date" — 클릭하면 달력이 뜸 -->
    <label for="join-birth">생년월일</label>
    <input type="date" id="join-birth" name="birth" required>
    <br>

    <!-- Step 2: 소속 select 드롭다운 (option 3개 이상, 첫 option은 안내 텍스트) -->
    <label for="join-dept">소속</label>
    <select id="join-dept" name="dept">
      <option value="">-- 선택하세요 --</option>
      <option value="d1">개발팀</option>
      <option value="d2">기획팀</option>
      <option value="d3">디자인팀</option>
    </select>
    <br>
    <!-- 역할: radio 3개 — 같은 name이라 하나만 선택됨 -->
    역할:
    <input type="radio" name="role" value="op"> 운영자
    <input type="radio" name="role" value="member"> 일반 회원
    <input type="radio" name="role" value="guest"> 게스트
    <br>

    <!-- Step 3: 관심 기능 checkbox 3개 이상 (복수 선택) -->
    관심 기능:
    <input type="checkbox" name="feat" value="f1"> 게시판
    <input type="checkbox" name="feat" value="f2"> 채팅
    <input type="checkbox" name="feat" value="f3"> 알림
    <input type="checkbox" name="feat" value="f4"> 통계
    <br>
    <!-- 비고: textarea (닫는 태그 있음 — 기본값은 태그 사이에) + 등록·취소 button 2개 -->
    <label for="join-note">비고</label>
    <br>
    <textarea id="join-note" name="note" rows="3" placeholder="추가로 남길 내용을 적어 주세요"></textarea>
    <br>
    <button type="submit">등록</button>
    <button type="reset">취소</button>
  </form>
  <!-- 체크포인트: ①radio 하나만 선택되는가 ②checkbox 복수 선택되는가 ③select 첫 option이 안내 텍스트인가 ④label 연결 -->
</body>
</html>
