<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>14단원 개념02 - localStorage</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      input[type="text"] {
        padding: 6px 8px;
        font-size: 15px;
        width: 220px;
      }
      button {
        padding: 6px 12px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 8px;
      }
      li {
        background: #fff;
        border: 1px solid #ccc;
        padding: 8px 12px;
        margin: 4px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>개념 02 — localStorage (새로고침해도 남기기)</h1>

    <p class="guide">
      브라우저로 열고 <strong>F12 → Console</strong> 을 함께 보세요.
      <strong>아래 할 일을 몇 개 넣은 뒤 F5 로 새로고침해 보세요.</strong> 그대로 남아 있습니다.
      그게 이 파일의 핵심입니다.

      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 이 파일 위쪽의
      <code>&lt;style&gt;</code> 과 <code>&lt;body&gt;</code> 는 화면 모양을 만드는 코드입니다.
      이 자료에서는 가르치지 않습니다. <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>새로고침해도 남는 할 일 목록</h3>
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" />
      <button id="addBtn">추가</button>
      <button id="clearBtn">전부 지우기</button>
      <ul id="todoList"></ul>
      <div class="output" id="status">항목 0개</div>
    </div>

    <script>
      // ============================================================
      // 14단원 · 개념 02 — localStorage
      // ------------------------------------------------------------
      // 실행: 브라우저로 열고 F12 → Console 탭
      // ============================================================
      //
      // 13단원에서 만든 할 일 목록에는 큰 구멍이 하나 있었습니다.
      // 새로고침하면 전부 사라집니다.
      //
      // 지금까지 만든 변수는 전부 '잠깐 쓰는 것' 이었습니다.
      // 페이지를 닫으면 같이 없어집니다.
      //
      // localStorage 는 브라우저가 컴퓨터에 남겨 주는 작은 저장소입니다.
      // 여기 넣어 두면 페이지를 닫았다 열어도, 컴퓨터를 껐다 켜도 남아 있습니다.
      //
      //     localStorage.setItem("이름", "값")   저장
      //     localStorage.getItem("이름")         꺼내기
      //     localStorage.removeItem("이름")      하나 지우기
      //     localStorage.clear()                 전부 지우기
      //
      // 07단원의 객체와 비슷합니다. 이름표를 붙여 값을 넣고 이름으로 꺼냅니다.

      // 아래 예제의 결과를 매번 같게 만들려고, 예제에서 쓸 이름만 먼저 지웁니다.
      // ★ localStorage.clear() 로 통째로 지우면 안 됩니다.
      //   섹션 5에서 저장한 할 일 목록까지 같이 날아가서
      //   "새로고침해도 남는다" 는 것을 확인할 수 없게 됩니다.
      ["nickname", "count", "badArray", "badObject", "todos", "temp"].forEach((key) => {
        localStorage.removeItem(key);
      });

      // ── 섹션 1: 저장하고 꺼내기 ──

      localStorage.setItem("nickname", "김민준");

      const saved = localStorage.getItem("nickname");
      console.log(saved);
      // 콘솔: 김민준

      // 없는 이름을 꺼내면 null 입니다. 에러가 아닙니다.
      console.log(localStorage.getItem("없는이름"));
      // 콘솔: null

      // 그래서 꺼낸 값은 쓰기 전에 확인해야 합니다. (03단원)
      const nickname = localStorage.getItem("nickname") || "손님";
      console.log(nickname);
      // 콘솔: 김민준

      // ✏️ 직접 해보기 1 — 자기 이름을 "myName" 이라는 이름으로 저장하고 꺼내 보세요.

      // ── 섹션 2: 저장되는 건 오직 문자열 ──

      // 이게 localStorage 의 가장 큰 함정입니다.
      localStorage.setItem("count", 5);

      const count = localStorage.getItem("count");
      console.log(count, typeof count);
      // 콘솔: 5 string
      // 숫자 5를 넣었는데 문자열 "5" 가 나왔습니다!

      console.log(count + 1);
      // 콘솔: 51
      // 01단원에서 본 그 함정입니다. 이어붙이기가 되어 버립니다.

      console.log(Number(count) + 1);
      // 콘솔: 6
      // 꺼낸 뒤 Number 로 바꿔야 계산이 됩니다.

      // 객체나 배열을 그냥 넣으면 더 심합니다.
      localStorage.setItem("badArray", [1, 2, 3]);
      console.log(localStorage.getItem("badArray"));
      // 콘솔: 1,2,3
      // 배열이 아니라 글자가 되어 버렸습니다.

      localStorage.setItem("badObject", { name: "김민준" });
      console.log(localStorage.getItem("badObject"));
      // 콘솔: [object Object]
      // 내용이 통째로 사라졌습니다. 이건 되돌릴 방법이 없습니다.

      // ✏️ 직접 해보기 2 — localStorage 에 true 를 저장했다가 꺼내서
      //                    typeof 로 자료형을 확인해 보세요.

      // ── 섹션 3: 객체·배열은 JSON 으로 ──

      // 12단원에서 JSON 을 배웠습니다. "데이터를 글자로 적는 형식" 이었죠.
      // 그때는 서버가 준 글자를 객체로 되돌렸습니다(res.json()).
      // 여기서는 반대로, 내 객체를 글자로 바꿔서 저장합니다.
      //
      //     JSON.stringify(값)   객체·배열 → 글자
      //     JSON.parse(글자)     글자 → 객체·배열

      const todos = [
        { id: 1, text: "장보기", done: false },
        { id: 2, text: "설거지", done: true },
      ];

      const asText = JSON.stringify(todos);
      console.log(asText);
      // 콘솔: [{"id":1,"text":"장보기","done":false},{"id":2,"text":"설거지","done":true}]
      console.log(typeof asText);
      // 콘솔: string

      localStorage.setItem("todos", asText);

      // 꺼낼 때는 반대로 되돌립니다.
      const back = JSON.parse(localStorage.getItem("todos"));
      console.log(back.length);
      // 콘솔: 2
      console.log(back[0].text);
      // 콘솔: 장보기
      console.log(Array.isArray(back));
      // 콘솔: true
      // 진짜 배열로 되돌아왔습니다. map, filter 를 그대로 쓸 수 있습니다.

      // 저장할 때 stringify, 꺼낼 때 parse. 이 한 쌍을 짝으로 외우세요.

      // ✏️ 직접 해보기 3 — { name: "이서연", age: 22 } 를 저장했다가
      //                    꺼내서 name 만 콘솔에 찍어 보세요.

      // ── 섹션 4: 지우기 ──

      localStorage.setItem("temp", "잠깐 쓸 값");
      console.log(localStorage.getItem("temp"));
      // 콘솔: 잠깐 쓸 값

      localStorage.removeItem("temp");
      console.log(localStorage.getItem("temp"));
      // 콘솔: null

      // 몇 개 들어 있는지는 localStorage.length 로 볼 수 있습니다.
      // 다만 이 파일은 섹션 5에서 할 일 목록도 저장하기 때문에
      // 여러분 화면에서는 숫자가 그때그때 달라집니다. 그래서 여기에 적어 두지 않았습니다.
      //
      //     console.log(localStorage.length);
      //
      // 직접 찍어 보세요. 지금은 nickname, count, badArray, badObject, todos 가
      // 들어 있으니 최소 5개입니다.

      // localStorage.clear() 는 전부 지웁니다. 되돌릴 수 없으니 조심하세요.
      // 그래서 이 파일 맨 위에서도 clear() 대신 이름을 하나씩 지웠습니다.

      // [직접 보기] F12 → Application 탭 → 왼쪽 Local Storage 를 눌러 보세요.
      //             방금 저장한 것들이 표로 보입니다. 여기서 직접 지울 수도 있습니다.

      // ✏️ 직접 해보기 4 — localStorage.length 를 찍어 보고,
      //                    badArray 와 badObject 를 removeItem 으로 지운 뒤
      //                    다시 찍어서 2 줄었는지 확인해 보세요.

      // ── 섹션 5: 진짜로 써 보기 ──

      // 아래가 13단원 할 일 목록에 저장 기능을 붙인 것입니다.
      // 새로 배운 것은 단 두 줄뿐입니다. save() 와 load() 를 보세요.

      const todoInput = document.querySelector("#todoInput");
      const todoList = document.querySelector("#todoList");
      const status = document.querySelector("#status");

      const KEY = "myTodos"; // 저장할 때 쓸 이름. 상수로 빼 두면 오타가 안 납니다.

      // [저장] 배열을 글자로 바꿔서 넣는다
      function save(list) {
        localStorage.setItem(KEY, JSON.stringify(list));
      }

      // [불러오기] 글자를 배열로 되돌린다. 처음 열었으면 빈 배열
      function load() {
        const text = localStorage.getItem(KEY);
        if (!text) {
          return []; // 저장된 게 없으면 빈 배열로 시작
        }
        return JSON.parse(text);
      }

      let myTodos = load();

      function render() {
        todoList.innerHTML = "";

        myTodos.forEach((text, index) => {
          const li = document.createElement("li");

          const span = document.createElement("span");
          span.textContent = text;

          const btn = document.createElement("button");
          btn.textContent = "삭제";
          btn.dataset.index = index;
          btn.classList.add("deleteBtn");

          li.appendChild(span);
          li.appendChild(btn);
          todoList.appendChild(li);
        });

        status.textContent = `항목 ${myTodos.length}개`;
      }

      function addTodo() {
        const text = todoInput.value.trim();
        if (!text) {
          return;
        }

        myTodos = [...myTodos, text];
        save(myTodos); // ★ 배열을 바꿨으면 저장도 같이
        render();

        todoInput.value = "";
        todoInput.focus();
        console.log("추가 후 저장됨:", myTodos.length, "개");
      }

      document.querySelector("#addBtn").addEventListener("click", addTodo);

      todoInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          addTodo();
        }
      });

      // 삭제도 위임으로 (11단원 개념05)
      todoList.addEventListener("click", (e) => {
        if (!e.target.classList.contains("deleteBtn")) {
          return;
        }
        const index = Number(e.target.dataset.index);
        myTodos = myTodos.filter((_, i) => i !== index);
        save(myTodos); // ★ 여기도 저장
        render();
      });

      document.querySelector("#clearBtn").addEventListener("click", () => {
        myTodos = [];
        save(myTodos);
        render();
        console.log("전부 지웠습니다");
      });

      render();
      // 화면: 처음에는 비어 있습니다. 몇 개 넣고 F5 를 눌러 보세요. 그대로 남아 있습니다.

      // 규칙은 하나뿐입니다.
      //     "배열을 바꿨으면 곧바로 save() 를 부른다"
      // 이걸 한 군데라도 빠뜨리면 그 변경만 사라져서 원인을 찾기 어렵습니다.

      // ✏️ 직접 해보기 5 — 할 일을 두세 개 넣고 F5 로 새로고침해 보세요.
      //                    그다음 브라우저를 완전히 닫았다가 다시 열어 보세요.

      // ── 섹션 6: 자주 하는 실수 ──

      // [실수 1] 꺼낸 값을 그대로 계산에 씀
      // const n = localStorage.getItem("count") + 1;   → "51"
      // 실수: 전부 문자열입니다. Number 로 바꾸고 쓰세요. (섹션 2)

      // [실수 2] 객체를 stringify 없이 저장
      // localStorage.setItem("user", { name: "김민준" });   → "[object Object]"
      // 실수: 내용이 통째로 사라집니다. 반드시 JSON.stringify 로 감싸세요.

      // [실수 3] parse 를 빼먹음
      // const list = localStorage.getItem("todos");
      // list.forEach(...)   → TypeError: list.forEach is not a function
      // 실수: 꺼낸 것은 아직 글자입니다. JSON.parse 로 되돌려야 배열이 됩니다.

      // [실수 4] 저장된 게 없을 때를 생각 안 함
      // const list = JSON.parse(localStorage.getItem("없는키"));
      // → null 이 나옵니다. JSON.parse(null) 은 에러는 아니지만 null 입니다.
      //   그다음 줄에서 null.forEach 로 터집니다. load() 처럼 미리 걸러 주세요.

      // [실수 5] 바꿔 놓고 저장을 안 함
      // myTodos.push("새 항목");  render();     ← 화면은 바뀌지만
      // 새로고침하면 사라집니다. save() 를 안 불렀기 때문입니다.

      // ── 정리 ──

      // 1. localStorage 는 새로고침·재접속에도 남는 저장소다.
      // 2. setItem(이름, 값) / getItem(이름) / removeItem(이름) / clear()
      // 3. 없는 이름을 꺼내면 null. 쓰기 전에 확인한다.
      // 4. 저장되는 건 오직 문자열. 숫자는 Number 로 되돌린다.
      // 5. 객체·배열은 JSON.stringify 로 넣고 JSON.parse 로 꺼낸다.
      // 6. 데이터를 바꿨으면 곧바로 저장한다.

      // ============================================================
      // 직접 해보기 정답
      // ============================================================
      //
      // 1) localStorage.setItem("myName", "김민준");
      //    console.log(localStorage.getItem("myName"));
      //    // 콘솔: 김민준
      //
      // 2) localStorage.setItem("flag", true);
      //    const flag = localStorage.getItem("flag");
      //    console.log(flag, typeof flag);
      //    // 콘솔: true string
      //    → true 로 보이지만 문자열입니다. if (flag) 는 항상 true 가 되어 버립니다.
      //      ("false" 라는 글자도 빈 문자열이 아니라서 true 입니다. 주의하세요)
      //
      // 3) localStorage.setItem("user", JSON.stringify({ name: "이서연", age: 22 }));
      //    const user = JSON.parse(localStorage.getItem("user"));
      //    console.log(user.name);
      //    // 콘솔: 이서연
      //
      // 4) console.log(localStorage.length);
      //    localStorage.removeItem("badArray");
      //    localStorage.removeItem("badObject");
      //    console.log(localStorage.length);
      //    → 두 번째 숫자가 첫 번째보다 정확히 2 작으면 맞습니다.
      //      숫자 자체는 할 일을 몇 개 저장해 뒀는지에 따라 달라집니다.
      //
      // 5) 넣은 항목이 그대로 보이면 성공입니다.
      //    브라우저를 닫았다 열어도 남아 있습니다. 그게 localStorage 입니다.
    </script>
  </body>
</html>
