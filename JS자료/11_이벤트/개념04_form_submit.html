<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>11단원 개념04 - form submit</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="number"] {
        padding: 6px 8px;
        font-size: 15px;
        width: 220px;
      }
      button {
        padding: 8px 16px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
      }
      .error {
        color: #c00;
        font-weight: bold;
        min-height: 24px;
      }
      #todoList {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px 10px 10px 30px;
        margin-top: 8px;
        min-height: 30px;
      }
    </style>
  </head>
  <body>
    <h1>개념 04 — form submit</h1>

    <p class="guide">
      브라우저로 열고 입력한 뒤 <strong>추가</strong> 버튼을 누르거나
      <strong>Enter</strong> 를 쳐 보세요. <strong>F12 → Console</strong> 도
      함께 보세요.

      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 이 파일 위쪽의
      <code>&lt;style&gt;</code> 과 <code>&lt;body&gt;</code> 는 화면 모양을
      만드는 코드입니다. 이 자료에서는 가르치지 않습니다.
      <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>① 할 일 추가하기</h3>
      <form id="todoForm">
        <label for="todoInput">할 일</label>
        <input type="text" id="todoInput" placeholder="예: 장보기" />
        <button type="submit">추가</button>
        <button type="button" id="todoreset">리셋 버튼</button>
        <div class="error" id="errorMsg"></div>
      </form>
      <ul id="todoList"></ul>
    </div>

    <script src="./연습지.js"></script>
  </body>
</html>
