<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>10단원 개념02 - 내용 바꾸기</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo p {
        background: #fff;
        padding: 8px;
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <h1>개념 02 — 내용 바꾸기</h1>

    <p class="guide">
      브라우저로 열고 <strong>F12 → Console</strong> 을 함께 보세요. 화면의 글자가 이미
      바뀌어 있을 겁니다. 코드가 실행된 결과입니다.
    
      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 이 파일 위쪽의
      <code>&lt;style&gt;</code> 과 <code>&lt;body&gt;</code> 는 화면 모양을 만드는 코드입니다.
      이 자료에서는 가르치지 않습니다. <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <p id="target1">이 글자는 바뀝니다</p>
      <p id="target2">이 글자도 바뀝니다</p>
      <p id="numberTarget">여기에는 숫자가 들어갑니다</p>
      <p id="target3">여기에는 태그가 들어갑니다</p>
      <p id="target4">여기에도 태그를 넣어 봅니다</p>
      <ul id="menuList"></ul>
      <p id="mixedTarget">
        보이는 글자<span style="display: none"> 숨은 글자</span>
      </p>
    </div>

    <script>
      // ============================================================
      // 10단원 · 개념 02 — 내용 바꾸기
      // ------------------------------------------------------------
      // 실행: 이 파일을 브라우저로 열고 F12 → Console 탭
      // ============================================================
      //
      // 요소를 골랐으니 이제 바꿔 봅니다.
      //
      //     요소.textContent = "글자"   글자만 넣기 (안전)
      //     요소.innerHTML  = "<b>태그</b>"  태그까지 넣기 (주의)

      // ── 섹션 1: textContent — 글자 읽고 쓰기 ──

      const target1 = document.querySelector("#target1");

      // 읽기
      console.log(target1.textContent);
      // 콘솔: 이 글자는 바뀝니다

      // 쓰기 — = 로 값을 넣으면 화면이 바로 바뀝니다
      target1.textContent = "자바스크립트가 바꾼 글자";
      // 화면: "이 글자는 바뀝니다" 가 "자바스크립트가 바꾼 글자" 로 바뀝니다

      console.log(target1.textContent);
      // 콘솔: 자바스크립트가 바꾼 글자

      // 변수를 넣을 수도 있습니다. 08단원까지 배운 모든 게 여기로 연결됩니다.
      const userName = "김민준";
      const target2 = document.querySelector("#target2");
      target2.textContent = `${userName}님, 안녕하세요!`;
      // 화면: 김민준님, 안녕하세요!

      // ✏️ 직접 해보기 1 — target1 의 글자를 자기 이름으로 바꿔 보세요.

      // ── 섹션 2: 숫자를 넣으면 글자로 바뀐다 ──

      const numberTarget = document.querySelector("#numberTarget");
      const count = 5;

      numberTarget.textContent = count;
      // 화면: "여기에는 숫자가 들어갑니다" 가 "5" 로 바뀝니다

      console.log(numberTarget.textContent);
      // 콘솔: 5
      console.log(typeof numberTarget.textContent);
      // 콘솔: string

      // 넣을 때는 숫자였지만 꺼내면 문자열입니다.
      // 화면에 보이는 것은 전부 글자이기 때문입니다.
      //
      // 그래서 화면에서 읽은 값으로 계산하려면 Number( ) 가 필요합니다. (01단원)
      console.log(numberTarget.textContent + 1);
      // 콘솔: 51
      console.log(Number(numberTarget.textContent) + 1);
      // 콘솔: 6

      // 이 함정은 개념05(입력값 읽기)에서 다시 만납니다.

      // ✏️ 직접 해보기 2 — numberTarget 에 숫자 10 을 넣은 다음,
      //                   그 값에 5 를 더한 결과를 콘솔에 찍어 보세요. (15 가 나와야 합니다)

      // ── 섹션 3: innerHTML — 태그까지 넣기 ──

      const target3 = document.querySelector("#target3");

      // textContent 로 태그를 넣으면 글자 그대로 보입니다.
      target3.textContent = "<strong>굵게</strong>";
      // 화면: <strong>굵게</strong>   ← 태그가 글자로 보입니다

      // innerHTML 로 넣으면 태그로 해석됩니다.
      const target4 = document.querySelector("#target4");
      target4.innerHTML = "<strong>굵게</strong> 그리고 <em>기울임</em>";
      // 화면: 굵게 그리고 기울임   ← 실제로 굵고 기울어져 보입니다

      // 읽을 때도 다릅니다.
      console.log(target4.innerHTML);
      // 콘솔: <strong>굵게</strong> 그리고 <em>기울임</em>
      console.log(target4.textContent);
      // 콘솔: 굵게 그리고 기울임
      // textContent 는 태그를 빼고 글자만 줍니다.

      // ✏️ 직접 해보기 3 — target3 에 innerHTML 로 <em>기울임</em> 을 넣어 보세요.

      // ── 섹션 4: 목록 만들기 — 08·09단원과 이어지는 부분 ──

      const menu = [
        { name: "아메리카노", price: 4000 },
        { name: "라떼", price: 4500 },
        { name: "케이크", price: 6000 },
      ];

      // map 으로 태그 문자열을 만들고 join 으로 붙입니다. (08단원 개념03)
      const html = menu.map((item) => `<li>${item.name} — ${item.price}원</li>`).join("");

      console.log(html);
      // 콘솔: <li>아메리카노 — 4000원</li><li>라떼 — 4500원</li><li>케이크 — 6000원</li>

      document.querySelector("#menuList").innerHTML = html;
      // 화면: 메뉴 세 줄이 목록으로 나타납니다

      // 이 패턴(배열 → map → join → innerHTML)이 화면 만들기의 기본입니다.
      // React 를 배우면 이 과정을 라이브러리가 대신해 줍니다.

      // join("") 을 빠뜨리면 어떻게 될까요?
      console.log(menu.map((item) => `<li>${item.name}</li>`));
      // 콘솔: ['<li>아메리카노</li>', '<li>라떼</li>', '<li>케이크</li>']
      // 배열을 그대로 innerHTML 에 넣으면 쉼표가 화면에 보입니다.

      // ✏️ 직접 해보기 4 — 위 menu 에서 이름만 목록으로 만들어 넣어 보세요.

      // ── 섹션 5: 언제 textContent, 언제 innerHTML ──

      // 기본은 textContent 입니다. 이유는 안전 때문입니다.
      //
      // 사용자가 입력한 글을 그대로 innerHTML 에 넣으면,
      // 누군가 <script> 나 이상한 태그를 적어 넣었을 때 그게 실제로 실행됩니다.
      // 이런 공격을 XSS 라고 합니다.

      const userInput = "<img src=x onerror=\"alert('공격')\">";
      console.log("사용자가 이런 글을 입력했다고 해 봅시다:", userInput);
      // 콘솔: 사용자가 이런 글을 입력했다고 해 봅시다: <img src=x onerror="alert('공격')">

      // textContent 로 넣으면 그냥 글자로 보입니다. 안전합니다.
      // target1.textContent = userInput;

      // innerHTML 로 넣으면 태그로 해석되어 실행됩니다. 위험합니다.
      // target1.innerHTML = userInput;   ← 이렇게 쓰지 마세요

      console.log("사용자 입력을 innerHTML 에 바로 넣지 말 것");
      // 콘솔: 사용자 입력을 innerHTML 에 바로 넣지 말 것

      // 정리:
      //   글자만 넣는다              → textContent  (기본)
      //   내가 만든 태그를 넣는다     → innerHTML
      //   사용자가 쓴 글을 넣는다     → 반드시 textContent

      // ✏️ 직접 해보기 5 — 위 userInput 을 target3 에 '안전한 쪽' 으로 넣어 보세요.
      //                   화면에 태그가 글자 그대로 보이면 성공입니다.

      // ── 섹션 6: innerText 와의 차이 ──

      // textContent 와 비슷한 innerText 도 있습니다.
      // 차이는 "화면에 실제로 보이는가" 를 따지는지 여부입니다.
      //   textContent : HTML 에 적힌 글자를 그대로 (숨겨진 것도 포함)
      //   innerText   : 화면에 보이는 글자만
      //
      // innerText 는 화면 계산을 하느라 느립니다.
      // 특별한 이유가 없으면 textContent 를 쓰세요.

      // 이 파일 화면에 #mixedTarget 이라는 문단이 하나 있습니다.
      // 화면에는 "보이는 글자" 만 보이지만, 그 안에 감춰 둔 " 숨은 글자" 가 더 있습니다.

      // ✏️ 직접 해보기 6 — #mixedTarget 을 textContent 로 읽을 때와
      //                   innerText 로 읽을 때 결과가 같을까요, 다를까요?
      //                   예상한 뒤 둘 다 찍어서 비교해 보세요.

      // ── 섹션 7: 자주 하는 실수 ──

      // [실수 1] 괄호를 붙임
      // target1.textContent("안녕");
      // 실수: TypeError: target1.textContent is not a function
      //       textContent 는 속성입니다. = 로 값을 넣습니다.

      // [실수 2] null 에 값을 넣으려 함
      // document.querySelector("#없는아이디").textContent = "안녕";
      // 실수: TypeError: Cannot set properties of null (setting 'textContent')
      //       선택자 오타이거나 script 위치 문제입니다. (개념01 섹션 7)

      // [실수 3] innerHTML 에 배열을 그대로 넣기 (섹션 4에서 봤습니다)

      // [실수 4] 화면에서 읽은 값으로 바로 계산 (섹션 2)
      //       화면의 값은 언제나 문자열입니다. Number( ) 로 바꾸세요.

      // [실수 5] textContent 로 태그를 넣고 왜 안 되냐고 하기 (섹션 3)

      // ── 정리 ──

      // 1. 요소.textContent = "글자"  — 글자만. 기본은 이걸 쓴다.
      // 2. 요소.innerHTML = "<b>x</b>" — 태그로 해석된다.
      // 3. 화면에서 읽은 값은 항상 문자열이다. 계산하려면 Number( ).
      // 4. 배열 → map → join("") → innerHTML 이 목록 만들기의 기본 패턴.
      // 5. 사용자가 입력한 값은 절대 innerHTML 에 바로 넣지 않는다.

      // ============================================================
      // 직접 해보기 정답
      // ============================================================
      //
      // 1) target1.textContent = "홍길동";
      //
      // 2) numberTarget.textContent = 10;
      //    console.log(Number(numberTarget.textContent) + 5);
      //    // 콘솔: 15
      //    → Number( ) 를 빼면 "105" 가 나옵니다. 화면에서 읽은 값은 문자열이라
      //      + 가 더하기가 아니라 이어붙이기가 되기 때문입니다. (섹션 2)
      //
      // 3) target3.innerHTML = "<em>기울임</em>";
      //
      // 4) document.querySelector("#menuList").innerHTML =
      //      menu.map((item) => `<li>${item.name}</li>`).join("");
      //
      // 5) target3.textContent = userInput;
      //    // 화면: <img src=x onerror="alert('공격')">   ← 태그가 글자로 보입니다
      //
      //    정말 안전한지 확인해 보려면
      //    console.log(target3.querySelector("img"));
      //    // 콘솔: null
      //    → img 태그가 아예 만들어지지 않았다는 뜻입니다. 글자로만 들어갔으니까요.
      //      innerHTML 로 넣었다면 진짜 img 태그가 생기고 onerror 가 실행됩니다.
      //
      // 6) const mixed = document.querySelector("#mixedTarget");
      //
      //    console.log(mixed.textContent);
      //    // 콘솔: 보이는 글자 숨은 글자
      //    → 숨겨 둔 span 의 글자까지 나옵니다.
      //      textContent 는 HTML 에 적힌 글자를 그대로 주기 때문입니다.
      //
      //    console.log(mixed.innerText);
      //    // 콘솔: 보이는 글자
      //    → 숨은 글자가 빠졌습니다. innerText 는 화면에 실제로 보이는 것만 줍니다.
      //      이것이 두 속성의 실질적인 차이입니다.
      //
      //    [주의] 요소 '자신' 을 display: none 으로 감춘 경우에는 둘이 같아집니다.
      //           그때는 innerText 도 textContent 와 같은 값을 돌려줍니다.
      //           차이가 드러나는 건 이 예처럼 '보이는 요소 안에 숨은 자식' 이 있을 때입니다.
    </script>
  </body>
</html>
