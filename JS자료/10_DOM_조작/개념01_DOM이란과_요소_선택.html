<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>10단원 개념01 - DOM 이란과 요소 선택</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .box {
        background: #e8f0fe;
        padding: 10px;
        margin: 6px 0;
      }
    </style>
  </head>
  <body>
    <h1>개념 01 — DOM 이란과 요소 선택</h1>

    <p class="guide">
      이 파일을 더블클릭해서 브라우저로 열고, <strong>F12</strong> 를 눌러 개발자도구의
      <strong>Console</strong> 탭을 함께 보세요. 코드의 결과가 거기에 찍힙니다.
    
      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 이 파일 위쪽의
      <code>&lt;style&gt;</code> 과 <code>&lt;body&gt;</code> 는 화면 모양을 만드는 코드입니다.
      이 자료에서는 가르치지 않습니다. <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h2 id="title">원래 제목</h2>
      <p class="box">첫 번째 상자</p>
      <p class="box">두 번째 상자</p>
      <p class="box">세 번째 상자</p>
      <button id="myButton">버튼</button>
    </div>

    <script>
      // ============================================================
      // 10단원 · 개념 01 — DOM 이란과 요소 선택
      // ------------------------------------------------------------
      // 실행: 이 파일을 브라우저로 열고 F12 → Console 탭
      // ============================================================
      //
      // 지금까지는 터미널에 글자만 찍었습니다. 이제 '화면'을 다룹니다.
      //
      // 브라우저는 HTML 을 읽어서 태그 하나하나를 자바스크립트가 다룰 수 있는
      // 객체로 만들어 둡니다. 이 객체들의 모음을 DOM 이라고 합니다.
      //   Document Object Model = 문서를 객체로 만든 모형
      //
      // 우리가 할 일은 두 가지뿐입니다.
      //   1) 원하는 태그를 '고른다'   ← 이 파일
      //   2) 고른 것을 '바꾼다'       ← 개념02부터

      // ── 섹션 1: document — 문서 전체를 가리키는 객체 ──

      console.log(document.title);
      // 콘솔: 10단원 개념01 - DOM 이란과 요소 선택
      // head 안의 title 태그 내용입니다.

      console.log(typeof document);
      // 콘솔: object
      // document 는 브라우저가 미리 만들어 둔 객체입니다.
      // 07단원에서 배운 객체와 똑같습니다. 점으로 속성을 꺼내고 메소드를 부릅니다.

      // ✏️ 직접 해보기 1 — console.log(document.body) 를 찍어 보세요.
      //   찍힌 결과 왼쪽의 ▶ 삼각형을 눌러 펼쳐 보세요.
      //   태그가 태그를 품고 있는 나무 모양이 보입니다. 그게 DOM 입니다.

      // ── 잠깐: 내 화면에서 선택자를 어떻게 알아내나 ──
      //
      // 이 자료는 "id 가 title 인 요소" 처럼 답을 알려 주지만,
      // 나중에 직접 만들 때는 스스로 찾아야 합니다. 방법은 아주 쉽습니다.
      //
      //   ① 바꾸고 싶은 부분에 마우스 오른쪽 클릭
      //   ② [검사] 를 누릅니다 (개발자도구가 Elements 탭으로 열립니다)
      //   ③ 파랗게 선택된 줄에서 id="..." 나 class="..." 를 읽습니다
      //
      // 그 값을 그대로 "#아이디" 또는 ".클래스" 로 쓰면 됩니다.
      // HTML 을 못 읽어도 이 세 단계만 하면 선택자를 알아낼 수 있습니다.

      // ── 섹션 2: querySelector — 하나 고르기 ──

      // CSS 선택자를 그대로 씁니다. 조건에 맞는 '첫 번째 하나'를 돌려줍니다.
      //
      //     #아이디      아이디로
      //     .클래스      클래스로
      //     태그이름     태그로

      const title = document.querySelector("#title");
      console.log(title);
      // 콘솔: <h2 id="title">원래 제목</h2>

      const firstBox = document.querySelector(".box");
      console.log(firstBox);
      // 콘솔: <p class="box">첫 번째 상자</p>
      // 상자가 세 개인데 첫 번째만 나왔습니다. querySelector 는 하나만 고릅니다.

      const button = document.querySelector("button");
      console.log(button);
      // 콘솔: <button id="myButton">버튼</button>

      // 고른 요소도 객체입니다. 속성을 꺼내 볼 수 있습니다.
      console.log(title.textContent);
      // 콘솔: 원래 제목
      console.log(title.id);
      // 콘솔: title

      // ✏️ 직접 해보기 2 — button 의 textContent 를 콘솔에 찍어 보세요.

      // ── 섹션 3: 못 찾으면 null ──

      const notExist = document.querySelector("#없는아이디");
      console.log(notExist);
      // 콘솔: null

      // null 에서 무언가를 꺼내려 하면 에러가 납니다. (07단원에서 봤죠)
      // console.log(notExist.textContent);
      // 실수: TypeError: Cannot read properties of null (reading 'textContent')
      //
      // "Cannot read properties of null" 은 DOM 을 다룰 때 가장 많이 보는 에러입니다.
      // 십중팔구 선택자 오타이거나, 아직 만들어지지 않은 요소를 고른 것입니다.

      // 안전하게 쓰려면 확인하고 씁니다.
      if (notExist) {
        console.log("찾았습니다");
      } else {
        console.log("그런 요소가 없습니다");
      }
      // 콘솔: 그런 요소가 없습니다

      // ✏️ 직접 해보기 3 — ".없는클래스" 를 골라 보고, if 로 확인해서
      //                   있으면 "있음", 없으면 "없음" 을 콘솔에 찍어 보세요.

      // ── 섹션 4: querySelectorAll — 전부 고르기 ──

      const boxes = document.querySelectorAll(".box");
      console.log(boxes);
      // 콘솔: NodeList(3) [p.box, p.box, p.box]
      //
      // 처음 보는 영어가 나왔습니다. 읽을 수 있어야 검색도 질문도 할 수 있습니다.
      //   '노드(node)' 는 DOM 에서 태그 하나하나를 부르는 이름입니다.
      //                이 자료에서는 '요소' 와 거의 같은 뜻으로 보시면 됩니다.
      //   'NodeList'  는 그 노드들을 담은 목록. 즉 "고른 요소 3개의 묶음" 입니다.

      console.log(boxes.length);
      // 콘솔: 3

      // 배열처럼 인덱스로 꺼낼 수 있습니다.
      console.log(boxes[0].textContent);
      // 콘솔: 첫 번째 상자
      console.log(boxes[2].textContent);
      // 콘솔: 세 번째 상자

      // forEach 도 됩니다.
      boxes.forEach((box, index) => {
        console.log(`${index}번 상자: ${box.textContent}`);
      });
      // 콘솔: 0번 상자: 첫 번째 상자
      // 콘솔: 1번 상자: 두 번째 상자
      // 콘솔: 2번 상자: 세 번째 상자

      // [주의] NodeList 는 배열처럼 보이지만 진짜 배열이 아닙니다.
      console.log(Array.isArray(boxes));
      // 콘솔: false

      // 그래서 map, filter 는 쓸 수 없습니다.
      // boxes.map(...)  →  TypeError: boxes.map is not a function
      //
      // 09단원의 스프레드로 진짜 배열로 바꾸면 다 쓸 수 있습니다.
      const boxArray = [...boxes];
      console.log(Array.isArray(boxArray));
      // 콘솔: true
      console.log(boxArray.map((b) => b.textContent));
      // 콘솔: ['첫 번째 상자', '두 번째 상자', '세 번째 상자']

      // ✏️ 직접 해보기 4 — 모든 .box 의 글자를 forEach 로 콘솔에 찍어 보세요.

      // ── 섹션 5: getElementById — 옛날 방식 ──

      // querySelector 가 생기기 전에 쓰던 방법입니다. 아직도 자주 보입니다.
      const titleOld = document.getElementById("title");
      console.log(titleOld);
      // 콘솔: <h2 id="title">원래 제목</h2>

      // 차이점:
      //   getElementById("title")   → # 을 붙이지 않습니다
      //   querySelector("#title")   → # 을 붙입니다
      //
      // 아이디로 찾을 때는 getElementById 가 아주 조금 빠릅니다.
      // 하지만 CSS 선택자를 그대로 쓸 수 있는 querySelector 가 훨씬 편해서
      // 요즘은 querySelector 로 통일해서 씁니다. 이 자료도 그렇게 합니다.

      // ✏️ 직접 해보기 5 — 같은 버튼을 getElementById 와 querySelector 로 각각 고른 뒤,
      //                   === 로 비교한 결과를 콘솔에 찍어 보세요. (아이디는 myButton)

      // ── 섹션 6: 선택자 더 써 보기 ──

      // CSS 선택자를 아는 만큼 그대로 쓸 수 있습니다.
      console.log(document.querySelector(".demo h2").textContent);
      // 콘솔: 원래 제목
      // .demo 안의 h2 라는 뜻입니다.

      console.log(document.querySelectorAll(".demo p").length);
      // 콘솔: 3

      console.log(document.querySelector("p.box").textContent);
      // 콘솔: 첫 번째 상자
      // p 이면서 box 클래스인 것

      // ✏️ 직접 해보기 6 — .demo 안에 있는 button 을 선택자 하나로 골라
      //                   textContent 를 콘솔에 찍어 보세요.

      // ── 섹션 7: script 를 어디에 둘 것인가 ──

      // 이 파일의 script 태그는 body 의 '맨 아래' 에 있습니다. 이유가 있습니다.
      //
      // 브라우저는 HTML 을 위에서 아래로 읽습니다.
      // script 를 head 에 두면, 아직 만들어지지 않은 태그를 고르려 해서
      // querySelector 가 null 을 돌려주고 에러가 납니다.
      //
      // 해결 방법 두 가지:
      //   1) script 를 body 맨 아래에 둔다   ← 이 자료의 방식
      //   2) head 에 두되 script 태그에 defer 를 붙인다
      //      (defer 는 "HTML 을 다 읽은 다음에 실행해라" 라는 뜻입니다)
      //
      // "Cannot read properties of null" 이 났는데 선택자가 맞다면
      // script 위치부터 확인하세요.
      //
      // 참고 — 주석 안에도 script 를 닫는 태그를 그대로 쓰면 안 됩니다.
      // 브라우저는 주석인지 아닌지 따지지 않고 그 자리에서 script 를 끝내 버립니다.
      // 그러면 아래 코드가 전부 실행되지 않고 화면에 글자로 새어 나옵니다.

      // ✏️ 직접 해보기 7 — 이 파일의 script 태그를 head 안으로 옮기면
      //                   어떤 에러가 날까요? 먼저 예상을 적어 본 다음 정답과 맞춰 보세요.

      // ── 섹션 8: 자주 하는 실수 ──

      // [실수 1] # 이나 . 을 빠뜨림
      console.log(document.querySelector("title"));
      // 콘솔: <title>10단원 개념01 - DOM 이란과 요소 선택</title>
      // 실수: "title" 은 title '태그' 를 찾습니다. id 를 찾으려면 "#title" 입니다.
      //       에러가 안 나고 엉뚱한 게 잡히니 더 헷갈립니다.

      // [실수 2] querySelector 로 여러 개를 고르려 함
      console.log(document.querySelector(".box").textContent);
      // 콘솔: 첫 번째 상자
      // 실수: 항상 첫 번째 하나뿐입니다. 전부 고르려면 querySelectorAll.

      // [실수 3] querySelectorAll 결과에 바로 값을 쓰기
      // boxes.textContent = "바꾸기";
      // 실수: 여러 개 묶음이라 하나처럼 다룰 수 없습니다.
      //       forEach 로 하나씩 처리해야 합니다.

      // [실수 4] NodeList 에 map 을 씀 (섹션 4에서 봤습니다)

      // ── 정리 ──

      // 1. document 는 문서 전체를 가리키는 객체다.
      // 2. querySelector(선택자)    조건에 맞는 첫 하나. 없으면 null.
      // 3. querySelectorAll(선택자) 전부. NodeList(배열 비슷한 것).
      // 4. 선택자는 CSS 와 같다. #아이디 .클래스 태그이름
      // 5. NodeList 는 배열이 아니다. map 을 쓰려면 [...nodeList].
      // 6. script 는 body 맨 아래에 둔다.

      // ============================================================
      // 직접 해보기 정답
      // ============================================================
      //
      // 1) console.log(document.body);
      //    → body 태그와 그 안의 모든 내용이 통째로 찍힙니다.
      //
      // 2) console.log(button.textContent);   // 콘솔: 버튼
      //
      // 3) const none = document.querySelector(".없는클래스");
      //    if (none) {
      //      console.log("있음");
      //    } else {
      //      console.log("없음");
      //    }
      //    // 콘솔: 없음
      //    → 없는 것을 고르면 null 입니다. null 은 falsy 라서 else 로 갑니다.
      //      (03단원에서 배운 falsy 가 여기서 그대로 쓰입니다)
      //
      // 4) document.querySelectorAll(".box").forEach((box) => {
      //      console.log(box.textContent);
      //    });
      //    // 콘솔: 첫 번째 상자 / 두 번째 상자 / 세 번째 상자
      //
      // 5) const b1 = document.getElementById("myButton");
      //    const b2 = document.querySelector("#myButton");
      //    console.log(b1 === b2);
      //    // 콘솔: true
      //    → 찾는 방법만 다를 뿐 고른 것은 '같은 요소 하나' 입니다.
      //      getElementById 는 # 없이, querySelector 는 # 를 붙인다는 것만 다릅니다.
      //
      // 6) console.log(document.querySelector(".demo button").textContent);
      //    // 콘솔: 버튼
      //    → ".demo button" 은 "demo 클래스 안에 있는 button" 이라는 뜻입니다.
      //
      // 7) TypeError: Cannot read properties of null 이 납니다.
      //    → 브라우저는 위에서 아래로 읽습니다. head 는 body 보다 먼저 읽히므로
      //      script 가 실행되는 시점에는 #title 태그가 아직 만들어져 있지 않습니다.
      //      그래서 querySelector 가 null 을 돌려주고, 그 null 에서 무언가를
      //      꺼내려는 순간 섹션 3에서 본 그 에러가 납니다.
      //      직접 확인해 보고 싶다면 옮겨서 본 뒤 꼭 되돌려 놓으세요.
    </script>
  </body>
</html>
