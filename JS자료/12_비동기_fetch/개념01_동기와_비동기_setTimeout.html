<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>12단원 개념01 - 동기와 비동기, setTimeout</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      button {
        padding: 8px 16px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        margin-right: 6px;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 8px;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <h1>개념 01 — 동기와 비동기, setTimeout</h1>

    <p class="guide">
      브라우저로 열고 <strong>F12 → Console</strong> 을 반드시 함께 보세요. 이 단원은
      <strong>실행 순서</strong>가 핵심이라 콘솔을 봐야 이해됩니다.
    
      <br /><br />
      <strong>HTML 과 CSS 는 몰라도 됩니다.</strong> 이 파일 위쪽의
      <code>&lt;style&gt;</code> 과 <code>&lt;body&gt;</code> 는 화면 모양을 만드는 코드입니다.
      이 자료에서는 가르치지 않습니다. <code>&lt;script&gt;</code> 안부터 읽으세요.
    </p>

    <div class="demo">
      <h3>① 타이머</h3>
      <button id="timerBtn">3초 뒤 알림</button>
      <div class="output" id="out1">버튼을 눌러 보세요</div>

      <h3>② 카운트다운</h3>
      <button id="countBtn">5부터 카운트다운</button>
      <button id="stopBtn">멈추기</button>
      <div class="output" id="out2">대기 중</div>
    </div>

    <script>
      // ============================================================
      // 12단원 · 개념 01 — 동기와 비동기, setTimeout
      // ------------------------------------------------------------
      // 실행: 브라우저로 열고 F12 → Console 을 꼭 함께 보세요.
      // ============================================================
      //
      // 지금까지 코드는 전부 '위에서 아래로 차례대로' 실행됐습니다.
      // 이것을 동기(synchronous)라고 합니다.
      //
      // 그런데 오래 걸리는 일(서버에서 데이터 받기, 3초 기다리기)을
      // 그렇게 하면 그동안 화면이 완전히 멈춰 버립니다.
      //
      // 그래서 "일단 넘어가고, 끝나면 그때 알려 줘" 하는 방식이 있습니다.
      // 이것이 비동기(asynchronous)입니다.

      // ── 섹션 1: 실행 순서를 눈으로 보기 ──

      console.log("1번");

      setTimeout(() => {
        console.log("2번 — setTimeout 0초");
      }, 0);

      console.log("3번");

      // 콘솔: 1번
      // 콘솔: 3번
      // 콘솔: 2번 — setTimeout 0초
      //
      // 0초인데도 2번이 마지막입니다! 왜일까요?
      //
      //   setTimeout 은 "이 함수를 나중에 실행해 줘" 라고 예약만 합니다.
      //   지금 하던 일(3번 출력)을 전부 끝낸 다음에야 예약된 것을 꺼내 실행합니다.
      //
      // "꺼낸다" 고 했으니 어딘가 담아 두는 곳이 있겠죠. 그림으로 보면 이렇습니다.
      //
      //     [지금 할 일]                    [예약해 둔 일]
      //     ┌─────────────────┐             ┌─────────────────┐
      //     │ console.log("1번") │            │                 │
      //     │ console.log("3번") │            │  2번 콜백        │ ← setTimeout 이
      //     └─────────────────┘             └─────────────────┘    여기 넣어 둡니다
      //            │                                 │
      //            ↓                                 ↓
      //     이쪽이 완전히 비어야  ─────────→  그때서야 여기서 하나 꺼내 옵니다
      //
      //   그래서 0초여도 순서가 "1번 → 3번 → 2번" 입니다.
      //   0초는 "기다리는 시간이 0" 이라는 뜻이지 "지금 당장" 이 아닙니다.
      //
      // 이것이 비동기의 핵심입니다. 시간이 0이어도 '나중' 입니다.
      // 처음 보면 반드시 헷갈립니다. 콘솔로 순서를 직접 확인하세요.

      // ✏️ 직접 해보기 1 — 위 setTimeout 의 0 을 500 으로 바꾸면
      //                   출력 순서가 달라질까요? 먼저 예상하고 바꿔서 확인하세요.

      // ── 섹션 2: setTimeout — 한 번만 나중에 ──

      //     setTimeout(실행할함수, 밀리초)
      //                ^^^^^^^^^^  ^^^^^^
      //                콜백!        1000 = 1초
      //
      // 08단원의 콜백이 또 나왔습니다. 여기서도 괄호를 붙이면 안 됩니다.

      const out1 = document.querySelector("#out1");

      document.querySelector("#timerBtn").addEventListener("click", () => {
        out1.textContent = "3초를 세는 중...";
        console.log("타이머 시작");

        setTimeout(() => {
          out1.textContent = "3초가 지났습니다!";
          console.log("3초 경과");
        }, 3000);

        console.log("이 줄은 3초를 기다리지 않고 바로 실행됩니다");
      });

      // 버튼을 누르면 콘솔에
      //   타이머 시작
      //   이 줄은 3초를 기다리지 않고 바로 실행됩니다
      //   (3초 뒤) 3초 경과
      //
      // 중요한 것: 3초를 기다리는 동안에도 페이지는 멀쩡히 움직입니다.
      // 다른 버튼도 누를 수 있습니다. 이것이 비동기의 장점입니다.

      // ✏️ 직접 해보기 2 — 1초 뒤에 콘솔에 "1초!" 를 찍어 보세요.

      // ── 섹션 3: 값을 나중에 받으면 생기는 문제 ──

      // 초보자가 반드시 한 번은 하는 실수입니다.

      let result = "아직 없음";

      setTimeout(() => {
        result = "받아온 값";
      }, 1000);

      console.log(result);
      // 콘솔: 아직 없음
      //
      // 1초 뒤에 값이 들어오는데, 그 전에 읽어 버렸습니다.
      //
      // "왜 값이 비어 있지?" 하는 문제의 정체가 이것입니다.
      // 서버에서 데이터를 받아올 때 똑같은 일이 벌어집니다.
      //
      // 해결책: 값을 쓰는 코드도 '나중에' 실행되게 안으로 넣습니다.

      setTimeout(() => {
        result = "받아온 값";
        console.log("안에서 읽으면:", result);
        // 콘솔: 안에서 읽으면: 받아온 값
      }, 1000);

      // 이 "안으로 넣기" 가 계속 겹치면 코드가 깊어집니다.
      // 그 문제를 해결하는 것이 개념02의 Promise 와 개념04의 async/await 입니다.

      // ✏️ 직접 해보기 3 — setTimeout 을 하나 더 써서, 1.5초 뒤에 result 를
      //                   '밖에서' 읽어 보세요. 이번에는 값이 들어 있을까요?

      // ── 섹션 4: setInterval — 반복해서 ──

      //     setInterval(실행할함수, 밀리초)   지정한 간격마다 계속 실행
      //     clearInterval(아이디)             멈추기

      const out2 = document.querySelector("#out2");
      let timerId = null; // 멈추려면 아이디를 보관해야 합니다

      document.querySelector("#countBtn").addEventListener("click", () => {
        if (timerId !== null) {
          console.log("이미 돌고 있습니다");
          return; // 두 번 눌러도 두 개가 돌지 않도록 (조기 반환)
        }

        let count = 5;
        out2.textContent = count;
        console.log("카운트다운 시작");

        timerId = setInterval(() => {
          count--;
          out2.textContent = count > 0 ? count : "발사!";
          console.log("남은 초:", count);

          if (count <= 0) {
            clearInterval(timerId); // ★ 멈추지 않으면 영원히 돕니다
            timerId = null;
            console.log("카운트다운 끝");
          }
        }, 1000);
      });

      document.querySelector("#stopBtn").addEventListener("click", () => {
        if (timerId === null) {
          console.log("멈출 게 없습니다");
          return;
        }
        clearInterval(timerId);
        timerId = null;
        out2.textContent = "멈췄습니다";
        console.log("사용자가 멈춤");
      });

      // setInterval 은 반드시 멈추는 조건을 같이 만들어야 합니다.
      // 안 그러면 페이지를 닫을 때까지 계속 돕니다.
      // 04단원의 무한 루프와 비슷한 실수입니다.

      // ✏️ 직접 해보기 4 — 카운트다운을 10부터 시작하도록 바꿔 보세요.

      // ── 섹션 5: 왜 비동기가 필요한가 ──

      // 만약 3초 기다리기를 동기로 한다면 이렇게 됩니다.
      //
      //   const end = Date.now() + 3000;
      //   while (Date.now() < end) {}      ← 3초 동안 계속 돌기
      //
      // 이러면 그 3초 동안
      //   - 버튼이 안 눌립니다
      //   - 스크롤이 안 됩니다
      //   - 화면이 하얗게 멈춘 것처럼 보입니다
      //
      // 자바스크립트는 한 번에 한 가지 일만 합니다(싱글 스레드).
      // 그래서 오래 걸리는 일은 반드시 비동기로 처리해야 합니다.
      //
      // 서버에서 데이터를 받아오는 데 0.5초가 걸린다면,
      // 그동안 화면이 멈추면 안 되겠죠. 그래서 fetch 도 비동기입니다. (개념03)

      // ✏️ 직접 해보기 5 — 위 while 방식으로 3초를 버티는 동안 이 페이지의
      //                   버튼을 누르면 어떻게 될까요? 말로 설명해 보세요.
      //                   (실제로 실행하지는 마세요. 화면이 3초간 멈춥니다)

      // ── 섹션 6: 자주 하는 실수 ──

      // [실수 1] setTimeout 의 콜백에 괄호를 붙임
      // setTimeout(sayHi(), 1000);
      // 실수: 즉시 실행되고 결과인 undefined 가 예약됩니다. 1초 뒤엔 아무 일도 없습니다.
      //       setTimeout(sayHi, 1000) 또는 setTimeout(() => sayHi(), 1000)

      // [실수 2] 시간 단위를 초로 착각
      // setTimeout(fn, 3);
      // 실수: 3초가 아니라 3밀리초(0.003초)입니다. 3000 이라고 써야 합니다.

      // [실수 3] 비동기 결과를 밖에서 바로 읽음 (섹션 3)

      // [실수 4] clearInterval 을 안 함 (섹션 4)

      // [실수 5] setTimeout 이 정확한 시간을 보장한다고 생각
      // "최소 그만큼 뒤" 라는 뜻입니다. 하던 일이 안 끝났으면 더 늦어집니다.

      // ── 정리 ──

      // 1. 동기 = 위에서 아래로 차례대로 / 비동기 = 예약해 두고 나중에
      // 2. setTimeout(콜백, 밀리초) — 0 이어도 지금 하던 일 다음에 실행된다.
      // 3. 1000 = 1초. 콜백에 괄호를 붙이지 않는다.
      // 4. 비동기로 받은 값을 밖에서 바로 읽으면 아직 안 들어와 있다.
      // 5. setInterval 은 clearInterval 로 반드시 멈춘다.
      // 6. 자바스크립트는 한 번에 한 가지만 하므로 오래 걸리는 일은 비동기로.

      // ============================================================
      // 직접 해보기 정답
      // ============================================================
      //
      // 1) 달라지지 않습니다. 여전히 1번 → 3번 → 2번 입니다.
      //    → 0 이든 500 이든 "예약해 두고 나중에" 라는 점은 똑같습니다.
      //      숫자는 "얼마나 더 기다렸다가" 를 정할 뿐, "지금 할 일" 보다
      //      먼저 실행되게 만들지는 못합니다.
      //      바뀌는 것은 순서가 아니라 2번이 나오기까지의 시간뿐입니다.
      //
      // 2) setTimeout(() => console.log("1초!"), 1000);
      //
      // 3) setTimeout(() => {
      //      console.log("1.5초 뒤:", result);
      //    }, 1500);
      //    // 콘솔: 1.5초 뒤: 받아온 값
      //    → 이번에는 값이 들어 있습니다. 섹션 3 위쪽에서 실패한 이유는
      //      '밖에서 읽어서' 가 아니라 '너무 일찍 읽어서' 였습니다.
      //      다만 "몇 초 뒤에 읽으면 되겠지" 는 좋은 방법이 아닙니다.
      //      서버가 느리면 또 실패하니까요. 그래서 개념02의 Promise 가 필요합니다.
      //
      // 4) let count = 10;   (5 를 10 으로 바꾸면 됩니다)
      //
      // 5) 아무 버튼도 눌리지 않습니다. 눌러도 반응이 없다가,
      //    3초가 끝나는 순간 그동안 누른 것이 한꺼번에 처리됩니다.
      //    → 자바스크립트는 한 번에 한 가지만 하는데(싱글 스레드),
      //      while 이 그 하나를 3초 내내 붙잡고 있기 때문입니다.
      //      클릭은 사라지지 않고 [예약해 둔 일] 에 쌓여 있다가 나중에 처리됩니다.
      //      setTimeout 은 그 자리를 붙잡지 않으므로 화면이 멀쩡히 움직입니다.
    </script>
  </body>
</html>
