<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>12단원 심화문제 - 비동기</title>
    <style>
      body {
        font-family: "맑은 고딕", sans-serif;
        line-height: 1.7;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        border-bottom: 3px solid #333;
        padding-bottom: 8px;
      }
      .guide {
        background: #fff8dc;
        border-left: 4px solid #f0c040;
        padding: 12px 16px;
      }
      .demo {
        background: #f5f5f5;
        border: 1px solid #ddd;
        padding: 16px;
        margin: 20px 0;
      }
      .demo h3 {
        margin: 14px 0 6px;
        font-size: 15px;
        color: #555;
      }
      button {
        padding: 6px 14px;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        margin-right: 6px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .output {
        background: #fff;
        border: 1px solid #ccc;
        padding: 10px;
        margin-top: 8px;
        min-height: 24px;
        white-space: pre-line;
      }
      .output.error {
        color: #c00;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>12단원 심화문제 — 비동기</h1>

    <p class="guide">
      <strong>이건 선택 과제입니다.</strong> 연습문제를 다 푼 사람만 하세요.
      안 풀어도 다음 단원에 지장 없습니다.<br />
      <strong>F12 → Console</strong> 을 반드시 함께 보세요.

      <br /><br />
      심화 1·2는 <strong>인터넷이 없어도</strong> 됩니다. 아래 delay 함수로 흉내 내기 때문입니다.
      심화 3만 인터넷이 필요합니다.
    </p>

    <div class="demo">
      <h3>심화 1 — 순서대로 vs 동시에</h3>
      <button id="seqBtn">순서대로 (느림)</button>
      <button id="allBtn">동시에 (빠름)</button>
      <div class="output" id="out1">버튼을 눌러 보세요</div>

      <h3>심화 2 — 실패하면 다시 시도</h3>
      <button id="retryBtn">불안정한 작업 실행</button>
      <div class="output" id="out2">대기 중</div>

      <h3>심화 3 — 중복 요청 막기</h3>
      <button id="loadBtn">불러오기 (연타해 보세요)</button>
      <div class="output" id="out3">대기 중</div>
    </div>

    <!-- 인터넷이 막혀 이 파일이 동작하지 않으면, 바로 아래 줄을 감싼 주석 기호를 지워서 켜세요. 설명은 오프라인_대체.js 맨 위에 있습니다. -->
    <!-- <script src="오프라인_대체.js"></script> -->
    <script>
      // ============================================================
      // 12단원 심화문제 — 비동기
      // ------------------------------------------------------------
      // 실행: 브라우저로 열고 F12 → Console 탭
      // ============================================================

      const BASE_URL = "https://jsonplaceholder.typicode.com";

      // 아래 두 함수는 이미 만들어져 있습니다. 그대로 쓰세요.

      // ms 만큼 기다렸다가 value 를 돌려주는 함수
      function delay(ms, value) {
        return new Promise((resolve) => {
          setTimeout(() => resolve(value), ms);
        });
      }

      // 절반의 확률로 실패하는 불안정한 작업
      function unstableTask() {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            if (Math.random() < 0.5) {
              resolve("작업 성공");
            } else {
              reject(new Error("일시적 오류"));
            }
          }, 300);
        });
      }

      // ───── 심화 1 ───── 순서대로 vs 동시에 (시간 재기)
      // 같은 일을 두 방식으로 하고, 걸린 시간을 비교해 보세요.
      //
      //   seqBtn : delay(500,"A"), delay(500,"B"), delay(500,"C") 를 순서대로 await
      //   allBtn : 같은 셋을 Promise.all 로 한 번에
      //
      // 각각 끝나면 out1 에 "순서대로: A B C (약 1500ms)" 처럼
      // 결과와 걸린 시간을 함께 보여 주세요.
      //
      // 힌트: 시간을 재려면 시작할 때와 끝날 때의 Date.now() 를 빼면 됩니다.
      //       (밀리초 단위 숫자가 나옵니다. 14단원에서 자세히 배웁니다)
      //
      //       const start = Date.now();
      //       ... 작업 ...
      //       const 걸린시간 = Date.now() - start;
      //
      // 기대 결과 (화면):
      //   순서대로 → 약 1500ms  (500 을 세 번 기다림)
      //   동시에   → 약 500ms   (셋을 같이 보내고 제일 늦은 것만 기다림)
      //
      //   숫자는 정확히 1500 이 아니라 1503, 1512 처럼 조금씩 다릅니다. 정상입니다.

      // TODO: 여기에 코드를 쓰세요

      // ───── 심화 2 ───── 실패하면 다시 시도
      // unstableTask 는 절반 확률로 실패합니다.
      // 실패하면 최대 3번까지 다시 시도하는 함수를 만드세요.
      //
      //   - 성공하면 그 값을 돌려주고 끝냅니다
      //   - 실패하면 콘솔에 "1번째 실패, 다시 시도" 를 찍고 재시도합니다
      //   - 3번 다 실패하면 "3번 시도했지만 실패했습니다" 를 out2 에 넣고
      //     error 클래스를 붙입니다
      //
      // 힌트: 반복문 안에서 try/catch 를 씁니다.
      //       성공하면 return 으로 함수를 끝내고,
      //       실패하면 catch 에서 잡고 다음 바퀴로 넘어갑니다.
      //       마지막 바퀴에서도 실패했는지 알려면 i 를 확인하면 됩니다.
      //
      // 기대 결과 (화면):
      //   대부분 1~2번 만에 성공합니다. out2 에 "작업 성공 (2번째 시도)" 처럼 나옵니다.
      //   운이 나쁘면(1/8 확률) 세 번 다 실패해 빨간 글씨가 나옵니다.
      //   여러 번 눌러 두 경우를 다 보세요.

      // TODO: 여기에 코드를 쓰세요

      // ───── 심화 3 ───── 연타해도 한 번만
      // loadBtn 을 빠르게 여러 번 눌러도 요청이 한 번만 나가게 만드세요.
      //
      //   - 요청 중이면 버튼을 잠그고 out3 에 "불러오는 중..."
      //   - 끝나면 버튼을 풀고 결과(글 제목)를 보여 줍니다
      //   - 실패해도 버튼은 반드시 풀려야 합니다
      //   - 콘솔에 "요청 시작" 이 몇 번 찍히는지 세어 보세요. 연타해도 한 번이어야 합니다
      //
      // 주소는 `${BASE_URL}/posts/1` 입니다.
      //
      // 힌트: 방법이 두 가지입니다. 둘 다 해 보면 좋습니다.
      //   ① 버튼 disabled 로 막기 — 눈에도 보여서 사용자에게 친절합니다
      //   ② isLoading 같은 변수로 막기 — 버튼이 없어도 되고 더 확실합니다
      //   실무에서는 둘을 같이 씁니다.
      //
      // 기대 결과 (콘솔): 연타해도 "요청 시작" 이 딱 한 번만 찍힙니다

      // TODO: 여기에 코드를 쓰세요
    </script>
  </body>
</html>
