# ============================================================
# 07단원부터 씁니다. 01~06단원은 PGlite 라서 이게 필요 없습니다.
# ------------------------------------------------------------
#   docker compose up -d      켜기
#   docker compose ps         상태 보기
#   docker compose down       끄기 (자료는 남습니다)
#   docker compose down -v    자료까지 지우기
#
# ★ 접속 정보는 영어로 씁니다.
#   표 이름·칸 이름은 한글을 쓰지만, 계정·DB 이름·컨테이너 이름은
#   도구들이 한글을 못 받는 곳이 많습니다. (도커 컨테이너 이름부터 거절합니다)
# ============================================================
services:
  postgres:
    image: postgres:18-alpine
    container_name: db-material-postgres
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: factory_db
    ports:
      - "5434:5432"   # ★ 5432 도 5433 도 아닙니다. 이미 쓰는 것과 안 부딪히게 비켜 놨습니다
                    #   이 포트도 쓰고 있으면 여기 숫자를 바꾸세요. 에러 메시지에 "port is already allocated" 가 나옵니다
    # ★ pg_stat_statements 를 진짜로 켜 보고 싶으면 아래 주석을 푸세요.
    #   기본은 꺼 둡니다. 10단원 개념02 가 "안 켜면 어떤 에러가 나는지" 를
    #   실제로 보여 주는 자리라서, 켜 두면 그 실습이 안 됩니다.
    #
    #   켠 뒤에는 컨테이너를 다시 만들어야 합니다:  docker compose up -d --force-recreate
    #
    # command: >
    #   -c shared_preload_libraries=pg_stat_statements
    #   -c pg_stat_statements.max=10000
    #   -c pg_stat_statements.track=top
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: db-material-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: factory_db
      MYSQL_USER: factory
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"   # ★ 3306 이 아닙니다. 이미 깔린 MySQL 과 안 부딪히게
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 40
